[package]
name = "budlum-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.94.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

# Fuzz harness'leri. CI'da uzun fuzz run çalıştırılmaz;  sadece
# setup/build edilebilir target setini teslim eder.
# Manuel run: `cargo +nightly fuzz run <target>`.

[dependencies]
# Must track the root crate's bincode major: these targets encode the very
# types whose serialized bytes are hashed into the block hash / state root.
bincode = "1.3"
budlum-core = { path = ".." }
# : zk_verifier target needs ProofEnvelope + DefaultAdapter.
bud-proof = { path = "../budzero/bud-proof" }
libfuzzer-sys = "0.4"
libp2p = "0.57"

[[bin]]
name = "block_deserialize"
path = "fuzz_targets/block_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "consensus_validate"
path = "fuzz_targets/consensus_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_blockchain_serialize"
path = "fuzz_targets/fuzz_blockchain_serialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_deserialize"
path = "fuzz_targets/snapshot_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_deserialize"
path = "fuzz_targets/transaction_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evm_rlp_decode"
path = "fuzz_targets/evm_rlp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evm_mpt_verify"
path = "fuzz_targets/evm_mpt_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "consensus_state_transition"
path = "fuzz_targets/consensus_state_transition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relayer_escrow"
path = "fuzz_targets/relayer_escrow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zk_verifier"
path = "fuzz_targets/zk_verifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reputation"
path = "fuzz_targets/reputation.rs"
test = false
doc = false
bench = false

# The fuzz workspace does not inherit the root profile. Overflow checks are
# enabled so the fuzzer reports arithmetic wraps as findings instead of letting
# them pass silently. `panic = "abort"` is deliberately omitted: libfuzzer needs
# unwinding to catch and report a panic.
[profile.release]
overflow-checks = true

# See the root Cargo.toml for the full rationale. libp2p 0.57.0 is tagged in
# the rust-libp2p tree but not yet on crates.io, and pinning it closes three
# advisories that no published release can: GHSA-vxx9-2994-q338 (yamux),
# GHSA-3v94-mw7p-v465 and GHSA-q2qq-hmj6-3wpp (hickory-proto).
#
# This workspace resolves independently of the root, so it needs its own copy
# of the patch — otherwise its Cargo.lock keeps the vulnerable versions and
# the scanners report them against this manifest.
[patch.crates-io]
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "38b8a2c0e91bf6955f5357adcdd40d3b6683a0dd" }
