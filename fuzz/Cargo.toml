[package]
name = "budlum-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

# The fuzz harnesses. Long fuzz runs are not executed in CI; it only delivers a
# target set that can be set up and built.
# Manual run: `cargo +nightly fuzz run <target>`.

[dependencies]
# Must track the root crate's bincode major: these targets encode the very
# types whose serialized bytes are hashed into the block hash / state root.
bincode = "1.3"
budlum-core = { path = ".." }
# : zk_verifier target needs ProofEnvelope + DefaultAdapter.
bud-proof = { path = "../budzero/bud-proof" }
# The BudL front end had no fuzz coverage at all: 3379 lines of lexer, parser,
# sema and codegen, every existing test feeding it a contract someone wrote by
# hand. `bud-isa` comes along because `compile` takes an `IsaProfile` and
# `bud-compiler` does not re-export it; `bud-vm` because the second target
# executes what the first one compiles.
bud-compiler = { path = "../budzero/bud-compiler" }
bud-isa = { path = "../budzero/bud-isa" }
bud-vm = { path = "../budzero/bud-vm" }
libfuzzer-sys = "0.4"
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "38b8a2c0e91bf6955f5357adcdd40d3b6683a0dd" }

[[bin]]
name = "block_deserialize"
path = "fuzz_targets/block_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "consensus_validate"
path = "fuzz_targets/consensus_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_blockchain_serialize"
path = "fuzz_targets/fuzz_blockchain_serialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_deserialize"
path = "fuzz_targets/snapshot_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_deserialize"
path = "fuzz_targets/transaction_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evm_rlp_decode"
path = "fuzz_targets/evm_rlp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "evm_mpt_verify"
path = "fuzz_targets/evm_mpt_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "consensus_state_transition"
path = "fuzz_targets/consensus_state_transition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relayer_escrow"
path = "fuzz_targets/relayer_escrow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zk_verifier"
path = "fuzz_targets/zk_verifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reputation"
path = "fuzz_targets/reputation.rs"
test = false
doc = false
bench = false

# The fuzz workspace does not inherit the root profile. Overflow checks are
# enabled so the fuzzer reports arithmetic wraps as findings instead of letting
# them pass silently. `panic = "abort"` is deliberately omitted: libfuzzer needs
# unwinding to catch and report a panic.
[profile.release]
overflow-checks = true

[[bin]]
name = "budl_compile"
path = "fuzz_targets/budl_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "budl_compile_then_run"
path = "fuzz_targets/budl_compile_then_run.rs"
test = false
doc = false
bench = false

# Bytecode the compiler did not write. `budl_compile_then_run` only reaches
# the VM through codegen, so it never presents a jump past the end of the
# program, a register index above the file or a `Ret` with an empty call
# stack. The seeds for this target predate it by two years, sitting unread in
# a corpus directory named after a target nobody wrote.
[[bin]]
name = "vm_execute"
path = "fuzz_targets/vm_execute.rs"
test = false
doc = false
bench = false
