[package]
name = "budlum-gates"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "LicenseRef-PolyForm-Shield-1.0.0"
description = "Repository gates, written in Rust rather than shell."
publish = false

# The substring+brace-walk gates could not model nested closures,
# helpers and conditionals; each review round found a new variant. `syn`
# (a real Rust parser) is used for AST-based gates that model the actual
# control flow. The trade-off against the old zero-dependency principle is
# deliberate and documented: correctness of the gate matters more than the
# width of its dependency set, and syn is the de-facto standard, pure-Rust,
# widely-audited parser.
[dependencies]
syn = { version = "2", features = ["full", "visit", "printing", "derive", "parsing"] }
quote = "1"
serde_json = "1"
# The concept-names gate reads config/naming/concept_map.toml (TOML) and the
# patterns in it are Rust `regex` syntax by contract (directive Appendix C).
regex = "1"
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Release hardening (BLG-085): a wrapping operation becomes a panic and the
# panic becomes an exit, as in the node. Tests are unaffected: Cargo builds
# test targets with unwinding whatever this says.
[profile.release]
overflow-checks = true
panic = "abort"
