# .cargo/audit.toml — cargo-audit yapılandırması ( / )
#
# Cargo.lock'taki BİLİNEN danışmaların kanıtlı skip-listesi. cargo-deny
# tarafındaki karşılık ve tam kanıt zinciri: deny.toml [advisories]
# bölümü. Burada listelenmeyen herhangi bir YENİ CVE job'u FAIL eder
# (kural: unmaintained yalnız uyarır, vulnerability fail eder).

[advisories]
ignore = [
    # RUSTSEC-2026-0118 — NSEC3 DoS; yalnız DNSSEC doğrulayan
    # DnssecDnsHandle yolunda. Budlum bunu kullanmaz. `p2p-mdns` ayrıca
    # production/default feature graphından çıkarılmıştır.
    "RUSTSEC-2026-0118",
    # RUSTSEC-2026-0119 — hickory name-compression CPU DoS. Mainnet/testnet
    # binary'leri mDNS dependency/behaviour'ını artık derlemez/oluşturmaz;
    # yalnız açıkça `--features p2p-mdns` ile kurulan devnet buildi etkilenir.
    # Upstream hickory >=0.26 uyumu geldiğinde bu geçici istisna kaldırılmalıdır.
    "RUSTSEC-2026-0119",
]
