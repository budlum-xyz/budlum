
/** BUDSCAN AYARLARI
 *
 * Kilitli tercihler. `lockPref` secilen degeri kullanicinin degistirmesine
 * kapatir; `defaultPref` sadece varsayilani belirler ve kullanici degistirir.
 * Ayrim kasitli: bir ayar, degistirildiginde tarayicinin dogrulama iddiasini
 * bozuyorsa kilitli, bozmuyorsa serbest.
 *
 * UYARI: bu dosyanin ilk satiri bos olmali (Gecko'nun bilinen davranisi).
 */

lockPref("budscan.cfg.version", "0.1.0");

/** ── DOGRULAMA ─────────────────────────────────────────────────────
 *
 * Bu blogun tamami kilitli. Buradaki bir ayarin gevsemesi, adres cubugundaki
 * rozetin yalan soylemesi demektir ve rozet yalan soyluyorsa tarayicinin tek
 * iddiasi kalmaz.
 */

// Dogrulanmamis icerik gosterilir ama etiketlenir. Yasaklamak tarayiciyi
// kullanilmaz yapar ve kullaniciyi hic dogrulama yapmayan baska bir
// tarayiciya gonderir.
lockPref("budscan.verification.refuse_unverified", false);

// Hash'i tutmayan icerik **gosterilmez**. Yukaridaki ayardan farki: orada
// "olculemedi", burada "olculdu ve tutmadi". Ikisi ayni sey degil.
lockPref("budscan.verification.refuse_mismatch", true);

// Rozet en zayif halkayi gosterir. Kapatilamaz: her katmanin gucunu ayri
// gostermek, birlestirmeyi kullaniciya birakmaktir.
lockPref("budscan.badge.show_weakest_link", true);

// Kanit gucu okunamayan bir yukleme `reddedildi` sayilir. Guclu tarafa
// dusmek, kanaldaki bir hatanin sessizce `dogrulandi` rozeti uretmesi olurdu.
lockPref("budscan.verification.default_strength", 0);

/** ── AD KURALI ─────────────────────────────────────────────────────*/

// Ad kuralindan gecmeyen bir ad punycode gosterilir.
lockPref("budscan.name.punycode_on_refusal", true);

// Buyuk harf kucultulmez. Kucultmek UPPER.bud ile upper.bud'u tek kayda
// getirir ve sahipligi ilk kaydedenin belirledigi bir yarisa cevirir.
lockPref("budscan.name.lowercase_input", false);

// Cikplak bir alan adi icin sema tahmin edilmez.
lockPref("budscan.name.guess_https_scheme", false);

/** ── AG ────────────────────────────────────────────────────────────*/

// bud:// bir gecide yonlendirilmez. Yonlendirme, sayfanin kaynagini gecidin
// kaynagi yapar ve iki farkli isim ayni kaynagi paylasir.
lockPref("budscan.network.allow_gateway_redirect", false);

// Sayfa basina azami boyut; budscan::fetch::MAX_CONTENT_BYTES ve
// budlum-core'un MAX_GATEWAY_CONTENT_BYTES degeriyle ayni. Uc yerde ayni
// olmasi tesaduf degil: iki farkli sinir, birinin digerinin reddettigini
// kabul ettigi bir bosluk acar.
lockPref("budscan.network.max_content_bytes", 10485760);

// Yalniz kesinlesmis epoch sinirlari takip edilir. Her basligi takip etmek
// alti saniyelik blokta ayda 248 MB; epoch siniri 24,8 MB.
lockPref("budscan.light_client.epoch_boundaries_only", true);

/** ── GIZLILIK ──────────────────────────────────────────────────────
 *
 * Serbest birakilanlar bilincli: bunlarin degismesi dogrulama iddiasini
 * bozmuyor, yalniz kullanicinin kendi tercihini degistiriyor.
 */

defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("browser.contentblocking.category", "strict");

// Telemetri yok ve bu kilitli: bir tarayicinin ne gorduğunu bildirmesi, o
// tarayicinin kacindigi seyi yapmasi olurdu.
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
