
/** BUDSCAN SETTINGS
 *
 * Locked preferences. `lockPref` closes the chosen value to the user;
 * `defaultPref` only sets a default the user can change. The split is
 * deliberate: a setting is locked when changing it would break the browser's
 * verification claim, and free when it would not.
 *
 * WARNING: the first line of this file has to be empty (known Gecko
 * behaviour).
 */

lockPref("budscan.cfg.version", "0.1.0");

/** ── VERIFICATION ──────────────────────────────────────────────────
 *
 * This whole block is locked. Loosening a setting here means the badge in the
 * address bar lies, and if the badge lies the browser has no claim left.
 */

// Unverified content is shown but labelled. Forbidding it would make the
// browser unusable and send the user to another browser that verifies
// nothing at all.
lockPref("budscan.verification.refuse_unverified", false);

// Content whose hash does not match is **not shown**. The difference from the
// setting above: there it was "could not be measured", here it is "was
// measured and did not match". The two are not the same thing.
lockPref("budscan.verification.refuse_mismatch", true);

// The badge shows the weakest link. It cannot be turned off: showing each
// layer's strength separately would leave the user to combine them.
lockPref("budscan.badge.show_weakest_link", true);

// A load whose evidence strength cannot be read counts as `refused`. Falling
// to the strong side would let an error in the channel silently produce a
// `verified` badge.
lockPref("budscan.verification.default_strength", 0);

/** ── THE NAME RULE ─────────────────────────────────────────────────*/

// A name that does not pass the name rule is displayed as punycode.
lockPref("budscan.name.punycode_on_refusal", true);

// Uppercase is not folded. Folding it would bring UPPER.bud and upper.bud into
// one record and turn ownership into a race decided by whoever registers
// first.
lockPref("budscan.name.lowercase_input", false);

// No scheme is guessed for a bare domain name.
lockPref("budscan.name.guess_https_scheme", false);

/** ── NETWORK ───────────────────────────────────────────────────────*/

// bud:// is not redirected to a gateway. A redirect would make the gateway's
// origin the page's origin, and two different names would share one origin.
lockPref("budscan.network.allow_gateway_redirect", false);

// The maximum size per page; the same as budscan::fetch::MAX_CONTENT_BYTES and
// budlum-core's MAX_GATEWAY_CONTENT_BYTES. Being equal in three places is no
// coincidence: two different limits would open a gap where one accepts what
// the other refuses.
lockPref("budscan.network.max_content_bytes", 10485760);

// Only finalised epoch boundaries are followed. Following every header costs
// 248 MB a month at a six-second block; the epoch boundary costs 24.8 MB.
lockPref("budscan.light_client.epoch_boundaries_only", true);

/** ── PRIVACY ───────────────────────────────────────────────────────
 *
 * What is left free is left free deliberately: changing these does not break
 * the verification claim, it only changes the user's own preference.
 */

defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("browser.contentblocking.category", "strict");

// No telemetry, and that is locked: a browser reporting what it sees would be
// doing the very thing this browser avoids.
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
