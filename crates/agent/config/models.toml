# The Agent model tiers (the 2026-08-13 decision):
#   agent-light  <- DeepSeek-V4-Flash-Base tabanli
#   agent-normal <- DeepSeek-V4-Pro-Base tabanli
# Multiplier-style tier labels (0.5x, 10x and the like) are NOT USED in Agent.
# The weight repository names (third party) are kept as they are, as
# attribution requires.

[tiers]
light = "deepseek-ai/DeepSeek-V4-Flash-Base"
normal = "deepseek-ai/DeepSeek-V4-Pro-Base"

[default]
# 2026-08-13: yontem = LoRA SFT; varsayilan kademe = light.
# Per the K2 decision, the tier choice is re-approved before the first
# fine-tune.
tier = "light"
license = "MIT"
fine_tune_source = "BaseModel"
method = "LoRA"
adapter_dtype = "BF16"

[candidates.light]
base_repo = "deepseek-ai/DeepSeek-V4-Flash-Base"
license = "MIT"
fine_tune_source = "BaseModel"
note = "284B toplam / 13B aktif; LoRA zemini coklu H100 (TP8) sinifi"

[candidates.normal]
base_repo = "deepseek-ai/DeepSeek-V4-Pro-Base"
license = "MIT"
fine_tune_source = "BaseModel"
note = "1.6T toplam / 49B aktif; checkpoint yaklasik 862 GB; veri merkezi filosu"
