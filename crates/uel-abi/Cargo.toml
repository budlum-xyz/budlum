[package]
name = "budlum-uel-abi"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "LicenseRef-PolyForm-Shield-1.0.0"
description = "Universal Execution Layer ABI: the interface, wire types, framing and Unix-socket transport between the Execution Coordinator and the execution-environment workers"
build = "build.rs"

[dependencies]
prost = "0.14.3"
sha2 = "0.11"

[build-dependencies]
prost-build = "0.14.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
