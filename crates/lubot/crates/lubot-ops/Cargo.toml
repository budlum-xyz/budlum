[package]
name = "lubot-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Lubot operator CLI skeleton (register/bond/serve/tune/status)"

[[bin]]
name = "lubot-ops"
path = "src/main.rs"

[dependencies]
lubot-core = { path = "../lubot-core" }
lubot-data = { path = "../lubot-data" }
lubot-integrations = { path = "../lubot-integrations" }
lubot-serve = { path = "../lubot-serve" }
lubot-tune = { path = "../lubot-tune" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
