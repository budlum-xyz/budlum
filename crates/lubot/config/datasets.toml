# Aday veri setleri (bkz. docs/ACIK_KAYNAK_VERI_ARASTIRMASI_2026-08-13.md §3).
# The principle: every set is first registered with B.U.D. as a StorageDeal,
# gets the TrainingCorpus label and has its hash verified; there is NO direct
# external read (closed circuit).

[policy]
# KARAR (2026-08-13): Varyant B - hibrit.
# Acik setler once B.U.D.'a StorageDeal olarak kaydedilir, TrainingCorpus
# gets the label and has its hash verified; the network is the only channel
# Lubot reads from.
entry_channel = "B.U.D. StorageDeal + AiDatasetMetadata::training"
variant = "B-hibrit"

