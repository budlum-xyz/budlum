[workspace]
resolver = "2"
members = [
    "crates/lubot-core",
    "crates/lubot-data",
    "crates/lubot-integrations",
    "crates/lubot-knowledge",
    "crates/lubot-serve",
    "crates/lubot-tune",
    "crates/lubot-ops",
]

# The panic limit: `unwrap` and `expect` are forbidden on the production path.
#
# This workspace had been left outside the gate in the main repo. Measured: a
# single violation (`encode` in `lubot-data/src/jsonl.rs`), and the
# documentation of that violation claimed "in production
# `Result` donen sarmalayici kullanilir" diyordu - oyle bir sarmalayici
# did not exist. Without a gate, the false claim stayed in the tree.
#
# The release profile is not `panic = "abort"` here, but lubot is part of the
# same binary
# icinde kosuyor; bir panik yine sureci dusurur. Testler muaf
# (`clippy.toml`: allow-unwrap-in-tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[profile.release]
lto = true
