[workspace]

[package]
name = "budlum-ee-rv32"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false
description = "Budlum UEL out-of-process deterministic RISC-V 32IM (RV32I+M) interpreter worker (EeId::RV32 = 0x0C)"

[[bin]]
name = "budlum-ee-rv32"
path = "src/main.rs"

[dependencies]
budlum-uel-abi = { path = "../../crates/uel-abi" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Required by `budlum_uel_abi::serve_connection`: `std::panic::catch_unwind`
# converts worker panics into `Fault::WorkerPanic` receipts (Section 8.3.2).
[profile.release]
panic = "unwind"
