[workspace]

[package]
name = "budlum-ee-move"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Budlum UEL out-of-process sequential Move (Aptos) execution worker (EeId::MOVE = 0x04)"

[[bin]]
name = "budlum-ee-move"
path = "src/main.rs"

[dependencies]
budlum-uel-abi = { path = "../../crates/uel-abi" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Required by `budlum_uel_abi::serve_connection`: `std::panic::catch_unwind`
# converts worker panics into `Fault::WorkerPanic` receipts (Section 8.3.2).
[profile.release]
panic = "unwind"
