# Scoped cargo-deny policy for `budlum-ee-move` (`execution/move/deny.toml`).
# Root `.quality/deny.toml` remains strict `unknown-git = "deny"` for `budlum-core`
# (section 8.14 item 4 & WP-32 item 7).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "LicenseRef-PolyForm-Shield-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
