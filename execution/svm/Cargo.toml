[package]
name = "budlum-ee-svm"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license.workspace = true
description = "Out-of-process SVM execution-environment worker on solana-sbpf (EeId::SVM = 0x03)"

[workspace]
resolver = "2"

[workspace.package]
license = "LicenseRef-PolyForm-Shield-1.0.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints]
workspace = true

[dependencies]
budlum-uel-abi = { path = "../../crates/uel-abi" }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
solana-sbpf = { version = "=0.10.0", default-features = false }

[profile.release]
overflow-checks = true
panic = "unwind"
lto = true
codegen-units = 1
