
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.libp2p]
audit-as-crates-io = true

[policy.libp2p-allow-block-list]
audit-as-crates-io = true

[policy.libp2p-connection-limits]
audit-as-crates-io = true

[policy.libp2p-core]
audit-as-crates-io = true

[policy.libp2p-dns]
audit-as-crates-io = true

[policy.libp2p-gossipsub]
audit-as-crates-io = true

[policy.libp2p-identify]
audit-as-crates-io = true

[policy.libp2p-kad]
audit-as-crates-io = true

[policy.libp2p-mdns]
audit-as-crates-io = true

[policy.libp2p-metrics]
audit-as-crates-io = true

[policy.libp2p-noise]
audit-as-crates-io = true

[policy.libp2p-ping]
audit-as-crates-io = true

[policy.libp2p-quic]
audit-as-crates-io = true

[policy.libp2p-request-response]
audit-as-crates-io = true

[policy.libp2p-swarm]
audit-as-crates-io = true

[policy.libp2p-swarm-derive]
audit-as-crates-io = true

[policy.libp2p-tcp]
audit-as-crates-io = true

[policy.libp2p-tls]
audit-as-crates-io = true

[policy.libp2p-upnp]
audit-as-crates-io = true

[policy.libp2p-yamux]
audit-as-crates-io = true

[policy.multistream-select]
audit-as-crates-io = true

[policy.prost-codec]
audit-as-crates-io = true

[policy.rw-stream-sink]
audit-as-crates-io = true

[[exemptions.bindgen]]
version = "0.72.1"
criteria = "safe-to-deploy"
notes = "Build-time dependency of crabgrind; never part of a shipped binary."

[[exemptions.cexpr]]
version = "0.6.0"
criteria = "safe-to-deploy"
notes = "Build-time dependency of bindgen."

[[exemptions.clang-sys]]
version = "1.9.1"
criteria = "safe-to-deploy"
notes = "Build-time dependency of bindgen."

[[exemptions.core-models]]
version = "0.0.7"
criteria = "safe-to-deploy"
notes = "Models of core used by libcrux under cfg(hax) only."

[[exemptions.crabgrind]]
version = "0.3.1"
criteria = "safe-to-deploy"
notes = "Valgrind client requests of libcrux-secrets, constant-time testing only (cfg valgrind_ct_test)."

[[exemptions.crypto-bigint]]
version = "0.7.10"
criteria = "safe-to-deploy"
notes = "RustCrypto (RustCrypto/traits) bignum; the 0.14 elliptic-curve line requires >=0.7.6 for RUSTSEC-2026-0387, so this version is the one the advisory names as fixed. No build script, no unsafe beyond reviewed Montgomery arithmetic."

[[exemptions.elliptic-curve]]
version = "0.14.3"
criteria = "safe-to-deploy"
notes = "RustCrypto trait crate for the curve stack; pulled by k256/p256/p192/p224 for the quantum-canary and secp256k1 surfaces. Version-pinned to the 0.14 line that carries crypto-bigint 0.7 (RUSTSEC-2026-0387 fix)."

[[exemptions.ff]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "zkcrypto field traits, the interface layer of the curve stack; pure trait definitions plus derive, no runtime code of its own."

[[exemptions.ff_derive]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "Proc macro of ff 0.14 (macro-only, no unsafe, no build script)."

[[exemptions.group]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "zkcrypto group traits (semigroups/prime-order groups), interface-only, follows ff 0.14."

[[exemptions.hash2curve]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "RustCrypto hash-to-curve crate extracted from elliptic-curve 0.14; RFC 9380 expand-and-map helpers used by the quantum-canary K1/R1 path."

[[exemptions.hax-lib]]
version = "0.3.7"
criteria = "safe-to-deploy"
notes = "Verification annotations of libcrux; compiled only under cfg(hax)."

[[exemptions.hax-lib]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Verification annotations of libcrux; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros]]
version = "0.3.7"
criteria = "safe-to-deploy"
notes = "Proc macros of hax-lib; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Proc macros of hax-lib; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros-types]]
version = "0.3.7"
criteria = "safe-to-deploy"
notes = "Types of hax-lib-macros; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros-types]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Types of hax-lib-macros; compiled only under cfg(hax)."

[[exemptions.hmac]]
version = "0.13.0"
criteria = "safe-to-deploy"
notes = "Dependency of slh-dsa 0.2 (HMAC for the randomized signing path)."

[[exemptions.k256]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "secp256k1 (RustCrypto), same audited codebase as the previous 0.13.4 pin (NCC Group audit of the ECDSA/Schnorr paths); 0.14 is the line whose dependency graph carries crypto-bigint 0.7 (RUSTSEC-2026-0387 fix)."

[[exemptions.libcrux-intrinsics]]
version = "0.0.9"
criteria = "safe-to-deploy"
notes = "Dependency of libcrux-ml-dsa; the SIMD features that use it are off."

[[exemptions.libcrux-macros]]
version = "0.0.4"
criteria = "safe-to-deploy"
notes = "Proc macros of libcrux-ml-dsa."

[[exemptions.libcrux-ml-dsa]]
version = "0.0.11"
criteria = "safe-to-deploy"
notes = "Second ML-DSA verifier (portable backend only),. Formally verified (hax/F*) Cryspen code; pinned exactly. The AVX2 advisories RUSTSEC-2026-0125 and RUSTSEC-2026-0126 need simd256, which is off."

[[exemptions.libcrux-platform]]
version = "0.0.4"
criteria = "safe-to-deploy"
notes = "CPU feature detection of libcrux-ml-dsa."

[[exemptions.libcrux-secrets]]
version = "0.0.7"
criteria = "safe-to-deploy"
notes = "Secret-integer wrappers of libcrux-ml-dsa."

[[exemptions.libcrux-sha3]]
version = "0.0.11"
criteria = "safe-to-deploy"
notes = "SHA-3 and SHAKE of libcrux-ml-dsa, portable backend."

[[exemptions.libcrux-traits]]
version = "0.0.9"
criteria = "safe-to-deploy"
notes = "Traits crate of libcrux."

[[exemptions.p192]]
version = "0.14.0-rc.15"
criteria = "safe-to-deploy"
notes = "RustCrypto NIST P-192 for the quantum canary; pinned exact (pre-release) to match the elliptic-curve 0.14 stack. No stable 0.14 exists yet; 0.13 would drag crypto-bigint 0.5 back into the graph (RUSTSEC-2026-0387)."

[[exemptions.p224]]
version = "0.14.0-rc.15"
criteria = "safe-to-deploy"
notes = "RustCrypto NIST P-224 for the quantum canary; pinned exact (pre-release) to match the elliptic-curve 0.14 stack (same RUSTSEC-2026-0387 reason as p192)."

[[exemptions.p256]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "RustCrypto NIST P-256 (R1 canary + RFC 9380 suite); same audited codebase line as the 0.13.2 pin, now on the 0.14 graph with crypto-bigint 0.7."

[[exemptions.pastey]]
version = "0.2.3"
criteria = "safe-to-deploy"
notes = "Proc macro dependency of libcrux-sha3."

[[exemptions.pkg-config]]
version = "0.3.34"
criteria = "safe-to-deploy"
notes = "Build-time dependency of bindgen and crabgrind."

[[exemptions.primefield]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "RustCrypto prime-field arithmetic shared by the 0.14 curve crates; pure arithmetic, no build script."

[[exemptions.primeorder]]
version = "0.14.0"
criteria = "safe-to-deploy"
notes = "RustCrypto complete-addition-formulas layer under p192/p224/p256; follows the same audited curve code lineage as 0.13.6."

[[exemptions.proc-macro-error-attr2]]
version = "2.0.0"
criteria = "safe-to-deploy"
notes = "Proc macro helper of proc-macro-error2."

[[exemptions.proc-macro-error2]]
version = "2.0.1"
criteria = "safe-to-deploy"
notes = "Proc macro helper of hax-lib-macros."

[[exemptions.sec1]]
version = "0.8.1"
criteria = "safe-to-deploy"
notes = "RustCrypto SEC1 point-encoding crate (compressed/uncompressed points); serialization only, no unsafe."

[[exemptions.sha3]]
version = "0.11.0"
criteria = "safe-to-deploy"
notes = "Dependency of slh-dsa 0.2 (SHAKE hash functions)."

[[exemptions.shlex]]
version = "1.3.0"
criteria = "safe-to-deploy"
notes = "Build-time dependency of bindgen."

[[exemptions.slh-dsa]]
version = "0.2.0-rc.5"
criteria = "safe-to-deploy"
notes = "RustCrypto SLH-DSA (FIPS 205),; ACVP vectors in tests/vectors/pq are mandatory. A release candidate because 0.1.0 needs signature 2.3.0-pre.4, which cannot be unified with ed25519 2.2 under libp2p."

[[exemptions.tls_codec]]
version = "0.5.0"
criteria = "safe-to-deploy"
notes = "Required by libcrux-ml-dsa; its `codec` feature is off, so no code of it is linked."

[[exemptions.tls_codec_derive]]
version = "0.5.0"
criteria = "safe-to-deploy"
notes = "Proc macro of tls_codec, never expanded here."

[[exemptions.wnaf]]
version = "0.14.1"
criteria = "safe-to-deploy"
notes = "zkcrypto windowed-NAF scalar multiplication tables, pure arithmetic used by k256 0.14."

[[exemptions.zeroize]]
version = "1.9.1"
criteria = "safe-to-deploy"
notes = "One pin for the PQ core and the HPKE module; libcrux-ml-dsa asks for 1.9 through tls_codec."

[[exemptions.zeroize_derive]]
version = "1.5.0"
criteria = "safe-to-deploy"
notes = "Proc macro of zeroize 1.9."
