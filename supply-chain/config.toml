
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

# --- the git sourced libp2p tree: audit it as its crates.io counterpart ---
#
# libp2p is taken from the rust-libp2p tree rather than crates.io (Cargo.toml:32).
# cargo-vet cannot know on its own which crates.io package a git dependency
# corresponds to, so it cannot bind the audit records (including the
# mozilla/google/isrg imports) to those packages and says "There are some issues
# with your policy.audit-as-crates-io entries", RUNNING NO SCAN AT ALL.
#
# This was a case the gate caught correctly: `cargo vet check` printed neither an
# unvetted dependency count nor "Vetting Succeeded!", and the gate refused to treat
# the output as clean. What was missing was not the gate but the mapping below.
#
# `audit-as-crates-io = true` means "count this git checkout as the crates.io
# package of the same name"; the existing audits become reusable. It adds no new
# trust assumption: the versions are pinned in Cargo.lock and the commit they came
# from is visible in the report.

[policy."libp2p"]
audit-as-crates-io = true

[policy."libp2p-allow-block-list"]
audit-as-crates-io = true

# libp2p-connection-limits: the git checkout says 0.7.0 while crates.io has
# published up to 0.6.0. cargo-vet handles this precisely for a git
# dependency: the base audit covers the published 0.6.0 and a delta audit
# covers `0.6.0 -> 0.7.0@git:<rev>` (both recorded in audits.toml), so the
# package stays under enforcement instead of being counted as first party.
[policy."libp2p-connection-limits"]
audit-as-crates-io = true

[policy."libp2p-core"]
audit-as-crates-io = true

[policy."libp2p-dns"]
audit-as-crates-io = true

[policy."libp2p-gossipsub"]
audit-as-crates-io = true

[policy."libp2p-identify"]
audit-as-crates-io = true

[policy."libp2p-kad"]
audit-as-crates-io = true

[policy."libp2p-mdns"]
audit-as-crates-io = true

[policy."libp2p-metrics"]
audit-as-crates-io = true

[policy."libp2p-noise"]
audit-as-crates-io = true

[policy."libp2p-ping"]
audit-as-crates-io = true

[policy."libp2p-quic"]
audit-as-crates-io = true

[policy."libp2p-request-response"]
audit-as-crates-io = true

[policy."libp2p-swarm"]
audit-as-crates-io = true

[policy."libp2p-swarm-derive"]
audit-as-crates-io = true

[policy."libp2p-tcp"]
audit-as-crates-io = true

[policy."libp2p-tls"]
audit-as-crates-io = true

[policy."libp2p-upnp"]
audit-as-crates-io = true

[policy."libp2p-yamux"]
audit-as-crates-io = true

[policy."multistream-select"]
audit-as-crates-io = true

[policy."prost-codec"]
audit-as-crates-io = true

[policy."rw-stream-sink"]
audit-as-crates-io = true

# --- the post-quantum core ---
#
# Exemptions, not audits: the repository has not reviewed these crates line by
# line, and writing "safe-to-deploy" under an auditor name would claim that it
# had. An exemption says "accepted into the dependency set under the reasons
# below"; each one is a version that `Cargo.lock` pins exactly. The crates that
# only exist for cfg(hax) or valgrind builds are listed because `cargo vet`
# walks every target of the graph.

[[exemptions.libcrux-ml-dsa]]
version = "0.0.11"
criteria = "safe-to-deploy"
notes = "Second ML-DSA verifier (portable backend only),. Formally verified (hax/F*) Cryspen code; pinned exactly. The AVX2 advisories RUSTSEC-2026-0125 and RUSTSEC-2026-0126 need simd256, which is off."

[[exemptions.libcrux-intrinsics]]
version = "0.0.9"
criteria = "safe-to-deploy"
notes = "Dependency of libcrux-ml-dsa; the SIMD features that use it are off."

[[exemptions.libcrux-macros]]
version = "0.0.4"
criteria = "safe-to-deploy"
notes = "Proc macros of libcrux-ml-dsa."

[[exemptions.libcrux-platform]]
version = "0.0.4"
criteria = "safe-to-deploy"
notes = "CPU feature detection of libcrux-ml-dsa."

[[exemptions.libcrux-secrets]]
version = "0.0.7"
criteria = "safe-to-deploy"
notes = "Secret-integer wrappers of libcrux-ml-dsa."

[[exemptions.libcrux-sha3]]
version = "0.0.11"
criteria = "safe-to-deploy"
notes = "SHA-3 and SHAKE of libcrux-ml-dsa, portable backend."

[[exemptions.libcrux-traits]]
version = "0.0.9"
criteria = "safe-to-deploy"
notes = "Traits crate of libcrux."

[[exemptions.slh-dsa]]
version = "0.2.0-rc.5"
criteria = "safe-to-deploy"
notes = "RustCrypto SLH-DSA (FIPS 205),; ACVP vectors in tests/vectors/pq are mandatory. A release candidate because 0.1.0 needs signature 2.3.0-pre.4, which cannot be unified with ed25519 2.2 under libp2p."

[[exemptions.tls_codec]]
version = "0.5.0"
criteria = "safe-to-deploy"
notes = "Required by libcrux-ml-dsa; its `codec` feature is off, so no code of it is linked."

[[exemptions.tls_codec_derive]]
version = "0.5.0"
criteria = "safe-to-deploy"
notes = "Proc macro of tls_codec, never expanded here."

[[exemptions.hax-lib]]
version = "0.3.7"
criteria = "safe-to-deploy"
notes = "Verification annotations of libcrux; compiled only under cfg(hax)."

[[exemptions.hax-lib]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Verification annotations of libcrux; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros]]
version = "0.3.7"
criteria = "safe-to-deploy"
notes = "Proc macros of hax-lib; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Proc macros of hax-lib; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros-types]]
version = "0.3.7"
criteria = "safe-to-deploy"
notes = "Types of hax-lib-macros; compiled only under cfg(hax)."

[[exemptions.hax-lib-macros-types]]
version = "0.4.2"
criteria = "safe-to-deploy"
notes = "Types of hax-lib-macros; compiled only under cfg(hax)."

[[exemptions.core-models]]
version = "0.0.7"
criteria = "safe-to-deploy"
notes = "Models of core used by libcrux under cfg(hax) only."

[[exemptions.crabgrind]]
