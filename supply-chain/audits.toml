
# cargo-vet audits file
#
# This file holds Budlum's OWN audit records (added with `cargo vet certify`).
# The first audits were recorded on 2026-08-28, covering the crates that the
# QR pipeline and the lru bump pulled in since the baseline was measured.
#
# Audit debt: see .github/cargo-vet-baseline.txt.
# The priority for burning it down is the crypto/FFI surface: ring, pqcrypto-dilithium,
# cryptoki, bls12_381, aes-gcm, chacha20.
#
# Record format:
#   [[audits.pqcrypto-dilithium]]
#   version  = "0.5.0"
#   criteria = "safe-to-deploy"
#   who      = "Full Name <mail>"
#   notes    = "the FFI bindings were reviewed; no unsafe in the Rust layer."

[audits]

[[audits.bytemuck]]
version = "1.25.2"
criteria = "safe-to-deploy"
who = "Lubo's Ruler <ayazkussann@gmail.com>"
notes = "pod-casting library whose entire purpose is checked reinterpret casts; reviewed 1.25.2 source: no build script, the unsafe inventory is the cast intrinsics themselves and each is behind an explicit alignment/size proof"

[[audits.byteorder-lite]]
version = "0.1.0"
criteria = "safe-to-deploy"
who = "Lubo's Ruler <ayazkussann@gmail.com>"
notes = "byte-swap helpers split out of byteorder; reviewed 1.0 source: no build script, four unsafe lines all inside from_le_bytes-style transmute wrappers over fixed-size arrays"

[[audits.flate2]]
version = "1.1.9"
criteria = "safe-to-deploy"
who = "Lubo's Ruler <ayazkussann@gmail.com>"
notes = "zlib/deflate facade; reviewed 1.1.9 source: no build script, and this workspace pins default-features=false with rust_backend, so the shipped path is pure-Rust miniz_oxide and the unsafe C-backend glue is not compiled"

