# Prometheus alert rules for a Budlum testnet.
#
# Loaded by ops/prometheus.yml (`rule_files`). Every expression reads a metric
# the node exports (src/core/metrics.rs) or, for disk space, the standard
# node_exporter filesystem gauges. Thresholds are testnet starting points:
# 5-block finality checkpoints, 3 s slots, a 50 000-entry mempool.

groups:
  - name: budlum-consensus
    rules:
      - alert: BudlumFinalityStalled
        # The finalized height has not moved for 10 minutes: no checkpoint
        # gathered a two-thirds quorum.
        expr: changes(budlum_finalized_height[10m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finality stalled on {{ $labels.node }}"
          description: "budlum_finalized_height has not changed for 10 minutes."

      - alert: BudlumFinalityLagHigh
        # The tip runs far ahead of the last finalized block.
        expr: budlum_finality_lag > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Finality lag {{ $value }} blocks on {{ $labels.node }}"

      - alert: BudlumChainHalted
        # No new block for 5 minutes (100 slots of 3 s).
        expr: changes(budlum_chain_height[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No new block on {{ $labels.node }} for 5 minutes"

      - alert: BudlumForkSuspected
        # Reorgs are expected to be rare and shallow; a burst means the nodes
        # disagree on the chain.
        expr: increase(budlum_reorgs_total[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} reorgs in 15 minutes on {{ $labels.node }}"

      - alert: BudlumNodesDisagreeOnHeight
        # Followers more than 20 blocks behind the highest node.
        expr: max(budlum_chain_height) - min(budlum_chain_height) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nodes disagree on the chain height by {{ $value }} blocks"

  - name: budlum-network
    rules:
      - alert: BudlumPeerCountLow
        expr: budlum_p2p_peers_connected < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} has {{ $value }} peers"

  - name: budlum-mempool
    rules:
      - alert: BudlumMempoolNearFull
        # Testnet mempool capacity is 50 000 entries.
        expr: budlum_mempool_size > 45000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mempool at {{ $value }} entries on {{ $labels.node }}"

      - alert: BudlumMempoolEvicting
        expr: increase(budlum_mempool_evictions[10m]) > 1000
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} mempool evictions in 10 minutes on {{ $labels.node }}"

  - name: budlum-disk
    rules:
      - alert: BudlumDiskFillingUp
        # Needs node_exporter on the host; the node itself reports only its
        # database size (budlum_storage_db_size_bytes). The `node` job in
        # ops/prometheus.yml and ops/monitoring/testnet-local-prometheus.yml
        # scrapes it, and `every_series_the_rules_read_has_a_scrape_job`
        # (src/tests/scrape_topology_covers_the_rules.rs) fails without it -
        # before that job existed this rule could not fire on any node.
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% disk left on {{ $labels.instance }}"

  # WP-41 item 6: the readiness alerts the directive names explicitly.
  #
  # Each expression reads a `budlum_*` series that `src/core/metrics.rs`
  # registers and the node writes on its production paths, so none of these is
  # a rule that can never fire. `alert_rules_reference_existing_metrics`
  # (src/tests/alert_rules_reference_existing_metrics.rs) checks that against
  # the metric inventory before a change can land.
  - name: budlum-readiness
    rules:
      - alert: BudlumFinalityRecoveryMode
        # Section 7.7: eight checkpoint intervals without finality is the
        # recovery trigger. The node computes the reading itself rather than
        # leaving each rule to divide a block count by an interval that is 5 on
        # the testnet and 10 on mainnet.
        expr: budlum_finality_stalled > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Finality recovery mode on {{ $labels.node }}"
          description: "No checkpoint has finalized for eight checkpoint intervals ({{ $value }} on budlum_finality_stalled)."

      - alert: BudlumFinalityLagCheckpoints
        # Halfway to the recovery trigger: 4 checkpoints behind on any network.
        # Written against the checkpoint gauge, not the block gauge, so the
        # threshold means the same thing on testnet and mainnet.
        expr: budlum_finality_lag_checkpoints >= 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Finality is {{ $value }} checkpoints behind on {{ $labels.node }}"

      - alert: BudlumStateRootMismatch
        # R-11: the same blocks produced a different root on this node than on
        # the node that committed them. Any increase is a determinism split and
        # the forked node stops agreeing with the network, so this fires on the
        # first one instead of waiting for a rate.
        expr: increase(budlum_state_root_mismatch_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "State-root mismatch on {{ $labels.node }}"
          description: "This node computed a root the committed block disagrees with; it is forking away from the network."

  - name: budlum-bud3
    rules:
      - alert: BudlumBud3SegmentsAtRisk
        # R-04: mobile loss higher than the placement assumed. A segment with a
        # lost share is still decodable - that is what the tolerance is for -
        # so this is a warning that the margin is shrinking, not an outage.
        expr: budlum_bud3_segments_at_risk > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} B.U.D. 3.0 segments have a lost share on {{ $labels.node }}"

      - alert: BudlumBud3RepairBacklog
        # The work half of the same reading: these segments are past the lazy
        # threshold and wait for a Full repairer to take them.
        expr: budlum_bud3_repair_backlog > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} B.U.D. 3.0 repairs are waiting on {{ $labels.node }}"

      - alert: BudlumBud3MobileCustodyMissing
        # The mobile floor is a promise about where the network's custody sits.
        # A node that placed objects but holds no mobile custody is not meeting
        # it; mobile churn alone does not explain a flat zero across a window.
        expr: budlum_bud3_objects > 0 and budlum_bud3_custody_bytes{class="mobile"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No B.U.D. 3.0 mobile custody on {{ $labels.node }}"

  - name: budlum-relayer
    rules:
      - alert: BudlumRelayReservationsStuck
        # A reservation is a result that was submitted and has not reached a
        # finalized block. A handful is normal; a table that only grows means
        # results keep being dropped before finality.
        #
        # `increase()` is deliberately NOT used: it is defined for counters, and
        # `budlum_relay_reservations` is a gauge - the depth of the pending
        # table, which falls again when a result finalizes. A Prometheus
        # counter reset inside the window makes `increase()` report a negative
        # number, and a comparison against it would either never fire or fire
        # on the reset. This compares the current depth and, with `for:`, the
        # part of it that is not merely a burst being worked through.
        expr: budlum_relay_reservations > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} relayer reservations are pending on {{ $labels.node }}"

      - alert: BudlumRelayReservationNeedsOperator
        # The external action was in flight when a run stopped. Only a person
        # can resolve it (look the external transaction up by nonce and clear
        # or complete the entry), so it pages rather than warns.
        expr: budlum_relay_inflight_reservations > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} relayer reservations need an operator on {{ $labels.node }}"

  - name: budlum-execution
    rules:
      - alert: BudlumExecutionEnvironmentFaulting
        # R-01: a fault is the deterministic panic an environment returns
        # instead of an outcome. One is a receipt; a rate is an environment to
        # switch off, and the label says which.
        expr: increase(budlum_ee_fault_total[10m]) > 5
        labels:
          severity: critical
        annotations:
          summary: "Execution environment {{ $labels.ee }} faulting on {{ $labels.node }}"
