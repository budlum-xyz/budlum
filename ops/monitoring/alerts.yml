# Prometheus alert rules for a Budlum testnet.
#
# Loaded by ops/prometheus.yml (`rule_files`). Every expression reads a metric
# the node exports (src/core/metrics.rs) or, for disk space, the standard
# node_exporter filesystem gauges. Thresholds are testnet starting points:
# 5-block finality checkpoints, 3 s slots, a 50 000-entry mempool.

groups:
  - name: budlum-consensus
    rules:
      - alert: BudlumFinalityStalled
        # The finalized height has not moved for 10 minutes: no checkpoint
        # gathered a two-thirds quorum.
        expr: changes(budlum_finalized_height[10m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finality stalled on {{ $labels.node }}"
          description: "budlum_finalized_height has not changed for 10 minutes."

      - alert: BudlumFinalityLagHigh
        # The tip runs far ahead of the last finalized block.
        expr: budlum_finality_lag > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Finality lag {{ $value }} blocks on {{ $labels.node }}"

      - alert: BudlumChainHalted
        # No new block for 5 minutes (100 slots of 3 s).
        expr: changes(budlum_chain_height[5m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No new block on {{ $labels.node }} for 5 minutes"

      - alert: BudlumForkSuspected
        # Reorgs are expected to be rare and shallow; a burst means the nodes
        # disagree on the chain.
        expr: increase(budlum_reorgs_total[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} reorgs in 15 minutes on {{ $labels.node }}"

      - alert: BudlumNodesDisagreeOnHeight
        # Followers more than 20 blocks behind the highest node.
        expr: max(budlum_chain_height) - min(budlum_chain_height) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nodes disagree on the chain height by {{ $value }} blocks"

  - name: budlum-network
    rules:
      - alert: BudlumPeerCountLow
        expr: budlum_p2p_peers_connected < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node }} has {{ $value }} peers"

  - name: budlum-mempool
    rules:
      - alert: BudlumMempoolNearFull
        # Testnet mempool capacity is 50 000 entries.
        expr: budlum_mempool_size > 45000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mempool at {{ $value }} entries on {{ $labels.node }}"

      - alert: BudlumMempoolEvicting
        expr: increase(budlum_mempool_evictions[10m]) > 1000
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} mempool evictions in 10 minutes on {{ $labels.node }}"

  - name: budlum-disk
    rules:
      - alert: BudlumDiskFillingUp
        # Needs node_exporter on the host; the node itself reports only its
        # database size (budlum_storage_db_size_bytes).
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% disk left on {{ $labels.instance }}"

  # Section 15.8 WP-41, job 6. The eight launch-boundary alerts below carry
  # the exact names the directive requires. Each expression reads a metric
  # that the node (or the faucet) really exports: `alert_rules_reference_
  # existing_metrics` in src/bin/budlum-faucet.rs fails on any expression that
  # names an unregistered metric. The comments state which exported signal
  # each rule uses. Dedicated gauges for EE faults, state-root mismatches,
  # B.U.D. 3.0 segment risk/repair backlog and relay reservations are not
  # registered yet, so those rules use the nearest registered signal instead
  # of inventing a number. Thresholds are TESTNET-DEFAULT starting points:
  # one finality checkpoint is 5 blocks (section 11.10).
  - name: budlum-launch-boundary
    rules:
      - alert: budlum_finality_stalled
        # Exported signal: the finalized height itself stops moving.
        expr: changes(budlum_finalized_height[10m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finality stalled on {{ $labels.node }}"

      - alert: budlum_finality_lag_checkpoints
        # Exported signal: head height minus finalized height; 5 blocks is
        # one checkpoint boundary.
        expr: budlum_finality_lag > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finality lag {{ $value }} blocks on {{ $labels.node }}"

      - alert: budlum_bud3_segments_at_risk
        # Exported signal: open storage challenges that have no matching
        # result row. This is the segment-risk proxy until a dedicated gauge
        # is registered.
        expr: budlum_storage_challenge_rows - budlum_storage_result_rows > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} unresolved storage challenges on {{ $labels.node }}"

      - alert: budlum_bud3_repair_backlog
        # Exported signal: open reallocation rows, which are the storage
        # repair tickets the node reports.
        expr: budlum_storage_reallocation_rows > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} open reallocations on {{ $labels.node }}"

      - alert: budlum_relay_reservations
        # Exported signal: pending relayer rows, which are the reservations
        # held while an external action is in flight.
        expr: budlum_relayer_pending_rows > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} held relay reservations on {{ $labels.node }}"

      - alert: budlum_ee_fault_total
        # Exported signal: PQ verifier disagreement is the fault counter the
        # node registers on the verification path. A dedicated execution-EE
        # fault counter is not exported yet (see the group comment above).
        expr: increase(budlum_pq_verifier_disagreement[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} verifier disagreements in 10 minutes on {{ $labels.node }}"

      - alert: budlum_state_root_mismatch_total
        # Exported signal: a rejected candidate root surfaces as a reorg that
        # the node records. A dedicated mismatch counter is not exported yet.
        expr: increase(budlum_reorgs_total[15m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} reorgs in 15 minutes on {{ $labels.node }}"

      - alert: budlum_rpc_rate_limited_total
        # Exported signal: the node's own per-IP quota counter (R-08).
        expr: increase(budlum_rpc_rate_limited_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} rate-limited RPC calls in 5 minutes on {{ $labels.node }}"

      - alert: budlum_faucet_grants_total
        # Exported signal: the faucet's own Prometheus exporter on
        # GET /metrics. A rising grant rate with rising difficulty is R-15.
        expr: increase(budlum_faucet_grants_total[1h]) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} faucet grants in one hour"
