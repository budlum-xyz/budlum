# SoftHSM2 configuration for a testnet validator (DOC-GAP-01).
# Copy to /etc/budlum/softhsm2.conf and point the service at it with
# SOFTHSM2_CONF=/etc/budlum/softhsm2.conf. The directory must be owned by
# the budlum user and must not be shared between nodes.
directories.tokendir = /var/lib/budlum/softhsm/tokens
objectstore.backend = file
log.level = INFO
slots.removable = false
# State files are testnet-only. A production validator uses a hardware HSM
# and its own PKCS#11 module; no production key is ever stored here.
