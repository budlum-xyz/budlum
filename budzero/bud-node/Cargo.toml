[package]
name = "bud-node"
version = "0.1.0"
edition = "2021"
# Inherit the root [workspace.package] value for the cargo-deny license gate
license.workspace = true

[lints]
workspace = true

[dependencies]
futures = { version = "0.3", features = ["std"] }
# Async runtime
libp2p = { version = "0.57.1", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "macros",
    "identify",
    "kad",
    "request-response",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
# Bitswap wire codec; pinned to the same major as the chain crate so a node can
# speak to peers built from either tree.
bincode = "1"

# Logging
tracing = "0.1"

# Utilities
thiserror = "2"
hex = "0.4"
sha2 = "0.11"

[dev-dependencies]
