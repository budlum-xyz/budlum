[package]
name = "bud-proof"
version = "0.1.0"
edition = "2021"
# : cargo-deny lisans kapısı için kök [workspace.package] değerini miras al
license.workspace = true

[dependencies]
bud-vm = { path = "../bud-vm", features = ["experimental"] }
bud-isa = { path = "../bud-isa", features = ["experimental"] }
serde = { version = "1.0", features = ["derive"] }

p3-air = "0.6"
p3-matrix = "0.6"
p3-field = "0.6"
p3-commit = "0.6"
p3-challenger = "0.6"
p3-symmetric = "0.6"
p3-keccak = "0.6"
p3-fri = "0.6"
p3-util = "0.6"
p3-goldilocks = "0.6"
p3-merkle-tree = "0.6"
p3-dft = "0.6"
postcard = { version = "1.0", features = ["alloc"] }
tracing = "0.1"
p3-maybe-rayon = "0.6"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[[bench]]
name = "proof_baseline"
harness = false

[dev-dependencies]
# Derlenmis dallanma testi (tests/derlenmis_dallanma.rs) icin: kanit boru
# hattini elle kurulmus komut dizisiyle degil, derleyicinin gercek ciktisiyla
# besler. Mevcut 106 prover testinin tamami elle kurulmus dizi kullaniyordu.
bud-compiler = { path = "../bud-compiler" }
tiny-keccak = { version = "2.0", features = ["keccak"] }
