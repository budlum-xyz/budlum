[package]
name = "bud-vm"
version = "0.1.0"
edition = "2021"
# Inherit the root [workspace.package] value for the cargo-deny license gate
license.workspace = true

[lints]
workspace = true

[dependencies]
bud-isa = { path = "../bud-isa" }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[features]
experimental = ["bud-isa/experimental"]
