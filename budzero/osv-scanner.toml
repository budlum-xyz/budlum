# budzero/osv-scanner.toml - BudZero workspace'i için OSV istisnaları
#
# BudZero ayrı bir Cargo workspace'idir (kendi Cargo.lock'u var), bu yüzden
# osv-scanner onu kök config ile değil kendi yanındaki config ile eşler.
# İçerik kök osv-scanner.toml ile bilinçli olarak aynı tutulur: aynı bağımlılık
# ailesi, aynı gerekçeler. Biri güncellenirse diğeri de güncellenmeli.
#
# NEDEN AYRI BİR TARAYICI: cargo-audit ve cargo-deny yalnız RustSec advisory
# veritabanını okur. OSV.dev bir toplayıcıdır (RustSec + GHSA + NVD + CVE) ve
# RustSec'te KARŞILIĞI OLMAYAN kayıtları da görür. Bu teorik bir fark değil:
# ilk koşuda CVE-2026-32314 / GHSA-vxx9-2994-q338 (yamux, CVSS 8.7) yakalandı,
# aynı ağaçta `cargo audit` "0 vulnerabilities found" diyordu çünkü bu kaydın
# RustSec karşılığı yok (rustsec/advisory-db/crates/yamux → 404).
#
# POLİTİKA: burada listelenmeyen her bulgu FAIL'dir. Her istisna, kodda
# neden ERİŞİLEMEZ olduğunun kanıtıyla yazılır (VEX mantığı); "gürültü" ya da
# "şimdilik" gerekçesi kabul edilmez. Erişilebilir bir bulgu ignore edilmez,
# bağımlılık yükseltilir.

[[IgnoredVulns]]
id = "GHSA-vxx9-2994-q338"   # CVE-2026-32314 - yamux remote panic (DoS), CVSS 8.7
reason = """
Erişilemez: yamalı kod yolu kullanılıyor, yamasız olan yalnız derleniyor.

libp2p-yamux 0.47.0 iki yamux sürümünü birden bağımlılık olarak çeker
(yamux012 = 0.12.1, yamux013 = 0.13.10) ve hangisinin çalışacağını Config
seçer. Upstream kaynağında `impl Default for Config` -> `Config013`, yani
`yamux::Config::default()` 0.13.10 bağlantısını kurar. Budlum swarm'ı
src/network/node.rs içinde tam olarak `yamux::Config::default` veriyor;
depoda 0.12 yoluna geçiren tek API olan `WindowUpdateMode` / `client()` /
`server()` çağrısı hiç yok (grep ile doğrulandı).

Advisory'nin düzeltilmiş sürümü 0.13.10'dur ve çalıştırdığımız sürüm zaten
0.13.10'dur. Savunmasız 0.12.1 grafikte yalnızca libp2p-yamux'un ikili-sürüm
tasarımı yüzünden duruyor; hiçbir bağlantı onun üzerinden kurulmuyor.

Takip: libp2p-yamux 0.12 desteğini düşürdüğünde bu istisna silinir. Eğer
node.rs'te yamux yapılandırması değişir ve 0.12 yoluna geçilirse bu gerekçe
geçersizdir - o durumda istisna kaldırılmalı, bulgu gerçek hale gelir.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0118"   # hickory-proto NSEC3 DoS
reason = """
Kök .quality/osv-scanner.toml ile aynı kayıt; gerekçe orada tam haliyle durur.

NSEC3 doğrulama döngüsü yalnız hickory `dnssec` özelliğiyle derlendiğinde var
olur. Ölçüm (2026-07-27): aktif hickory-proto özellikleri std/tokio/futures-io;
dnssec YOK, mdns YOK.

DÜZELTME: eski gerekçe "yalnız opsiyonel p2p-mdns ile çözülür" diyordu; libp2p
`dns` özelliği açıldığından beri yanlış - hickory libp2p-dns üzerinden default
derlemede. Erişilemezlik sürüyor, sebebi DNSSEC'in derlenmemesi.

Premis src/tests/advisory_reachability.rs ile kilitli.
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0119"   # hickory-proto name-compression parser
reason = """
RUSTSEC-2026-0118 ile aynı ölçüm: savunmasız ayrıştırıcı `dnssec` olmadan
derlenmiyor. Aynı düzeltme notu geçerli.
"""

[[IgnoredVulns]]
id = "GHSA-q2qq-hmj6-3wpp"   # hickory-proto O(n^2) DNS message encoding
reason = """
DNS mesajı üretirken quadratic CPU tüketimi - tetiklemek için yanıt encode
etmek, yani DNS SUNMAK gerekir. Budlum yalnız çözümlüyor (libp2p-dns istemci
tarafı resolver); ağaçta hickory-server yok. Premis
src/tests/advisory_reachability.rs::no_dns_server_surface_in_tree ile kilitli.
Yamalı sürüm 0.26.1, libp2p ^0.25.2'ye pinli olduğu için upstream bekleniyor.
"""

