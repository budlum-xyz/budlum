# Not a workspace member: built with `cargo build-sbf` for the SVM target.
[package]
name = "budlum-settlement-endpoint"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "2"
borsh = { version = "1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace]
