[package]
name = "budlum-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
# : root cargo-deny `unlicensed = "deny"` kuralı kendi crate'imizi de
# reddetmesin diye zorunlu. Repo kökündeki LICENSE.md (Apache-2.0) ile aynı.
license = "Apache-2.0"

[features]
default = ["pq-dilithium"]
pq-dilithium = ["dep:pqcrypto-dilithium", "dep:pqcrypto-traits"]
pq-ml-dsa = ["dep:ml-dsa"]
# mDNS is excluded from production/default builds. It remains an explicit
# devnet-only build capability so hickory/mDNS advisories are not reachable in
# validator, sentry, RPC, archive, or ordinary release binaries.
p2p-mdns = ["libp2p/mdns"]
# Intentionally never enabled in CI/runtime. Exists only so Cargo stops
# warning that the benchmark target refers to a missing feature.
__bench_domain_throughput_disabled = []

[dependencies]
sha2 = "0.11"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
sled = "0.34"

# P2P Networking
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.57", features = [
    "tokio",
    "tcp",
    # `dns` wraps the TCP transport in a resolving layer so that /dns4, /dns6
    # and /dnsaddr multiaddrs are dialable. Without it libp2p-tcp rejects every
    # name-based multiaddr with MultiaddrNotSupported, which silently breaks
    # both the `--dial=/dns4/...` bootstrap path and any operator that
    # configures a hostname peer instead of a raw IP.
    "dns",
    "noise",
    "yamux",
    "macros",
    "ping",
    "identify",
    "gossipsub",
    "kad",
    "request-response",
] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3.0.0"
rand = "0.10.1"
sha3 = "0.12"
prost = "0.14.3"
bytes = "1.11.1"
# bincode is held at 1.x deliberately. Its byte output is consensus input, not
# just storage: `Block::calculate_hash` folds serialized slashing evidence into
# the block hash, and the account state root folds serialized tokenomics,
# timed_burn and burn_reserve_address. If a major bump changed the encoding of
# any of those by a single byte, an upgraded node would derive a different hash
# from byte-identical state and split the chain from the un-upgraded ones.
#
# RUSTSEC-2025-0141 marks 1.x unmaintained. That is an advisory about upstream
# activity, not a vulnerability, and it is reported on every `cargo audit` run
# rather than silenced. Moving off 1.x is a wire-format migration with a
# coordinated activation height, not a dependency bump; Dependabot is told to
# skip the major so the decision cannot be made by merging a PR.
bincode = "1.3"
schnorrkel = "0.11.5"
bls12_381 = { version = "0.8.0", features = ["experimental"] }
# bls12_381 0.8's published RFC 9380 API uses digest 0.9. Keep this explicit
# alias separate from the application's sha2 0.11 dependency.
sha2_09 = { package = "sha2", version = "0.9.9" }
pqcrypto-dilithium = { version = "0.5.0", optional = true }
pqcrypto-traits = { version = "0.3.5", optional = true }
ml-dsa = { version = "0.1.1", optional = true, features = ["getrandom"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
prometheus = "0.14"
toml = "1.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower = "0.5"
cryptoki = "0.12"
secrecy = "0.10"
subtle = "2"
async-trait = "0.1"
thiserror = "2"
rayon = "1.10"
# BudZero/BudZKVM is part of this repository as of . Keeping the
# crates under `budzero/` preserves their own workspace while removing the
# fragile sibling-checkout/pinned-repository requirement.
bud-isa = { path = "budzero/bud-isa" }
bud-vm = { path = "budzero/bud-vm" }
bud-proof = { path = "budzero/bud-proof" }
bud-node = { path = "budzero/bud-node" }

[build-dependencies]
prost-build = "0.14.3"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.5"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "bench_sig_verify"
path = "benches/micro/sig_verify.rs"

[[bin]]
name = "bench_merkle_update"
path = "benches/micro/merkle_update.rs"

[[bin]]
name = "bench_merkle_scaling"
path = "benches/micro/merkle_scaling.rs"

[[bin]]
name = "bench_internal_pipeline_tps"
path = "benches/single_node/internal_pipeline_tps.rs"

# : dudect-tarzı timing-safe regresyon testi. harness=false ile
# stable toolchain'de `cargo bench --bench timing_safe` çalışır; CI kapısıdır.
[[bench]]
name = "timing_safe"
path = "benches/micro/timing_safe.rs"
harness = false

# Domain throughput/latency benchmarks (criterion.rs)
[[bench]]
name = "domain_throughput"
path = "benches/domain_throughput.rs"
required-features = ["__bench_domain_throughput_disabled"]
harness = false

[profile.release]
overflow-checks = true
panic = "abort"

# libp2p 0.57.0 is tagged in the rust-libp2p tree but not yet on crates.io.
# Pinning the tree closes three advisories that no published release can:
#
#   GHSA-vxx9-2994-q338  yamux < 0.13.10
#   GHSA-3v94-mw7p-v465  hickory-proto <= 0.25.2  (no patched release exists)
#   GHSA-q2qq-hmj6-3wpp  hickory-proto <= 0.26.0
#
# libp2p 0.56.0 pulls yamux 0.12.1 *and* 0.13.10 (libp2p-yamux 0.47 depends on
# both) plus hickory-resolver 0.25.2, and neither is optional: `dns` is needed
# for /dns4 bootstrap multiaddrs and `yamux` is the muxer. libp2p-yamux 0.48.0
# drops the 0.12 path and moves to yamux 0.14; libp2p-dns 0.45.0 moves to
# hickory 0.26. Both land in 0.57.0.
#
# Revisit when 0.57.0 is published: delete this patch and bump the version
# requirements back to a plain crates.io dependency. `advisory_reachability`
# pins the reason so the patch cannot be forgotten.
[patch.crates-io]
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "38b8a2c0e91bf6955f5357adcdd40d3b6683a0dd" }
