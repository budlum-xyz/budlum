# osv-scanner.toml, justified exceptions for the OSV.dev based vulnerability scan
#
# WHY THIS FILE IS HERE AND NOT UNDER `.quality/`: osv-scanner loads
# `osv-scanner.toml` from the directory of the thing it is scanning unless the
# caller passes `--config`. The project's own workflow passes the path
# explicitly, so a private location worked for it - but every OTHER OSV consumer
# reads the default path, and one of them is in the Security tab: the OpenSSF
# Scorecard `Vulnerabilities` check calls osv-scanner on the checked-out tree with
# no override (scorecard v5 `clients/osv.go` builds `osvscanner.ScannerActions`
# with an empty `ConfigOverridePath`), so the reviewed exceptions below were
# invisible to it and the eight accepted unmaintained records kept the alert
# open. `budzero/osv-scanner.toml` already described this file as "the root
# osv-scanner.toml" - this is that path. One reviewed list, read by every
# scanner that speaks OSV, instead of two lists that can drift.
#
# WHY A SEPARATE SCANNER: cargo-audit and cargo-deny read only the RustSec advisory
# database. OSV.dev is an aggregator (RustSec + GHSA + NVD + CVE) and it also sees
# records that have NO COUNTERPART in RustSec. This is not a theoretical difference:
# the first run caught CVE-2026-32314 / GHSA-vxx9-2994-q338 (yamux, CVSS 8.7),
# while on the same tree `cargo audit` said "0 vulnerabilities found" because this record
# has no RustSec counterpart (rustsec/advisory-db/crates/yamux -> 404).
#
# POLICY: every finding not listed here is a FAIL. Each exception is written with
# evidence of why it is UNREACHABLE in the code (VEX logic); "noise" or
# "for now" are not accepted as reasons. A reachable finding is not ignored,
# the dependency is upgraded.
#
# 2026-07-28: three vulnerability records (yamux GHSA-vxx9-2994-q338, hickory
# RUSTSEC-2026-0118 / RUSTSEC-2026-0119 / GHSA-q2qq-hmj6-3wpp) were DELETED because
# they were patched, which is what the policy asks for. The root Cargo.toml pins libp2p
# to the 0.57.0 tree; that brings yamux 0.14.0 and hickory 0.26.1.
# Only "unmaintained" maintenance warnings remain below; these are not vulnerabilities.

# -- informational records of the "unmaintained" class ----------------------
# The following are not vulnerabilities but maintenance status warnings (RUSTSEC-*-XXXX
# "unmaintained"). Repository policy does not count them as a FAIL through
# `unmaintained = "none"` in deny.toml; visibility comes from the cargo audit report in CI and
# they are tracked on the org roadmap. Because OSV returns them like vulnerabilities we
# mirror the same policy here, otherwise the two tools would contradict each other.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
reason = "atomic-polyfill unmaintained (a maintenance warning, not a vulnerability) - the OSV mirror of the deny.toml `unmaintained = \"none\"` policy."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.x unmaintained - tracked on the org roadmap (the bincode 2 migration touches consensus critical byte formats, a separate task)."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0057"
reason = "fxhash unmaintained (a maintenance warning, not a vulnerability)."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0384"
reason = "instant unmaintained (a maintenance warning); transitive, not a direct dependency."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste unmaintained (a maintenance warning, not a vulnerability); a proc-macro, no runtime surface."


# 2026-10-26: the three pqcrypto records (RUSTSEC-2024-0380, RUSTSEC-2026-0162,
# RUSTSEC-2026-0163) were DELETED with the crates they described. The legacy Dilithium5
# path (PQClean) is gone; ML-DSA comes from RustCrypto `ml-dsa` and `libcrux-ml-dsa`.

# 2026-08-18: CI red roots (repository-wide transitive findings).
# 2026-08-28: lru via rqrr (transitive). rqrr 0.9 -> 0.10.1 moved lru to 0.16.4,
# which clears RUSTSEC-2026-0002 (fixed 0.16.3). RUSTSEC-2026-0253 is fixed only
# in 0.18.2 and rqrr 0.10.1 requires `lru ^0.16`, so the fix is not selectable
# until rqrr releases against lru 0.18 (upgrade is tracked; this is not a
# substitute for it).
# Scoped to the one package and version the reasoning was written for: the
# waiver lapses on its own when lru moves (a new version is a new
# reachability question) and when the date passes (the rqrr upgrade that
# selects lru 0.18 is due before then). A second lru user in any lockfile is
# a different instantiation, so it is not covered either: the name+version
# match is per package entry, and the root lock is the only one carrying lru
# (checked 2026-09-05 across all ten scanned lockfiles).
[[PackageOverrides]]
name = "lru"
version = "0.18.4"
ecosystem = "crates.io"
vulnerability.ignore = true
effectiveUntil = 2026-12-01
reason = "RUSTSEC-2026-0253 is PATCHED in lru >= 0.18.2 (lru-rs#238: the node is detached before the key is dropped), so the locked 0.18.4 is upstream of the affected range and carries no finding to silence; this entry is kept version-pinned so the reachability record follows the dependency instead of disappearing with the rqrr 0.10.1 -> 0.11.0 bump. If the advisory's affected range were reinterpreted down, the same VEX argument still holds: the only lru instantiation in the tree is rqrr 0.11.0's LruCache<u8, ColoredRegion> (prepare.rs), whose key type has no Drop implementation and cannot panic during pop(). RUSTSEC-2026-0002 does not apply (fixed in 0.16.3)."

# 2026-10-27: GHSA-qwgh-2vcv-g2f7 ("block_buffer: panic corrupts inline buffer
# position", CVSS 6.3, fixed in block-buffer 0.12.1) was published against the
# block-buffer 0.10.4 that is still in ten lockfiles through digest 0.10.7 ->
# sha2 0.10. That line is pinned deliberately: `sha2_010` exists only for
# bls12_381 0.9's RFC 9380 hash-to-curve API, and block-buffer 0.12 changed the
# buffer API under digest 0.10, so the patched version is NOT selectable until
# bls12_381 moves to digest 0.11 (tracked on the dependency roadmap; the
# application's own hashing is sha2/sha3 0.11, which already resolves to
# block-buffer 0.12.1 and is outside the affected range).
#
# Why it is unreachable here (VEX): the advisory needs a caller-supplied
# `compress` callback to panic, the panic to be caught, and the same hasher to
# keep being used afterwards. The only instantiation of the 0.10 line is
# `ExpandMsgXmd<Sha256>` inside bls12_381's `hash_to_curve`, which passes
# sha2's own infallible compression function, hashes fixed-size inputs, and has
# no `catch_unwind` anywhere around it in the tree - so there is no panic to
# catch and no corrupted cursor to read. Pinned to the package and version the
# reasoning was written for, and dated so the waiver lapses on its own.
[[PackageOverrides]]
name = "block-buffer"
version = "0.10.4"
ecosystem = "crates.io"
vulnerability.ignore = true
effectiveUntil = 2027-01-31
reason = "GHSA-qwgh-2vcv-g2f7 requires a panicking caller-supplied compress callback whose caught panic leaves the buffer cursor corrupted; the only 0.10 instantiation is ExpandMsgXmd<Sha256> in bls12_381's hash_to_curve, which uses sha2's infallible compression and never runs under catch_unwind. Not upgradable in place: the fix (block-buffer 0.12.1) is incompatible with digest 0.10, which is pinned for the bls12_381 0.9 API."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0173"
reason = "proc-macro-error2 unmaintained (a maintenance warning, not a vulnerability); a proc-macro helper reached only through a third-party macro crate at compile time, no runtime surface."
