# The cargo-fuzz target (run with cargo +nightly fuzz check/run).
# It runs in a separate CI round (the bud2-ci.yml note: "fuzz and kani are an
# open item for a separate CI round").
[package]
name = "bud-core-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bud-core = { path = ".." }

[[bin]]
name = "fuzz_bud_format"
path = "fuzz_bud_format.rs"
test = false
doc = false

[profile.release]
debug = 1
