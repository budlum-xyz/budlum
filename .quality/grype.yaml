# .grype.yaml, configuration for the Grype (Anchore) vulnerability scanner
#
# WHY ALONGSIDE OSV-Scanner: Grype feeds from a different database set
# (NVD + GHSA + distro feed'leri) ve her bulguya EPSS skoru ekliyor. EPSS,
# is the measurable answer to "is this hole being exploited in the wild" and exists neither
# in RustSec nor in OSV.dev. For an L1 it changes prioritisation:
# CVSS 8.7 ama EPSS %0.5 olan bir bulgu ile CVSS 7.0 / EPSS %40 olan bir bulgu
# do not carry the same urgency.
#
# Grype also produces SARIF; findings land in the Security tab. The Trivy fs scan
# in the repository does not do this (it only breaks the job with an exit code), so
# tracking findings from a single place is not currently possible.
#
# POLICY: the exception list must be identical to osv-scanner.toml. Two
# scanners contradicting each other on the same finding erodes the gate's credibility;
# if one is updated the other must be too. Every finding not on the list
# is a FAIL. The list is empty right now, no vulnerability is being carried.

# Report everything, not only findings that have a fix.
ignore-wontfix: ''

# Threshold: high and above break the job. Below that is reported but does not block -
# Grype's distro/NVD sources can produce low severity noise and the purpose of this
# gate is to add EXTRA signal on top of OSV/cargo-deny, not to repeat
# them.
fail-on-severity: high

ignore:
  # This list is EMPTY RIGHT NOW and must stay that way.
  #
  # Until 2026-07-28 there were three records here (yamux GHSA-vxx9-2994-q338,
  # hickory GHSA-3v94-mw7p-v465 and GHSA-q2qq-hmj6-3wpp). All were carried on the grounds
  # of being "unreachable" because libp2p 0.56 had not moved to the patched releases.
  # It has now: the root Cargo.toml pins libp2p to the 0.57.0 tree, which brings
  # yamux 0.14.0 and hickory 0.26.1. All three findings were PATCHED, so
  # no exception is needed.
  #
  # Before adding a new exception: try upgrading the dependency. A reachable
  # finding is not ignored. If unreachability is claimed, the evidence must be locked
  # by a test inside src/tests/advisory_reachability.rs.
  []
