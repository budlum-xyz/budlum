# -- added during the budscan round -------------------------------
# All three are Turkish words; the English typos dictionary reads them as
# "admin", "offset" and "vector" respectively. Verified by mutation: removing these
# lines turns the gate red with 7 findings, so the calibration is not vacuous.
#   adin   : the genitive of the noun "ad" (the resolution of a name), not "admin"
#   ofset  : the 32 byte big-endian offset of the Arweave `note` field
#   vektor : the shared test vector of the content-id equality test
adin = "adin"
Adin = "Adin"
ofset = "ofset"
Ofset = "Ofset"
vektor = "vektor"
vektoru = "vektoru"
Vektor = "Vektor"

# -- added during the proven-demand round --------------------------------
# Both are Turkish words; the English typos dictionary reads them as "again" and
# "popular".
#   agin     : the genitive of "ag" (network)
#   populer  : the Turkish spelling of popular; not "popular"
agin = "agin"
Agin = "Agin"
populer = "populer"
Populer = "Populer"
populerlik = "populerlik"
populerlikle = "populerlikle"
# formatin : the genitive of the noun "format"; not "formation"
formatin = "formatin"
Formatin = "Formatin"

# -- Proper names / technical terms ---------------------------------------
Canva = "Canva"     # a product name (not Canvas)
Groth = "Groth"     # the Groth16 zk-SNARK scheme (Jens Groth)
LOD = "LOD"         # level of detail, the graphics term the culling module borrows
PN = "PN"           # typos splits the acronym PNG and offers ON for the PN half
# -- A deliberate test fixture ---------------------------------------------
# budzero/bud-compiler: the negative test that verifies the "undeclared struct type"
# error deliberately uses a misspelled type name in the source.
# Fixing it would remove the very thing the test measures.
Ponit = "Ponit"
