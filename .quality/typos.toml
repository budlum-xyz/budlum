# typos-cli konfigürasyonu, Budlum Core
#
# Bu repo iki dillidir: kod ve API yüzeyi İngilizce, mimari/denetim
# dokümantasyonu ve kod içi yorumların büyük bölümü Türkçedir. typos'un
# varsayılan sözlüğü yalnız İngilizce olduğundan, kalibre edilmeden
# çalıştırıldığında 1000+ bulgunun neredeyse tamamı Türkçe kelimelerin
# İngilizce "düzeltmesi" olur ("blok"→"block", "adres"→"address",
# "sistem"→"system"). Bu gürültü kapıyı kullanılamaz hale getirir.
#
# Çözüm gevşetme DEĞİL, doğru kalibrasyondur: aşağıdaki Türkçe kelime listesi
# tanımlanır, geri kalan her şey FAIL kapısıdır. Yeni bir Türkçe kelime
# yanlış pozitif verirse buraya eklenir (gerekçe commit mesajında);
# gerçek bir İngilizce yazım hatası asla ignore edilmez, düzeltilir.

[files]
extend-exclude = [
  "target/",
  "budzero/target/",
  "Cargo.lock",
  "*.lock",
  "supply-chain/",   # cargo-vet üretimi, elle düzenlenmez
  "proto/",          # wire şeması - kelime değişimi protokolü bozar
  "fuzz/corpus/",    # fuzzer üretimi binary seed'ler, metin değil
  "fuzz/artifacts/",
]

[default]
# Kimlik/hash benzeri uzun alfanümerik dizileri (SHA, PeerID, adres) tarama.
extend-ignore-re = [
  "\\b[0-9a-fA-F]{7,}\\b",              # git SHA / hex hash / hex adres
  "\\b12D3Koo[A-Za-z0-9]+\\b",          # libp2p PeerID
  "sha256:[0-9a-f]+",                   # docker digest
  "(?i)\\bbud1[a-z0-9]+\\b",            # bech32-tarzı Budlum adresleri
]

[default.extend-words]
