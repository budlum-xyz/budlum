# typos-cli configuration, Budlum Core
#
# This repository is being made single language: code, API surface, comments and
# documentation are all moving to English. While that migration runs, Turkish text
# still remains in places, and because the typos default dictionary is English only,
# running it uncalibrated turns almost all of 1000+ findings into English
# "corrections" of Turkish words ("blok" -> "block", "adres" -> "address",
# "sistem" -> "system"). That noise makes the gate unusable.
#
# The fix is NOT loosening but correct calibration: the Turkish word list below is
# declared and everything else is a FAIL gate. The list shrinks as the migration
# proceeds and is removed entirely once the last Turkish line is gone;
# a real English spelling mistake is never ignored, it is fixed.

[files]
extend-exclude = [
  "target/",
  "budzero/target/",
  "Cargo.lock",
  "*.lock",
  "supply-chain/",   # cargo-vet output, not hand edited
  "proto/",          # the wire schema - changing a word breaks the protocol
  "fuzz/corpus/",    # fuzzer produced binary seeds, not text
  "fuzz/artifacts/",
]

[default]
# Do not scan long identifier/hash-like alphanumeric strings (SHA, PeerID, address).
extend-ignore-re = [
  "\\b[0-9a-fA-F]{7,}\\b",              # git SHA / hex hash / hex address
  "\\b12D3Koo[A-Za-z0-9]+\\b",          # libp2p PeerID
  "sha256:[0-9a-f]+",                   # docker digest
  "(?i)\\bbud1[a-z0-9]+\\b",            # bech32-style Budlum addresses
]

[default.extend-words]
# -- Turkish words (false positives), removed as the migration proceeds --------
# Each maps to itself = "this spelling is correct, do not suggest a fix".
blok = "blok"
Blok = "Blok"
BLOK = "BLOK"
adres = "adres"
