# osv-scanner.toml — OSV.dev tabanlı zafiyet taraması için gerekçeli istisnalar
#
# NEDEN AYRI BİR TARAYICI: cargo-audit ve cargo-deny yalnız RustSec advisory
# veritabanını okur. OSV.dev bir toplayıcıdır (RustSec + GHSA + NVD + CVE) ve
# RustSec'te KARŞILIĞI OLMAYAN kayıtları da görür. Bu teorik bir fark değil:
# ilk koşuda CVE-2026-32314 / GHSA-vxx9-2994-q338 (yamux, CVSS 8.7) yakalandı,
# aynı ağaçta `cargo audit` "0 vulnerabilities found" diyordu çünkü bu kaydın
# RustSec karşılığı yok (rustsec/advisory-db/crates/yamux → 404).
#
# POLİTİKA: burada listelenmeyen her bulgu FAIL'dir. Her istisna, kodda
# neden ERİŞİLEMEZ olduğunun kanıtıyla yazılır (VEX mantığı); "gürültü" ya da
# "şimdilik" gerekçesi kabul edilmez. Erişilebilir bir bulgu ignore edilmez,
# bağımlılık yükseltilir.
#
# 2026-07-28: üç zafiyet kaydı (yamux GHSA-vxx9-2994-q338, hickory
# RUSTSEC-2026-0118 / RUSTSEC-2026-0119 / GHSA-q2qq-hmj6-3wpp) SİLİNDİ çünkü
# yamalandılar — politikanın istediği şey buydu. Kök Cargo.toml libp2p'yi
# 0.57.0 ağacına sabitliyor; bu yamux 0.14.0 ve hickory 0.26.1 getiriyor.
# Aşağıda yalnız "unmaintained" bakım uyarıları kaldı; bunlar zafiyet değil.

# ── "unmaintained" sınıfı bilgilendirici kayıtlar ────────────────────────────
# Aşağıdakiler zafiyet değil, bakım durumu uyarısıdır (RUSTSEC-*-XXXX
# "unmaintained"). Repo politikası bunları deny.toml'da `unmaintained = "none"`
# ile FAIL saymaz; görünürlük CI'daki cargo audit raporundan sağlanır ve
# org roadmap'te izlenir. OSV bunları da zafiyet gibi döndürdüğü için burada
# aynı politikayı yansıtıyoruz — aksi halde iki araç birbiriyle çelişirdi.
