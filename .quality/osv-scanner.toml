# osv-scanner.toml, justified exceptions for the OSV.dev based vulnerability scan
#
# WHY A SEPARATE SCANNER: cargo-audit and cargo-deny read only the RustSec advisory
# database. OSV.dev is an aggregator (RustSec + GHSA + NVD + CVE) and it also sees
# records that have NO COUNTERPART in RustSec. This is not a theoretical difference:
# the first run caught CVE-2026-32314 / GHSA-vxx9-2994-q338 (yamux, CVSS 8.7),
# while on the same tree `cargo audit` said "0 vulnerabilities found" because this record
# has no RustSec counterpart (rustsec/advisory-db/crates/yamux -> 404).
#
# POLICY: every finding not listed here is a FAIL. Each exception is written with
# evidence of why it is UNREACHABLE in the code (VEX logic); "noise" or
# "for now" are not accepted as reasons. A reachable finding is not ignored,
# the dependency is upgraded.
#
# 2026-07-28: three vulnerability records (yamux GHSA-vxx9-2994-q338, hickory
# RUSTSEC-2026-0118 / RUSTSEC-2026-0119 / GHSA-q2qq-hmj6-3wpp) were DELETED because
# they were patched, which is what the policy asks for. The root Cargo.toml pins libp2p
# to the 0.57.0 tree; that brings yamux 0.14.0 and hickory 0.26.1.
# Only "unmaintained" maintenance warnings remain below; these are not vulnerabilities.

# -- informational records of the "unmaintained" class ----------------------
# The following are not vulnerabilities but maintenance status warnings (RUSTSEC-*-XXXX
# "unmaintained"). Repository policy does not count them as a FAIL through
# `unmaintained = "none"` in deny.toml; visibility comes from the cargo audit report in CI and
# they are tracked on the org roadmap. Because OSV returns them like vulnerabilities we
# mirror the same policy here, otherwise the two tools would contradict each other.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
reason = "atomic-polyfill unmaintained (a maintenance warning, not a vulnerability) - the OSV mirror of the deny.toml `unmaintained = \"none\"` policy."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.x unmaintained - tracked on the org roadmap (the bincode 2 migration touches consensus critical byte formats, a separate task)."

[[IgnoredVulns]]
id = "RUSTSEC-2025-0057"
reason = "fxhash unmaintained (a maintenance warning, not a vulnerability)."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0384"
reason = "instant unmaintained (a maintenance warning); transitive, not a direct dependency."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste unmaintained (a maintenance warning, not a vulnerability); a proc-macro, no runtime surface."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0380"
reason = "pqcrypto-dilithium was replaced by pqcrypto-mldsa; the PQ backend migration touches the consensus critical signature format, a separately planned task (the pq-ml-dsa feature exists)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0163"
reason = "pqcrypto-internals unmaintained (upstream PQClean is being archived) - to be handled together with the PQ backend migration task."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0162"
reason = "pqcrypto-traits unmaintained (upstream PQClean is being archived) - to be handled together with the PQ backend migration task."


# 2026-08-18: CI red roots (repository-wide transitive findings).
# 2026-08-28: lru via rqrr (transitive). rqrr 0.9 -> 0.10.1 moved lru to 0.16.4,
# which clears RUSTSEC-2026-0002 (fixed 0.16.3). RUSTSEC-2026-0253 is fixed only
# in 0.18.2 and rqrr 0.10.1 requires `lru ^0.16`, so the fix is not selectable
# until rqrr releases against lru 0.18 (upgrade is tracked; this is not a
# substitute for it).
# Scoped to the one package and version the reasoning was written for: the
# waiver lapses on its own when lru moves (a new version is a new
# reachability question) and when the date passes (the rqrr upgrade that
# selects lru 0.18 is due before then). A second lru user in any lockfile is
# a different instantiation, so it is not covered either: the name+version
# match is per package entry, and the root lock is the only one carrying lru
# (checked 2026-09-05 across all ten scanned lockfiles).
[[PackageOverrides]]
name = "lru"
version = "0.16.4"
ecosystem = "crates.io"
vulnerability.ignore = true
effectiveUntil = 2026-12-01
reason = "RUSTSEC-2026-0253: lru pop() UAF requires a stored KEY whose Drop panics during the pop. The only lru instantiation in the tree is rqrr 0.10.1's LruCache<u8, ColoredRegion> (prepare.rs): the key type is u8, which has no Drop implementation and cannot panic, so the advisory's precondition is unreachable in this codebase (VEX: vulnerable code not reachable). RUSTSEC-2026-0002 is fixed in 0.16.3 and does not apply to 0.16.4."
