# Machine-readable launch verdicts for every named public-testnet feature test.
# `xtask/gates launch-matrix-tests-exist` requires a one-to-one match between
# these rows and `#[test] fn <id>_is_{open,closed}_on_testnet` in the tree.
# Changing a state therefore requires changing and running its behavioral test.
version = 1

