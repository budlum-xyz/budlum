# .gitleaks.toml: the Budlum secret scan configuration
#
# CI scans the FULL git history with `gitleaks detect` (fetch-depth: 0).
# The default rule set is preserved; there is NO global pattern/path/commit
# exemption, and any leak FAILs the job.
#
# History verification (evidence that NO baseline is needed):
#   Tool: gitleaks v8.30.1, a full history scan, 2026-07-16
#   - The candidate commit trees found with `git log --all -S'ghp_'` were reviewed
#     `git grep -E 'ghp_[0-9a-zA-Z]{20,}'` ile kontrol edildi: hepsi
#     one by one: REDACTED markers of the form `ghp_6aXY...`; no real token.
#   - A full scan with the gitleaks v8.30.1 default rules: 0 findings.
#   - That the gate is not vacuous is proven on every CI run: the workflow first
#     verifies that gitleaks ALARMS on a fake PAT canary; if the canary is not
#     caught the real scan is treated as untrustworthy and the job FAILs.
title = "Budlum gitleaks config"

[extend]
useDefault = true

