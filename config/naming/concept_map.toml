schema = 1
mode = "count"            # WP-43 sets "absolute" at the end of T-Launch
global_allow_paths = [
  "config/naming/",
  "docs/NAMING.md",
  "docs/audit/",
  ".github/concept-names-baseline.txt",
]

[[concept]]
old = ["Filiz (leader election)"]
patterns = ['(?i)filiz', 'BDLM_FILIZ_']
paths = ["src/consensus/", "src/chain/", "src/tests/", "src/crypto/", "docs/"]
