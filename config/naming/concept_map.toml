term_en = "hash chain leader election (HCLE)"
term_tr = "Hash zinciri lider seçimi"
area = "consensus"
owner = "WP-12"
reason = "The name states the mechanism."

[[concept]]
old = ["Filiz (faucet)"]
patterns = ['(?i)filiz']
