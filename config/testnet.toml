[network]
profile = "testnet"
chain_id = 45261
genesis_file = "./config/testnet-genesis.json"

[node]
role = "validator"

[storage]
data_dir = "./data/testnet/budlum.db"
snapshot_dir = "./data/testnet/snapshots"
backup_dir = "./data/testnet/backups"
backups_enabled = true
backup_interval_secs = 3600
backup_retention_count = 24

[p2p]
identity_file = "./secrets/testnet-node-id.key"
# No public testnet exists yet, so there is no maintained bootnode or DNS seed
# to record. mDNS is devnet-only, and a node with no peer source refuses to
# start (`has_peer_source`): record the peers of your mesh here or pass
# --bootstrap.
#
# Formats. `bud node identity --identity-file
# <file> --host <ip or name> --port 5001 --seed-domain seeds.<TESTNET_DOMAIN>`
# prints both for a node:
#   bootnodes = ["/ip4/203.0.113.7/tcp/5001/p2p/12D3KooW...",
#                "/dns4/seed1.<TESTNET_DOMAIN>/tcp/5001/p2p/12D3KooW..."]
#   dns_seeds = ["seeds.<TESTNET_DOMAIN>"]
# A DNS seed name is resolved through its address records (one A or AAAA
# record per seed node) and every address is dialled at port 5001:
#   seeds.<TESTNET_DOMAIN> A 203.0.113.7
#   seeds.<TESTNET_DOMAIN> A 198.51.100.4
# The node does not read libp2p `_dnsaddr` TXT records. The real
# addresses come from the operators (DECISIONS.md, section 10.3).
bootnodes = []
dns_seeds = []
max_peers = 75
banned_peer_db = "./data/testnet/banned-peers.json"
mdns_enabled = false

[rpc]
# Same shape as mainnet: plain HTTP on loopback, TLS terminated by a reverse
# proxy on this host, the API key never on the wire in clear text.
public_listener = "127.0.0.1:18545"
operator_listener = "127.0.0.1:18546"
trusted_proxies = ["127.0.0.1"]
enabled = true
# Same rule as mainnet: the key is required whatever the bind address.
auth_required = true
api_key_env = "BUDLUM_RPC_API_KEY"
allowed_ips = []
rate_limit_per_minute = 600

[metrics]
# Loopback: scrape through a local agent or an authenticated reverse proxy.
# The metrics endpoint has no authentication of its own.
listener = "127.0.0.1:19090"

[validator]
key_file = "./secrets/testnet-validator.key"
backend = "softhsm"

[features]
pruning = false
