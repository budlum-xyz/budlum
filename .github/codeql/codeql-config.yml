name: "Budlum CodeQL config"
disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

# ── Kural filtreleri ────────────────────────────────────────────────────────
#
# CodeQL'in Rust desteği yenidir ve iki kuralı bu kod tabanında yapısal olarak
# Yanlış pozitif üretiyor. Bu filtre bir gevşetme DEĞİLDİR: aşağıdaki iki kural
# Dışında security-extended + security-and-quality tam kapsamıyla çalışır ve
# Bulgu = alert'tir. Bir kural buraya ancak yanlış pozitif olduğu satır satır
# Doğrulandıktan sonra, gerekçesiyle eklenir.
#
# Neden UI'dan "dismiss" değil: dismiss kod içinde iz bırakmaz, kod satırı
# Taşınınca alert yeniden açılır ve gerekçe kaybolur. Filtre versiyon
# Kontrolünde durur, gerekçesiyle birlikte denetlenebilir.
#
# Neden `// lgtm[...]` yorumu değil: o sözdizimi kullanımdan kalkmış LGTM.com
# Içindir, CodeQL varsayılan olarak uygulamaz. Bu repoda 1043 satıra
# Eklenmişti ve 81 alertin hiçbirini kapatmadı. Dahası aynı satıra yazıldıkları
# Için alertin satır-hash'ini değiştirip mevcut alerti "fixed" gösterip
# Yenisini açıyorlardı (alert churn). Hepsi kaldırıldı.
query-filters:
  # Rust/hard-coded-cryptographic-value — 81 alert, tamamı yanlış pozitif.
  #
  # Kural `[0u8; 32]` gibi dizi başlatıcılarını "sabit kodlanmış kriptografik
  # Değer" sayıyor. Bu kod tabanında hepsi iki desenden biri:
  #   (a) `let mut buf = [0u8; 32];` — hemen ardından copy_from_slice/hash ile
  #       DOLDURULAN boş tampon (proto_conversions.rs, pos.rs). Sabit bir
  #       Değer değil, yalnızca tampon ayırma.
  #   (b) Boş Merkle kökü / sıfır sentinel — merkle_trie.rs boş alt ağaç için
  #       `[0u8; 32]` döner; account.rs'te bridge_root/message_root başlangıç
  #       Değerleri. Bunlar protokol sabitleri; gizli değildirler ve rastgele
  #       Olmaları protokolü bozardı.
  #
  # Gerçek anahtar materyali PKCS#11/HSM üzerinden gelir (src/crypto/pkcs11.rs)
  # Ve hiçbir yerde kaynağa gömülü değildir. Bu kuralın kapsadığı gerçek risk
  # Sınıfı ayrıca gitleaks Secret Scan (tam geçmiş, kanaryalı) ve Semgrep
  # P/secrets tarafından taranmaya devam ediyor.
  - exclude:
      id: rust/hard-coded-cryptographic-value

  # Rust/cleartext-logging — 1 alert (high), yanlış pozitif.
  #
  # Blockchain.rs:2407'de "hassas veri log'a yazılıyor" diyor. İlgili blok
  # Pending_finality_certs üzerinde retention budaması yapıyor (`get_mut` +
  # `remove(0)`); o kod yolunda hiçbir log/print çağrısı yok. Rust taint
  # Izleyicisi HashMap erişimini var olmayan bir sink'e bağlıyor.
  # Gerçek cleartext-logging riski Semgrep p/security-audit kapsamında.
  - exclude:
      id: rust/cleartext-logging

paths-ignore:
  - src/tests/**
  - "**/tests/**"
  - "**/*.test.rs"
  - benches/**
  - fuzz/**
  - budzero/**
  - wallet-core/**
  - examples/**
  - scripts/**
  - proto/**
  - supply-chain/**
  - ops/**
  - target/**
