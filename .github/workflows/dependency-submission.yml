# Submit every committed Cargo.lock graph in the repository to GitHub's
# Dependency Submission API so Dependabot and the Dependency Graph cover
# workspace crates (`budzero/`, `fuzz/`, `crates/*`, `xtask/*`) alongside the
# root manifest.
#
# Deliberately triggered on `push` and `workflow_dispatch` only (never
# `pull_request`): the Dependency Submission API requires `contents: write`,
# which `audit-guard` forbids on pull_request workflows.

name: Dependency Submission

on:
  push:
    branches: [main, consensus-of-consensuses, testnet-quantum]
  workflow_dispatch:

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  submit-cargo-dependencies:
    name: Cargo Dependency Graph Submission (all 12 lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-xtask-tools
          workspaces: xtask/tools
      - name: Dependency snapshot canary
        run: cargo run --release --manifest-path xtask/tools/Cargo.toml -- dependency-snapshot --self-test
      - name: Build and submit Cargo dependency snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUDLUM_DEP_CORRELATOR: cargo-dependency-submission
        run: |
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- \
            dependency-snapshot /tmp/dependency-snapshot.json --submit
