      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Economy invariant gate canary
        run: bash ./scripts/check-economy-invariants.sh --self-test
      - name:  named invariant tests
        run: |
          set -euo pipefail
          cargo test --lib 2>&1 | tee /tmp/economy-invariants.txt
          bash ./scripts/check-economy-invariants.sh /tmp/economy-invariants.txt

  fork-choice-gate:
    # : per-domain fork-choice/lifecycle named tests.
