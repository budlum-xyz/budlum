    # 9 modül-bağımsızlık invariant'ı isimlendirilmiş ZORUNLU
    # Job. İsim kanaryası: bir invariant silinir/yeniden adlandırılırsa kapı
    # `cargo test` yeşil kalsa bile FAIL olur (vacuous-gate koruması, kanaryalı).
    name: B.U.D. E2E Invariants (9/9 isim-kilitli) ()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
