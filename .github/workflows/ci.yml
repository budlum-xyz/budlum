      - name: Network hardening gate canary
        run: bash ./scripts/check-network-hardening-gate.sh --self-test
      - name:  network hardening tests
        run: |
          set -euo pipefail
          cargo test --lib 2>&1 | tee /tmp/network-hardening-gate.txt
          cargo test --lib peer_rate_limit_security_profile 2>&1 | tee -a /tmp/network-hardening-gate.txt
          cargo test --lib h5_ 2>&1 | tee -a /tmp/network-hardening-gate.txt
          bash ./scripts/check-network-hardening-gate.sh /tmp/network-hardening-gate.txt




  domain-tag-gate:
    # The cryptographic domain-separation inventory must match the source tree.
    name: Domain Tag Inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate self-test (canary)
        run: bash ./scripts/check-domain-tags.sh --self-test
      - name: Inventory matches code
        run: bash ./scripts/check-domain-tags.sh .

  poa-compliance-gate:
    # : MASAK/AML hooks are isolated to PoA domains only.
    name: PoA Compliance Isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: PoA compliance gate self-test
        run: bash ./scripts/check-poa-compliance-gate.sh --self-test
      - name:  PoA compliance tests
        run: |
          set -euo pipefail
          cargo test --lib poa_compliance 2>&1 | tee /tmp/poa-compliance-gate.txt
          bash ./scripts/check-poa-compliance-gate.sh /tmp/poa-compliance-gate.txt

  governance-invariants:
    # : minimal on-chain governance parameter whitelist + activation timelock.
    name: Governance Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
