name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/architecture-tip-adlari]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  budlum:
    name: Budlum Core
    runs-on: ubuntu-latest
    # Badge self-commit (Q5, loop-guarded) needs write only in this job;
    # all other jobs stay at the global minimum (contents: read).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] badge bot self-commit intentionally uses GITHUB_TOKEN
        with:
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Format (kani proof harnesses)
        # kani/ is not a member of the root workspace, so the step above never
        # walks it: two drift hunks sat in kani/src/lib.rs while the root fmt
        # step stayed green. Measured 2026-08-28 and pinned here so the gap
        # cannot reopen.
        run: cargo fmt --manifest-path kani/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy pedantic/nursery ratchet (izleme modu)
        # Warning visibility + ratchet against count growth (baseline 191,
        # evidence .github/clippy-extra-baseline.txt). Driving to zero is gradual and deliberate.
        run: |
          set -euo pipefail
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- clippy-extra --self-test
          cargo clippy --all-targets --message-format=json -- -W clippy::pedantic -W clippy::nursery > /tmp/clippy-extra.json 2>/dev/null || true
          # Diagnostic only: the ratchet reports a count, and the JSON it counts
          # lives in the runner's /tmp, so a trip leaves nothing to inspect.
          # This prints the per-lint tally and every first-party file:line.
          # It writes nothing and runs before the gate, so it cannot change the
          # verdict.
          python3 ./ops/scripts/clippy-extra-report.py /tmp/clippy-extra.json
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- clippy-extra /tmp/clippy-extra.json
      - name: "Feature matrix: pq-ml-dsa solo"
        run: |
          set -euo pipefail
          cargo check --no-default-features --features "pq-ml-dsa wallet-ml-dsa"
          cargo clippy --no-default-features --features "pq-ml-dsa wallet-ml-dsa" --all-targets -- -D warnings
          # `check` and `clippy` prove it compiles. They do not run a single
          # signature. `pq-ml-dsa` is a consensus choice - `PQ_SCHEME_ID` is
          # written into genesis and `validate_pq_scheme` refuses to start on a
          # mismatch, so an operator can select it for mainnet, and until now
          # no test had ever generated a key or verified a signature under it.
          # The crypto module's own tests are the minimum bar for a signature
          # scheme that gates validator registration.
          cargo test --no-default-features --features "pq-ml-dsa wallet-ml-dsa" --lib crypto:: 2>&1 | tee /tmp/mldsa-tests.log
          # Guard against the filter silently matching nothing: a `cargo test`
          # that runs zero tests exits 0 and looks identical to a pass.
          if grep -qE 'running 0 tests' /tmp/mldsa-tests.log; then
            echo "ERROR: 0 tests ran under pq-ml-dsa -> the filter did not match (vacuous)"
            exit 1
          fi
          # And that the ones that matter are among them. `crypto::` also
          # matches PKCS#11 parsing and policy tests, which would pass without
          # a single signature being produced.
          for t in test_keypair_generation test_sign_and_verify test_deterministic_signature; do
            grep -qE "primitives::tests::$t \.\.\. ok" /tmp/mldsa-tests.log \
              || { echo "ERROR: $t did not run/pass under pq-ml-dsa"; exit 1; }
          done
          grep -E 'test result:' /tmp/mldsa-tests.log
          # `account_abstraction` is compiled only under `wallet-ml-dsa`, so
          # this is the one job that sees it. The directory sat unreachable
          # from lib.rs and never compiled at all: invalid Rust was written
          # into it and `cargo check --lib` still passed. Inside it three
          # functions named like security checks could not reject anything.
          # The filter above stops at `crypto::`, so without this step the
          # tests that lock those checks would still never run.
          cargo test --no-default-features --features "pq-ml-dsa wallet-ml-dsa" \
            --lib account_abstraction:: 2>&1 | tee /tmp/aa-tests.log
          if grep -qE 'running 0 tests' /tmp/aa-tests.log; then
            echo "ERROR: 0 tests ran under account_abstraction -> the module may be unwired again"
            exit 1
          fi
          # Name the signature-verification locks explicitly. A threshold that
          # counts the same owner twice, or an attestation that accepts a
          # digest in place of a signature, must both stay rejected.
          for t in \
            threshold_mldsa::tests::the_same_owner_signing_twice_does_not_meet_a_threshold_of_two \
            threshold_mldsa::tests::a_signature_over_another_message_is_refused \
            tee_attestation::tests::a_digest_in_place_of_a_signature_is_refused \
            private_transfer_auth::tests::raising_the_amount_after_signing_is_refused; do
            grep -qE "account_abstraction::$t \.\.\. ok" /tmp/aa-tests.log \
              || { echo "ERROR: $t did not run/pass"; exit 1; }
          done
          grep -E 'test result:' /tmp/aa-tests.log
      - name: Feature canary - --all-features MUST BE REFUSED
        run: |
          set -euo pipefail
          if cargo check --all-features 2>/dev/null; then
            echo "ERROR: --all-features compiled -> no compile_error guard (vacuous gate!)"
            exit 1
          fi
          echo "Canary OK: --all-features was refused with compile_error as expected (PQ backends are mutually exclusive)."
      - name: Test
        # Pipefail is required: tee alone returns exit 0; otherwise a test failure
        # makes the Core job falsely green (evidence: d815561 Test=success, 1 hidden fail;
        # Coverage nextest went red on the same fail - 2026-07-19).
        run: |
          set -euo pipefail
          cargo test --lib --verbose 2>&1 | tee /tmp/libtests.log
      - name: cargo doc (Item 6 - public API documentation)
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features pq-ml-dsa 2>&1 | tee /tmp/doc.log
          echo "cargo doc: warnings as errors - passed"
      - name: Badge canary (independent of the log)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- badges-are-current --self-test
      - name: Is the badge current (README = measured test count)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- badges-are-current /tmp/libtests.log
      - name: Paid content canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- paid-content-cannot-be-read-for-free --self-test
      - name: Paid content cannot be read for free
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- paid-content-cannot-be-read-for-free
      - name: Generatable content canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- generated-content-is-verifiable --self-test
      - name: Generatable content is verifiable
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- generated-content-is-verifiable
      - name: QR is derivative only canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- qr-is-derivative-only --self-test
      - name: QR is derivative only
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- qr-is-derivative-only
      - name: Three is recipe only canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- three-is-recipe-only --self-test
      - name: Three is recipe only
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- three-is-recipe-only
      # For a described object the recipe is the ONLY copy. An edit that changes the
      # generator does not produce a wrong image, it produces an object that can no longer be produced at all:
      # the id stops verifying and there are no bytes on disk to fall back to. Applied to a value
      # consistency does not catch this, because both sides of the comparison move
      # kayar. Nitekim gradyan jeneratoru bastan beri bozuktu: fixed_to_int
      # that had already left the scale, it discards both extreme colours
      # and drew flat black, hashing it consistently.
      - name: Zero-storage vector canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- zero-storage-bytes-are-frozen --self-test
      - name: Generated bytes are bound to a frozen vector
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- zero-storage-bytes-are-frozen
      - name: Unreachable gate canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- guards-are-reachable --self-test
      - name: Unreachable gate count did not grow
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- guards-are-reachable
      - name: Self-source-reading test canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- source-reading-tests-are-narrowed --self-test
      - name: Self-source-reading tests are narrowed
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- source-reading-tests-are-narrowed
      - name: Conflict marker canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-conflict-markers --self-test
      - name: No conflict markers in the tree
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-conflict-markers
      - name: Repair trigger canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- repair-fires-on-loss --self-test
      - name: Repair fires on loss
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- repair-fires-on-loss
      - name: the AI inference layer detection canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- ai-inference-reads-but-does-not-generate --self-test
      - name: the AI inference layer reads, does not produce
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- ai-inference-reads-but-does-not-generate
      # crates/ai-inference is a separate workspace: not a member of the root Cargo.toml, so
      # `cargo clippy --all-targets` never reached it. Only the gate above,
      # which reads the source text, existed. Result: the tree stopped compiling
      # and nobody saw it (`&'static [u16]` could not be derived with serde,
      # `ConnState: Default` was missing, one test was passing `&[]`). The build
      # and the tests were wired in here so it cannot break silently again.
      - name: the AI inference layer builds and its tests pass
        run: |
          cargo clippy --manifest-path crates/ai-inference/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/ai-inference/Cargo.toml
      # The B.U.D. core (bud/) was in the same silent hole: bud-core with 103 modules
      # -- ALL of B.U.D. 1.0/2.0/3.0 -- was built by no CI job,
      # because it is not a member of the root workspace and no step pointed
      # was not looked at. Measured: `clippy --features bud3 --all-targets -D warnings`
      # -> 91 violations, among them real nested bugs (an if with identical branches,
      # a lost Vec capacity, a misplaced cfg gate).
      #
      # All three configurations run because the versions are split by feature:
      # default (bud2) and bud3 compile different module sets, while no-default
      # what falls outside both. Skipping a configuration is exactly the
      # would hide the "a 3.0 module leaked into the 2.0 build" bug found this
      # would leave behind.
      # `cargo fmt --all` scans the root workspace; because `bud/` is not a member of it
      # there was no formatting check in this tree. Measured: 119
      # 103 of the files had drifted from rustfmt output. Formatting does not change
      # behaviour, but an unchecked tree becomes unreadable over time and
      # telling a real change from noise gets harder. The tree was fixed once
      # (`2c95cfe2`); this step prevents it drifting back.
      - name: B.U.D. core is formatted
        run: cargo fmt --manifest-path bud/Cargo.toml --all -- --check
      - name: B.U.D. core builds and its tests pass
        run: |
          cargo clippy --manifest-path bud/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path bud/Cargo.toml --features bud3 --all-targets -- -D warnings
          cargo clippy --manifest-path bud/Cargo.toml --no-default-features --all-targets -- -D warnings
          cargo test --manifest-path bud/Cargo.toml --features bud3
      # `slice[i]` stops the process under the release profile (panic = abort); that is
      # the same liveness class as `unwrap`. 66 files in the tree carry this debt and
      # most of them in index-heavy parsers (RLP/MPT/erasure), and converting those to iterators
      # converting them would hide the index-equality bug we want to keep visible. So
      # the number is frozen: the existing 66 files may keep their debt, a file not on
      # the list may NOT add a new index.
      - name: Indexing canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- indexing-is-not-new --self-test
      - name: A new file adds no panicking index
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- indexing-is-not-new
      - name: Derived content canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- derived-content-stays-byte-exact --self-test
      - name: Derived content is byte-exact
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- derived-content-stays-byte-exact
      # A derived object holds no bytes of its own: reading it means fetching the master and
      # recomputing. When the master goes, storage does not shrink, the derivation is gone
      # happens, and happens silently: the derivation manifest is still there, still looks
      # valid. The first sign is a read that cannot be served. dictionary.rs solved the same
      # shape with a reference count and a grace window; derivations needed the same
      # protection, and none of it was there.
      # A storage decision divides two ratios; only the ratios matter, so the common
      # scale cancels. The danger is exactly here: applying the scale to one ratio and not the other
      # not applying it shifts every threshold by that factor and nothing looks
      # invisible. Indeed on the first writing the CPU ratio was at 1e9 scale and the disk ratio at 1e6;
      # the described-content threshold read 0.4 instead of the measured 418 and all tests
      # passed, because the tests compared thresholds against each other and both sides
      # had shifted together. It was caught by recomputing outside Rust.
      - name: Threshold ratios single-scale canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- threshold-rates-share-one-scale --self-test
      - name: Threshold ratios on a single scale
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- threshold-rates-share-one-scale
      - name: Derivation durability canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- a-derivation-cannot-outlive-its-master --self-test
      - name: Bir turev master'indan uzun yasayamaz
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- a-derivation-cannot-outlive-its-master
      - name: Claim unit canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- reduction-claims-state-both-units --self-test
      - name: The claim states both units
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- reduction-claims-state-both-units


  budzero:
    name: BudZero / BudZKVM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budzero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        # NOTE: master 2026-07-16 and later make the `toolchain` input MANDATORY
        # (CI evidence: job 87741629986 - "'toolchain' is a required input").
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budzero
          workspaces: budzero
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  bud-e2e-invariants:
    # 9 module-independence invariants as a named REQUIRED
    # job. Name canary: if an invariant is deleted or renamed the gate
    # FAILs even if `cargo test` stays green (vacuous-gate protection, with canary).
    name: B.U.D. E2E Invariants (9/9 isim-kilitli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Gate canary (proof it is not vacuous)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- bud-e2e --self-test
      - name: bud_e2e - 9 invariants + 3 e2e (name canary)
        run: |
          cargo test --lib bud_e2e 2>&1 | tee /tmp/bud-e2e.txt
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- bud-e2e /tmp/bud-e2e.txt

  economy-invariants:
    # : EIP-1559 + reward-pool + committed-supply denominator locks.
    # Name canary prevents a vacuous green if tests are renamed/deleted.
    name: Economy Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Economy invariant gate canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- economy-invariants --self-test
      - name:  named invariant tests
        run: |
          set -euo pipefail
          cargo test --lib 2>&1 | tee /tmp/economy-invariants.txt
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- economy-invariants /tmp/economy-invariants.txt

  fork-choice-gate:
    # : per-domain fork-choice/lifecycle named tests.
    # Name canary prevents a vacuous green if fork-choice tests are renamed/deleted.
    name: Fork-Choice Invariants
    runs-on: ubuntu-latest
