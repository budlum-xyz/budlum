name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  budlum:
    name: Budlum Core
    runs-on: ubuntu-latest
    # Rozet self-commit'i (Q5, loop guard'lı) yalnız bu job'da write ister;
    # Diğer tüm job'lar global minimalde (contents: read) kalır.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0  # zizmor: ignore[artipacked] rozet botu self-commit icin GITHUB_TOKEN kasitli
        with:
          persist-credentials: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy pedantic/nursery ratchet (izleme modu)
        # Uyarı gorunurlugu + sayi-artisina karsi ratchet (baseline 191,
        # Kanit .github/clippy-extra-baseline.txt). Sifira indirme kademeli/azimli.
        run: |
          set -euo pipefail
          bash ./scripts/check-clippy-extra.sh --self-test
          cargo clippy --all-targets --message-format=json -- -W clippy::pedantic -W clippy::nursery > /tmp/clippy-extra.json 2>/dev/null || true
          # Diagnostic only: the ratchet reports a count, and the JSON it counts
          # lives in the runner's /tmp, so a trip leaves nothing to inspect.
          # This prints the per-lint tally and every first-party file:line.
          # It writes nothing and runs before the gate, so it cannot change the
          # verdict.
          python3 ./scripts/clippy-extra-report.py /tmp/clippy-extra.json
          bash ./scripts/check-clippy-extra.sh /tmp/clippy-extra.json
      - name: "Feature matrix: pq-ml-dsa solo"
        run: |
          set -euo pipefail
          cargo check --no-default-features --features pq-ml-dsa
          cargo clippy --no-default-features --features pq-ml-dsa --all-targets -- -D warnings
          # `check` and `clippy` prove it compiles. They do not run a single
          # signature. `pq-ml-dsa` is a consensus choice - `PQ_SCHEME_ID` is
          # written into genesis and `validate_pq_scheme` refuses to start on a
          # mismatch, so an operator can select it for mainnet, and until now
          # no test had ever generated a key or verified a signature under it.
          # The crypto module's own tests are the minimum bar for a signature
          # scheme that gates validator registration.
          cargo test --no-default-features --features pq-ml-dsa --lib crypto:: 2>&1 | tee /tmp/mldsa-tests.log
          # Guard against the filter silently matching nothing: a `cargo test`
          # that runs zero tests exits 0 and looks identical to a pass.
          if grep -qE 'running 0 tests' /tmp/mldsa-tests.log; then
            echo "HATA: pq-ml-dsa altinda 0 test kostu -> filtre eslesmedi (vacuous)"
            exit 1
          fi
          # And that the ones that matter are among them. `crypto::` also
          # matches PKCS#11 parsing and policy tests, which would pass without
          # a single signature being produced.
          for t in test_keypair_generation test_sign_and_verify test_deterministic_signature; do
            grep -qE "primitives::tests::$t \.\.\. ok" /tmp/mldsa-tests.log \
              || { echo "HATA: $t pq-ml-dsa altinda kosmadi/gecmedi"; exit 1; }
          done
          grep -E 'test result:' /tmp/mldsa-tests.log
      - name: Feature canary - --all-features REDDEDILMELI
        run: |
          set -euo pipefail
          if cargo check --all-features 2>/dev/null; then
            echo "HATA: --all-features derlendi -> compile_error guard yok (vacuous gate!)"
            exit 1
          fi
          echo "Kanarya OK: --all-features beklendigi gibi compile_error ile rededildi (PQ backend'ler mutually exclusive)."
      - name: Test
        # Pipefail zorunlu: tee tek başına exit 0 döner; aksi halde test fail
        # Core job'ı sahte-yeşil yapar (kanıt: d815561 Test=success, 1 fail gizli;
        # Coverage nextest aynı fail ile kırmızı - 2026-07-19).
        run: |
          set -euo pipefail
          cargo test --lib --verbose 2>&1 | tee /tmp/libtests.log
      - name: cargo doc (Madde 6 - public API dokümantasyon)
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features pq-dilithium 2>&1 | tee /tmp/doc.log
          echo "cargo doc: warnings as errors - passed"
      - name: Rozet kanaryasi (log'dan bagimsiz)
        run: bash ./scripts/check-badges-are-current.sh --self-test
      - name: Rozet guncel mi (README = olculen test sayisi)
        run: bash ./scripts/check-badges-are-current.sh /tmp/libtests.log


  budzero:
    name: BudZero / BudZKVM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budzero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        # NOT: master 2026-07-16+ `toolchain` input'unu ZORUNLU kiliyor
        # (CI kanit: job 87741629986 - "'toolchain' is a required input").
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budzero
          workspaces: budzero
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  bud-e2e-invariants:
    # 9 modül-bağımsızlık invariant'ı isimlendirilmiş ZORUNLU
    # Job. İsim kanaryası: bir invariant silinir/yeniden adlandırılırsa kapı
    # `cargo test` yeşil kalsa bile FAIL olur (vacuous-gate koruması, kanaryalı).
    name: B.U.D. E2E Invariants (9/9 isim-kilitli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Kapı kanaryası (vacuous değil kanıtı)
        run: bash ./scripts/check-bud-e2e.sh --self-test
      - name: bud_e2e - 9 invariant + 3 e2e (isim kanaryalı)
        run: |
          cargo test --lib bud_e2e 2>&1 | tee /tmp/bud-e2e.txt
          bash ./scripts/check-bud-e2e.sh /tmp/bud-e2e.txt

  economy-invariants:
    # : EIP-1559 + reward-pool + committed-supply denominator locks.
    # Name canary prevents a vacuous green if tests are renamed/deleted.
    name: Economy Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
