  # ============================  /  (P0) ============================
  # Strict mod: aşağıdaki tüm job'lar ilk günden FAIL kapısıdır (ruhu).
  # Kapıların "boş" (vacuous) olmadığı kanarya testleriyle her koşuda kanıtlanır.

  poa-isolation:
    # CI Genişletme Madde 9: PoA/Permissionless izolasyon test seti.
    # 5 farklı sızma senaryosu + 2 ek invariant testi.
    name: PoA Isolation (7/7 sızma-kilitli) (CI Madde 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
