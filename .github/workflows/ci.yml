  cargo-deny:
    # : the root and budzero graphs are checked in separate matrix steps.
    name: Cargo Deny (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The root policy moved to .quality/deny.toml, so it has to be named
          # explicitly; budzero keeps its own deny.toml next to its manifest,
          # which cargo-deny discovers on its own.
          - { name: root, manifest: "./Cargo.toml", config: "--config .quality/deny.toml" }
          - { name: budzero, manifest: "budzero/Cargo.toml", config: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo deny check (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features ${{ matrix.config }}
          command: check

  license-compliance:
    # Dependency licence compatibility, kept as its own job on purpose.
    #
    # `cargo-deny check` (the job above) already covers licences as one of its
    # four sections, but a failure there surfaces as one red "Cargo Deny" check
    # and the reason has to be dug out of the log. Licence compatibility is a
    # legal-exposure question rather than a hygiene one, so it gets a check
    # that says in its own name what broke.
    #
    # This does not replace or weaken the combined run: both stay required.
    name: License Compliance (dependency licences)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: root, manifest: "./Cargo.toml", config: "--config .quality/deny.toml" }
          - { name: budzero, manifest: "budzero/Cargo.toml", config: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny (pinned)
        run: cargo install --locked --version 0.20.2 cargo-deny

      # Canary: prove the licence gate can reject something before trusting a
      # green result. A tree checked against an empty allow-list must fail; if
      # it passes, the gate is not evaluating licences at all.
      - name: Gate canary (an empty allow-list must fail)
        run: |
          set -euo pipefail
          mkdir -p /tmp/lic-canary
          printf '[licenses]\nallow = []\nconfidence-threshold = 0.8\n' > /tmp/lic-canary/deny.toml
          if cargo deny --manifest-path "${{ matrix.manifest }}" \
               --config /tmp/lic-canary/deny.toml check licenses >/dev/null 2>&1; then
            echo "FAIL: an empty allow-list was accepted - the licence gate is vacuous." >&2
            exit 1
          fi
          echo "Canary rejected as expected; the gate evaluates licences."

      - name: cargo deny check licenses
        run: |
          set -euo pipefail
          cargo deny --all-features --manifest-path "${{ matrix.manifest }}" \
            ${{ matrix.config }} check licenses

      # Inventory for the audit trail: what each dependency is licensed under,
      # not merely whether the run passed.
      - name: Licence inventory (summary)
        if: always()
        run: |
          {
            echo "### Dependency licences - ${{ matrix.name }}"
            echo ""
            echo '```'
            cargo deny --all-features --manifest-path "${{ matrix.manifest }}" \
              ${{ matrix.config }} list 2>/dev/null | cut -c1-200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz-quick:
    #  + : mevcut target'lar + 3 yeni (consensus/relayer/zk).
    # Long runs are handled by fuzz-nightly.yml (schedule, 4h/target, corpus cache).
    # Quick: 60s/target (10 targets x 60s ~ 10min + build; timeout-minutes 60).
    name: Fuzz Quick (60s x 9 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (nightly - cargo-fuzz gereksinimi)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: nightly
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          shared-key: fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz
      # The corpus is carried across runs. Without this every run starts from
      # an empty corpus, so the same 60 seconds re-explores the same shallow
      # surface each time and the gate never gets deeper. `fuzz-nightly.yml`
      # already caches per target; this is the same pattern for the quick set,
      # in one entry because the quick job runs all nine in a single job.
      #
      # `restore-keys` is the part that matters: the exact key contains the
      # run id and will never hit, so the prefix match is what pulls the most
      # recent corpus forward.
      - name: Corpus cache (rolling, nine targets together)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            fuzz/corpus
          key: fuzz-quick-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-quick-corpus-
      - name: Her target 60 saniye fuzz
        # cargo-fuzz resolves fuzz/Cargo.toml relative to the CURRENT crate root;
        # it must be run from the repo root (calling from fuzz/ gives a fuzz/fuzz error).
        run: |
          set -euo pipefail
          targets=(
            block_deserialize
            consensus_validate
            fuzz_blockchain_serialize
            snapshot_deserialize
            transaction_deserialize
            consensus_state_transition
            reputation
            relayer_escrow
            zk_verifier
            budl_compile
            vm_execute
          )
          # evm_rlp_decode and evm_mpt_verify run in fuzz-nightly.yml. This
          # comment used to say "nightly/manual" while the nightly matrix did
          # not list them either, so for as long as it stood the two targets
          # compiled and never ran. `every-fuzz-target-is-run` now measures
          # that instead of trusting the sentence.
          #
          # `vm_execute` runs here rather than only nightly: it caps the
          # program at 4096 instructions and the gas at fifty thousand, so a
          # loop terminates in milliseconds and the target keeps up with a
          # sixty second budget.
          #
          # `budl_compile` runs here because the front end is cheap to drive:
          # it parses and type checks and returns. `budl_compile_then_run`
          # executes what it emitted and is left to fuzz-nightly, since an
          # accepted program can spend the whole gas limit before halting and
          # one slow input would eat the 60 second budget for the target.
          for t in "${targets[@]}"; do
            echo "=== fuzz-quick: $t (60s) ==="
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -timeout=25 -print_final_stats=1
          done
          echo "All fuzz targets clean."
      - name: Crash artifact (varsa)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-quick-crashes-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  secret-scan:
    # : secret scan over the FULL git history (fetch-depth: 0).
    # We use the gitleaks OSS binary: the official GitHub Action asks organisation
    # repos for GITLEAKS_LICENSE (an external registration); the binary runs the same engine
    # without a licence. Version + sha256 are pinned. Moving to the official action
    # can be considered once a licence key is obtained (the security output
    # is byte-identical).
    name: Secret Scan (gitleaks, full history)
    runs-on: ubuntu-latest
    # security-events: write is needed so gitleaks findings upload to the Security tab as
    # required so it uploads as such. The workflow-wide setting is `contents: read`;
    # The elevation is granted to this job only.
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks v8.30.1 (version + sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Canary - proof the gitleaks alarm fires
        run: |
          set -euo pipefail
          # NOTE: the fake token is never written to this file as one piece;
          # the parts are joined at runtime. Otherwise the repo's
          # own history scan would take this pattern for a leak and FAIL.
          PFX="gh""p_"
          S1="xK9mQ2vR7pL4nT8w"
          S2="Y3zB6cF1hJ5sD0gE42uI"
          mkdir -p /tmp/gitleaks-canary
          cd /tmp/gitleaks-canary
          git init -q .
          printf 'example_key = "%s%s%s"\n' "$PFX" "$S1" "$S2" > canary.txt
          git add .
          git -c user.email=ci@budlum.xyz -c user.name=ci commit -qm canary
          if gitleaks detect --source . --redact --no-banner; then
            echo "ERROR: gitleaks did not catch the canary -> the scan is untrustworthy (vacuous gate)!"
            exit 1
          fi
          echo "Canary caught -> the gitleaks alarm works."
      # Two steps: first generate SARIF (--exit-code 0 -> the step does not fall
      # even with findings), then upload to the Security tab, and run the gate last.
      # If one step is asked for both a report and a fail, the step dies right there when a
      # dies and the upload never runs; that is, the findings most critical to see
      # finding appears and nothing reaches the Security tab.
      - name: Full history scan - generate SARIF (reporting, not a gate)
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact \
            --report-format sarif --report-path gitleaks.sarif --exit-code 0
      - name: Upload gitleaks SARIF (Security tab)
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Full history scan (a finding = fail)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  timing-safe:
    # : static scan for raw equality in RPC/crypto + dudect-style
    # Istatistiksel zamanlama regresyon testi (cargo bench).
    name: Timing-Safe Regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Static scan + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- timing-safe
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- timing-safe --self-test
      - name: Dudect-style statistical timing test
        run: cargo bench --bench timing_safe
      # Ratio packing throughput with a determinism refusal: the step fails if the
      # rayon path produces different bytes than the serial path, so the numbers
      # printed here are measurements of a path that is provably equivalent.
      - name: Ratio rayon vs serial throughput
        run: cargo bench --bench ratio_rayon
      # Erasure parity rows: serial loop against the pool dispatch above the
      # window, plus the encode->verify reference roundtrip. The step dies
      # (exit 2, no numbers) if the pool result differs by any byte, so the
      # printed MB/s always describe an equal-output path.
      - name: Erasure parity rows rayon vs serial throughput
        run: cargo bench --bench erasure_rows

  docker-security:
    # : Dockerfile statik lint (hadolint) + repo fs trivy taramasi.
    # The hadolint binary is version+sha256 pinned (the gitleaks pattern). DL3008 (apt version
    # Pinleme) warning seviyesinde birakilir: bookworm apt churn'une karsi
    # A deliberate calibration: with failure-threshold: error only error+ FAILs.
    name: Docker Security (trivy + hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # security-events: write is needed so Trivy findings upload to the Security tab as
    # required so it uploads as such. The workflow-wide setting is `contents: read`;
    # The elevation is granted to this job only.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint v2.14.0 (version + sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version
      - name: Dockerfile lint (failure-threshold=error)
        run: hadolint --failure-threshold error ops/Dockerfile
      # Two steps: first generate SARIF (exit-code 0 -> the step does not break the job), then
      # upload to the Security tab, and run the gate last. Asking one step for both SARIF
      # if exit-code 1 is also given, the step dies when a finding appears and the upload
      # never runs; findings do not reach the Security tab. In this order a finding
      # becomes visible AND the job still turns red.
      - name: Trivy fs scan - generate SARIF (reporting, not a gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
          ignore-unfixed: true
      - name: Trivy SARIF yukle (Security sekmesi)
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy fs gate (secret + misconfig; CRITICAL/HIGH = fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  coverage:
    # : nextest + llvm-cov, ratchet gate (Q-7b1(a)).
    # Baseline evidence 2026-07-17: lines 64.15% (14493/22594), 531/531 PASS.
    # Tools are version+sha256 pinned (nextest verified byte for byte against the official .sha256 asset).
    name: Coverage (nextest + llvm-cov, ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: cargo-llvm-cov v0.8.7 + nextest 0.9.140 kur (sha256 pinli)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/clcov.tar.gz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168  /tmp/clcov.tar.gz" | sha256sum -c -
          # The hash is fixed HERE. Previously the neighbouring `.sha256` file was downloaded from the same
          # release and verified against it: whoever changes the artefact
          # also changes the hash file next to it, so the check was validating
          # itself. The step name said "sha256 pinned" and it was not a pin.
          # This value was downloaded and computed independently (2026-07-31).
          curl -sSfL -o /tmp/nextest.tar.gz \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.140/cargo-nextest-0.9.140-x86_64-unknown-linux-gnu.tar.gz
          echo "4ee9aaa0d0171a985a5d0eb735b87355894c1c455972e9674fb9fdbd1387c9a3  /tmp/nextest.tar.gz" | sha256sum -c -
          mkdir -p ~/.cargo/bin
          tar -xzf /tmp/clcov.tar.gz -C ~/.cargo/bin/
          tar -xzf /tmp/nextest.tar.gz -C ~/.cargo/bin/
          cargo llvm-cov --version && cargo nextest --version
      - name: Gate canary (vacuous-gate protection)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- coverage --self-test
      - name: Measurement + ratchet gate
        run: |
          mkdir -p coverage
          cargo llvm-cov nextest --lib --json --output-path coverage/cov.json
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- coverage coverage/cov.json
      - name: Module analysis canary (not vacuous)
        run: python3 ./ops/scripts/check_module_coverage.py --self-test
      - name: Module coverage report - budlum (baselines in step 2, NO vacuous gate)
        run: python3 ./ops/scripts/check_module_coverage.py coverage/cov.json
      - name: BudZero coverage measurement (llvm-cov nextest, budzero workspace)
        # `cd` was used without checking its exit code. If the directory is not found
        # the shell stays at the root, the next command measures the ROOT workspace and
        # it writes the output as `budzero-cov.json`: the next step
        # reports it as if it were budzero's coverage. Not a wrong number, but
        # a number from one tree, under the right file name.
        run: |
          set -euo pipefail
          cd budzero
          cargo llvm-cov nextest --workspace --json --output-path ../coverage/budzero-cov.json
      - name: Module coverage report - budzero (report mode)
        run: python3 ./ops/scripts/check_module_coverage.py coverage/budzero-cov.json
      - name: Coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/   # cov.json + budzero-cov.json (module baselines come from this artifact)
          retention-days: 30

  repo-lint:
    # : actionlint + buf + genesis schema (one combined static gate).
    # Tools are version+sha256 pinned. buf breaking, when buf.yaml is present on main,
    # becomes active (the baseline is established with this wave - SKIP on the first run is an honest marker).
    # the zizmor workflow security lint also runs in this job (with canary, zero-finding policy).
    name: Repo Lint (actionlint + buf + genesis + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: actionlint v1.7.12 kur (sha256 pinli)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint --version
      - name: actionlint gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- actionlint --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- actionlint
      - name: zizmor gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- zizmor --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- zizmor
      # Gate scripts that no workflow invokes prove nothing but still get
      # counted as gates. Four had accumulated that way before this check.
      - name: gate wiring + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- gates-are-wired --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- gates-are-wired
      # The gates are moving to Rust. A gate decides what enters the main branch,
      # it is inside the trust boundary, and the shell is a bad language for that:
      # a misspelled variable is not an error but an empty string, so a check
      # can examine nothing and say OK. On this branch two gates passed while missing
      # the very defect they were written for. The Rust version stops if it does not compile.
      - name: Rust gates canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- --all --self-test
      - name: Rust gates
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- --all
      - name: Rust gates clippy (pedantic, allow yok)
        run: cargo clippy --release --manifest-path xtask/gates/Cargo.toml --all-targets
      - name: Rust gates rustfmt
        run: cargo fmt --manifest-path xtask/gates/Cargo.toml --check
      # A typographic dash in a workflow `name:` silently unlists the job from
      # branch protection: it runs, it passes, and it stops counting. Three
      # required checks were carrying one. A hand count already missed them
      # once, so the count is now a gate.
      # Two independent implementations derive a user's address: the wallet's
      # (crates/wallet-core, a separate workspace built as a cdylib) and the
      # node's (src/crypto/primitives.rs, on the live block and transaction
      # path). Neither crate depends on the other, so the compiler cannot see
      # the pair. If they diverge, a wallet shows an address the chain will
      # never credit and the funds sent there cannot be spent - with no error
      # anywhere, because both sides work and disagree.
      - name: wallet/node address agreement gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- wallet-node-address-agree --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- wallet-node-address-agree
      # The tree is written in English. Turkish is allowed in exactly three
      # places: README.tr.md, a Turkish localisation directory whose strings are
      # what the Turkish user reads, and the word "Türkçe" as the label on the
      # link that points at that README. The translation is unfinished, so the gate ratchets
      # off .github/turkish-baseline.txt: counts only go down, and a count that
      # is higher than what is actually in the file also fails, so finishing
      # the work is the only way to keep this green.
      - name: tree is English gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- tree-is-english --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- tree-is-english
      # A public item nothing outside its own file names is idle: the code that
      # was meant to call it does not. The wiring gates ask this per module, so
      # one exported symbol marked a whole module "wired" and the rest coasted.
      # This asks per item, ratcheted off .github/idle-code-baseline.txt.
      - name: no idle code gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-idle-code --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-idle-code
      # A registered Prometheus metric that nothing writes is a dashboard lie:
      # scrapes report a permanent zero next to real counters. Ratched off
      # .github/unwritten-metrics-baseline.txt; the baseline only shrinks.
      - name: metrics are written gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- metrics-are-written --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- metrics-are-written
      - name: typographic dash gate + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-unicode-dashes --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-unicode-dashes
      # A fuzz target only fuzzes if three files agree: the harness,
      # fuzz/Cargo.toml'daki [[bin]], ve onu kosturan bir workflow. Uclusunden
      # if one is missing the target appears in the list and does nothing.
      - name: fuzz target wiring + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- fuzz-targets-are-wired --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- fuzz-targets-are-wired
      # COL_REG_SAME gated register continuity while being a free column
      # itself: no booleanity, no constraint on the 1-r_same side, and absent
      # from the LogUp argument. Writing zero before a read deleted the rule
      # that a read returns what was written, and register values are the
      # inputs to every arithmetic constraint. The memory table has the same
      # shape and was never vulnerable, because there 1-m_same gates "first
      # read of a new address returns zero", so the lie costs something.
      - name: are constraint-disabling flags pinned + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- gating-flags-are-pinned --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- gating-flags-are-pinned
      # Every per opcode rule in the AIR runs under `builder.when(is_<op>)`.
      # Booleanity and the exclusivity sum force exactly one selector per row
      # but never say which one, so 29 of the 35 were free: an honest Assert
      # row could set is_mul instead and have the multiplication identity
      # (0 == x * 0, since rd and rs2 are zero there) stand in for the
      # assertion that was supposed to run. This gate keeps the next selector
      # from being added unbound.
      - name: AIR selector-opcode binding + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- air-selectors-are-opcode-bound --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- air-selectors-are-opcode-bound
      # The memory argument decided whether a CPU row demands a memory entry
      # with `(is_load + is_store) * rs1_idx`, and rs1_idx is a register
      # number. `Store r0, r7, r2` asked the bus for seven copies of a row the
      # memory table supplies once, so every correct program whose pointer was
      # not in r1 had no valid proof, and the multiplier feeding the argument
      # was a prover-supplied field element rather than a flag. Every test in
      # the tree happened to use r1.
      - name: are LogUp multiplicities boolean + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- logup-multipliers-are-boolean --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- logup-multipliers-are-boolean
      # The AIR packs the CPU, register and memory tables into one matrix and
      # nothing keeps them the same length. A constraint reading a side table
      # must fire on the last row, not on the last CPU row. The register image
      # accumulator learned this the hard way: three register events per step
      # made that table outrun the CPU table, the fold was still running when
      # the CPU side halted, and four honest proofs stopped verifying. The
      # memory image had the identical shape and survived only because no
      # opcode currently emits two memory events in one step.
      - name: are cross-table checks on the last row + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- cross-table-checks-use-last-row --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- cross-table-checks-use-last-row
      # The Fiat-Shamir transcript carried the degrees, the commitments and the
      # public values, but not the FRI parameters, and those decide what a
      # proof is worth: measured, log_blowup 3 with 100 queries and 16 grinding
      # bits is roughly 316 bits, while 1 query with log_blowup 1 and no
      # grinding is one bit and produces a proof of the same shape. Least
      # Authority found this exact class in Plonky3. Absorbing them is half the
      # fix; the other half is that the absorbed numbers must be read out of
      # the FriParameters value in force rather than written down a second
      # time, because two sources of truth for one parameter set drift.
      - name: are FRI parameters in the transcript and derived + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- security-parameters-are-derived --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- security-parameters-are-derived
      # A transition constrains the difference between consecutive rows and
      # never says where the sequence starts. COL_EVENT_DIGEST_0 had only a
      # transition and a last-row comparison, so the whole accumulator could
      # slide: write D on the first row, every relative step still holds, and
      # the proof announces an event digest for events that were never
      # emitted. storage_deal.rs packs its entire replay context into that
      # field. Every other accumulator in the AIR already pinned its first
      # row, which is exactly why the missing one was easy to miss.
      - name: is the first row of accumulators fixed + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- accumulators-pin-their-first-row --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- accumulators-pin-their-first-row
      # Lt/Gt/Lte/Gte and And/Or/Xor answer from 64 bit columns, and the only
      # thing tying those to the register value was booleanity plus
      # sum(b_i * 2^i) == val. Goldilocks is 2^64 - 2^32 + 1, so every value
      # below 2^32 - 1 has a second valid bit string: 5 and 5 + P both
      # reconstitute to 5, and the second sets the top bit. The comparison
      # reads the bits, so the prover picked the answer, and a contract
      # checking balance >= amount through any of these had a check the prover
      # decided.
      - name: is bit decomposition canonical + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- bit-decompositions-are-canonical --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- bit-decompositions-are-canonical
      # The VM halts Assert only on a zero condition; the AIR demanded exactly
      # 1. Those agree on 0 and 1 and nowhere else, and every test fed it a
      # comparison result, which is 0 or 1. BudL constrain(...) lowers to this
      # opcode, so constrain(flags & MASK) was a contract the VM ran and no
      # prover could prove. A field element has no order, so "non-zero" needs
      # an inverse witness rather than a comparison against a constant.
      - name: do zero tests use an inverse witness + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- zero-tests-use-an-inverse-witness --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- zero-tests-use-an-inverse-witness
      # WalletBindingCapabilities reported uniffi_mobile: true and
      # wasm_browser: true while the tree had no .udl file, no
      # uniffi::export, and no #[wasm_bindgen] anywhere. Both binding modules
      # held a single function returning that same struct. It is a capability
      # descriptor, so something reads it to decide what it can call, and a
      # flag that is true regardless of the work being done cannot be told
      # apart from one that means the work is done.
      - name: does the binding claim match reality + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- binding-claims-match-reality --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- binding-claims-match-reality
      # A module can compile, lint, pass its own tests and still never run.
      # `storage/mobile_self.rs` holds the rule that critical B.U.D. content
      # needs a paid replica rather than a phone that is only sometimes online.
      # It is written, it is tested, and no production caller reaches it, so
      # nothing enforces it. Green tests are the strongest evidence for the
      # wrong conclusion here: they pass because the function is correct, not
      # because anything invokes it. Fifteen other modules measured the same.
      - name: are capability modules wired + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- capability-wiring --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- capability-wiring
      # A test module that imports specific names from its parent rather than
      # globbing is good practice and also a trap: tests appended to the file
      # land in the last module, and a narrow import does not bring the new
      # function along. `cargo check --lib` does not compile test bodies, so
      # the library builds clean locally and the failure surfaces only here,
      # as `cannot find function ... in this scope`. That happened once and
      # cost a full CI round trip; this gate answers the same question in
      # three seconds.
      - name: do test modules see what they call + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- test-module-imports --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- test-module-imports
      # B.U.D. storage cost `epochs * fee_per_epoch`, with no byte count in it,
      # so a 1 KiB and a 16 MiB shard cost the same for the same duration. The
      # client picks the size, so this was ordinary use rather than an attack.
      # The size was never missing: `open_deal` already looks the shard up in
      # the manifest to check membership, so `ShardRef.size` was in hand where
      # the price was computed and simply went unread.
      - name: is storage priced by size + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-is-priced-by-size --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-is-priced-by-size
      # Two entry points take a manifest an untrusted caller built.
      # `RegisterStorageManifest` ran `validate_untrusted`; `open_deal` ran
      # `verify_id` and stopped, and it is the path that also takes the payer's
      # money. `verify_id` proves the id derives from the fields present, not
      # that they agree: `manifest_id` covers k and n, so three data shards
      # with no parity declared (k=1, n=3) hashes consistently and reports a
      # loss tolerance of two on an object that survives nothing.
      - name: is an untrusted manifest fully checked + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- untrusted-manifests-are-fully-validated --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- untrusted-manifests-are-fully-validated
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- evidence-provenance-is-checked --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- evidence-provenance-is-checked
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- every-opcode-has-a-forgery-test --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- every-opcode-has-a-forgery-test
      # A self-derived id is a commitment to the fields it hashes and to
      # nothing else. `AiInferenceRequest.effort` was added to the struct and
      # to `calculate_id` in one change; had it landed in the struct alone,
      # an operator could take a 5.0x request, rewrite the tier to 0.5x, keep
      # the id it was handed, and claim the deep fee, with every test still
      # green because the tests assert a round-trip and not that changing the
      # tier changes the id.
      - name: does a self-derived id cover every field + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- self-derived-ids-cover-every-field --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- self-derived-ids-cover-every-field
      # The id gate has a sibling hole. An id binds a field only to whoever
      # re-derives it; the signature is what every node checks first, and
      # `Transaction::signing_hash` builds its preimage by hand, so a field
      # added to a struct, to the protobuf and to the conversions can miss the
      # one place 700 lines away that commits it. Three had:
      # `AiModelSpec.execution_weights_digest` and `.execution_dims`, which are
      # what separate two models sharing an architecture, and
      # `AiExecutionProof.public_inputs`, which is the claim the STARK is
      # checked against. A relaying node could rewrite any of them and the
      # signature still verified.
      - name: is every field from the wire signed + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- wire-fields-are-signed --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- wire-fields-are-signed
      # Four consensus digests appended a validator's key fields with nothing
      # between them. Concatenation without lengths is not injective: a
      # 96-byte BLS key plus a 48-byte PoP is byte-identical to a 144-byte BLS
      # key plus an empty PoP. `Validator` crosses the wire inside a snapshot
      # with all four fields `#[serde(default)]` and the restore copies them
      # verbatim, so a peer could reproduce an honest state root while
      # installing a validator with no PoP, which `is_consensus_ready` then
      # drops from the active set. Same root, different validator set, no
      # error naming the cause.
      - name: are hash inputs length-prefixed + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- hash-inputs-length-prefixed --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- hash-inputs-length-prefixed
      # `settle_agent_payment_immediate` removed the payment from the live map
      # and then decided whether to accept it. One refusal put it back and the
      # other did not, so a second settle reported failure and consumed the
      # entry on its way out. Nothing rolls that back: `apply_block_checked`
      # propagates with `?`. The same shape cost `reclaim_agent_payment` worse
      # than that, since its success path then removed a second time and
      # unwrapped a `None`, and it stranded a storage operator's only chance
      # to answer a challenge before the deadline took its bond.
      - name: is there mutation before refusal + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- refusals-do-not-mutate-first --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- refusals-do-not-mutate-first
      # `node.rs` recovers from a poisoned PeerManager mutex in 76 places and
      # in four it did not: the /24 eclipse bound, the outbound-diversity
      # bound and both peer-count sites read `.lock()..unwrap_or(true)`, and
      # `true` is the permissive answer. One panic anywhere near the peer
      # table therefore switched the eclipse bound OFF, letting a single
      # operator fill the table from one subnet and surround the node.
      - name: a lock error must not open a boundary + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- lock-failures-do-not-open-a-bound --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- lock-failures-do-not-open-a-bound
      # `validate_transaction` required only `fee >= base_fee`, and `tx.amount`
      # reached pricing nowhere: it appeared in the overflow guard and the
      # balance check and nowhere else. Moving one base unit and moving a
      # quadrillion cost the same. This is the transfer twin of the storage
      # deal that charged the same for 1 KiB and 16 MiB.
      - name: are value transfers priced by value + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- value-transfers-are-priced-by-value --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- value-transfers-are-priced-by-value
      # `cargo test --workspace` says every test that ran passed; it says
      # nothing about which tests exist. The forgery tests are the only
      # evidence the AIR constrains anything, and one deleted in a refactor
      # leaves the suite exactly as green. `rejects_a_jump_past_the_end_of_the
      # _program` is the reason: nothing in the AIR bounds COL_PC, and what
      # refuses an out-of-range jump is the Program CTL, in a constraint that
      # never mentions jumps. SP1 shipped the neighbouring bug, Polygon zkEVM
      # the severe one.
      - name: are forgery tests name-locked + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- forgery-tests-are-named --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- forgery-tests-are-named
      # `src/storage/README.md` listed under maturity warnings that redundancy
      # was replication and there was no parity shard concept. By then
      # `ShardKind::Parity` existed, `ErasureScheme` was on the manifest and
      # `erasure.rs` was a working Reed-Solomon coder with sixteen tests;
      # BUD_STORAGE_ROADMAP.md recorded the same gap as closed. Two documents,
      # one tree, opposite answers. A caveat list is only useful while every
      # entry on it is true.
      - name: does the readme deny what the code owns + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- readme-does-not-deny-shipped-code --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- readme-does-not-deny-shipped-code
      # Two storage rules with the same failure mode: the data exists, the
      # tests pass, and nothing on the operator's path reads it. An operator
      # that misses a challenge sits out six hours, and a mobile operator may
      # hold a second copy but never the first. `mobile_self.rs` already
      # showed how this ends: it held the rule that critical content needs a
      # paid replica, had tests, and was never called by anything.
      - name: are storage penalties applied + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-penalties-are-enforced --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-penalties-are-enforced
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- content-encryption-bound --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- content-encryption-bound
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- shard-placement-is-sticky-and-staked --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- shard-placement-is-sticky-and-staked
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- coding-audit-samples-the-relationship --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- coding-audit-samples-the-relationship
      # The storage challenge verifier named three public inputs the AIR does
      # not produce for the program it names, so it rejected every proof
      # including a correct one, and the caller reads a rejection as a wrong
      # answer and takes the operator's bond. Every test was green because
      # every one of them passed `test-mock-proof`, which the production path
      # short-circuits. Designing how the Merkle path reaches the verifier is
      # a consensus-visible decision; until it is made, the penalty must not
      # fire on a rejection the chain cannot justify.
      - name: an unprovable path must not slash + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- uncheckable-proof-paths-do-not-slash --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- uncheckable-proof-paths-do-not-slash
      # B35: the fixed-point slash expression was written out at five call
      # sites across two workspaces, and the narrowing was not spelled the same
      # way in all of them. `as u64` truncated where the Kani mirror panicked,
      # so a ratio one unit above the ceiling took a millionth of the bond
      # instead of all of it.
      - name: does the slash expression have one home + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- slash-expression-has-one-home --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- slash-expression-has-one-home
      # A gate that names its required tests by hand is only as good as those
      # names. Merging the hardening branches moved a `#[test]` attribute onto
      # the wrong function and silently un-tested
      # `total_bud_committed_counts_stake_and_unbonding`, which
      # check-economy-invariants.sh lists as required.
      - name: are required tests actually tests + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- required-tests-are-tests --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- required-tests-are-tests
      # A HashMap folded into a root() hashes its entries in a per-process
      # random order, so two honest nodes disagree. Thorchain halted on exactly
      # this; determinism.yml compares digests across three OSes and cannot see
      # a per-process seed, so this reads the source instead.
      - name: are consensus maps ordered + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- consensus-maps-are-ordered --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- consensus-maps-are-ordered
      # The Dockerfile said it had been moved to 1.94.0 and was still on
      # 1.97.1 - tag *and* digest, verified against the registry. Codegen
      # differs between releases, so the shipped container was outside the
      # reproducibility claim determinism.yml makes. rust-toolchain.toml was
      # not copied into the build context either, so nothing corrected it.
      - name: docker toolchain pin + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- docker-toolchain-matches-pin --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- docker-toolchain-matches-pin
      # The nextest step was named "(sha256 pinli)" and fetched the .sha256
      # from the same release as the tarball. Whoever can replace one can
      # replace the other, so it verified transit and not provenance.
      - name: are download pins actually pins + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- pinned-downloads-are-really-pinned --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- pinned-downloads-are-really-pinned
      # A git dependency's version field is whatever the manifest says at that commit,
      # is that, and it does not move when the code changes. In the pinned rust-libp2p tree,
      # uc commit de `libp2p-gossipsub 0.50.0` der: 8541b83b'de backoff.rs'te
      # no checked_add (both overflow paths open), a7d59cbf closes the addition side,
      # 5d47d9d5 closes the heartbeat side. One version string, three distinct security
      # postures. 0.50.0 was never published to crates.io, so nothing
      # no advisory range covers it either. cargo-vet treats a git dependency as
      # "unauditable" and counts none of the 23 packages; Cargo writes no
      # checksum into the lock for a git source. The only remaining method: read
      # the source at the pinned revision, write down what was read, and force a
      # fresh read whenever the pin moves.
      - name: are git dependencies audited per commit + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- git-deps-are-audited-by-commit --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- git-deps-are-audited-by-commit
      # regeneration: the canonical hash that says which program a zk proof was produced for
      # lives in four places in the tree, across three crates, with two hash libraries
      # is computed. That all four return the same result was an assumption and
      # assumptions go stale. If they diverge, the value written to the allowlist and
      # the value the verifier computes from the proof differ: either every honest
      # proof is refused, or a program not on the list counts as being on it.
      # The gate REGENERATES the value with an independent Keccak-256; it does not
      # soyledigine inanmaz.
      - name: regeneration (canonical code regenerated, convergent) + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- regeneration --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- regeneration
      # Relay: ships the regeneration consensus (tokens + proof-side canonical
      # set + signed relay-status.json) to external consumers. Runs after
      # regeneration because it consumes its output line; the proof-side
      # live report is picked up from budzero's target/relay when the
      # bud-proof suite published one in this run.
      - name: relay (signed canonical-production status report) + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- relay --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- relay
      # Tree-pin: the whole budzero source tree must match its integrity
      # pins (any added/deleted/modified .rs file is a red relay). Pins are
      # committed with the changes they describe; re-pin with `--pin`.
      - name: tree-pin (budzero source-tree integrity) + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- tree-pin --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- tree-pin
      # CI workflow guards: the protected gates must be invoked with their
      # self-test canaries in the workflows (deleting a gate from CI or
      # dropping its canary is a red relay, not a silent pass).
      - name: ci-workflow-guards (security gates are live in CI) + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- ci-workflow-guards --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- ci-workflow-guards
      # A test name is the claim a reader trusts when counting coverage.
      # `pow_empty_block_rejected_by_validation` asserted is_some();
      # `pos_double_producer_address_rejected` asserted both blocks succeed;
      # the four qcblob_quorum tests never called import_qc_blob at all.
      - name: do tests claiming refusal assert the refusal + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- rejection-tests-assert-rejection --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- rejection-tests-assert-rejection
      # A .rs file no `mod` declares is never read by rustc: not linted, not
      # covered, not tested -- while reading like live code in grep and in
      # review. proto_bridge.rs sat there duplicating proto_conversions.rs,
      # and bud-proof/src/memory_air.rs had drifted to an older p3-air API
      # (row_slice vs current_slice) without anything noticing.
      - name: are there orphan source files + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-orphan-source-files --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- no-orphan-source-files
      # Containment-first: a gate that is off by default must stay off, and the
      # path that reaches it must consult it. bud-vm hard-coded
      # MainnetActivation::full() while ContractCall passed mainnet=false, so
      # the staged-rollout flags were dead code and user bytecode never met
      # them.
      - name: containment defaults + canary
        run: |
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- containment-defaults --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- containment-defaults
      - name: buf v1.71.0 kur (sha256 pinli)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/buf \
            https://github.com/bufbuild/buf/releases/download/v1.71.0/buf-Linux-x86_64
          echo "d3de2838c68a5759ca276884254bc70df4e4ad185d6ed5f65f327b6ce6363eab  /tmp/buf" | sha256sum -c -
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version
      - name: buf build + lint
        run: |
          set -o pipefail
          buf build
          buf lint
      - name: "buf breaking: baseline varsa aktif"
        run: |
          set -euo pipefail
          # Main'de buf.yaml yoksa against-resolve "file deleted" yanilgisina duser;
          # The baseline is established by this push -> an honest SKIP marker.
          # On non-main branches there is no 'branch=main' ref -> Repo Lint goes red.
          # The correct form is 'origin/main' (GitHub docs: .git#branch=<remote>/<branch>).
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#branch=origin/main'
            echo "buf breaking: main'e karsi temiz."
          else
            echo "SKIP (durust marker): main'de buf.yaml henuz yok - baseline bu dalgayla kuruluyor."
          fi
      - name: genesis schema gate + canary
        run: |
          python3 ./ops/scripts/check_genesis_schema.py --self-test
          python3 ./ops/scripts/check_genesis_schema.py config/mainnet-genesis.json
