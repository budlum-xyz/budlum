  storage-provider-gate:
    # : StorageProvider trait + mock implementation named tests.
    name: StorageProvider Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: StorageProvider gate canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-provider --self-test
      # The proof-boundary script existed in ops/scripts/ but no job ran it, so it
      # proved nothing about any commit. Wired here rather than into a new job
      # because it is source-only and needs no build.
      - name: Storage proof boundary canary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-proof-production-boundary --self-test
      - name: Storage proof production boundary
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-proof-production-boundary
      - name:  StorageProvider tests
        run: |
          set -euo pipefail
          cargo test --lib 2>&1 | tee /tmp/storage-provider-gate.txt
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- storage-provider /tmp/storage-provider-gate.txt

