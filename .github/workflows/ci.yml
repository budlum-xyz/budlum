  # ============================  / Bolum 4 (BNS gate) ============================
  bns-gate:
    #  Bolum 4 modul-ayrimi: BNS'in kendi CI gate'i (B.U.D. kapi deseni).
    # Isim kanaryasi: bir test silinir/yeniden adlandirilirsa kapi FAIL olur.
