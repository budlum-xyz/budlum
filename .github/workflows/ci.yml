      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: StorageProvider gate canary
        run: bash ./scripts/check-storage-provider-gate.sh --self-test
      # The proof-boundary script existed in scripts/ but no job ran it, so it
      # proved nothing about any commit. Wired here rather than into a new job
      # because it is source-only and needs no build.
      - name: Storage proof boundary canary
        run: bash ./scripts/check-storage-proof-production-boundary.sh --self-test
      - name: Storage proof production boundary
        run: bash ./scripts/check-storage-proof-production-boundary.sh
      - name:  StorageProvider tests
        run: |
          set -euo pipefail
          cargo test --lib 2>&1 | tee /tmp/storage-provider-gate.txt
          bash ./scripts/check-storage-provider-gate.sh /tmp/storage-provider-gate.txt

  node-classification-gate:
    # : full/archive node classification + pruning policy named tests.
    # Name canary prevents a vacuous green if classification tests are renamed/deleted.
    name: Node Classification
    runs-on: ubuntu-latest
