  # ============================ Budscan (web3 tarayici cekirdegi) ============================
  budscan:
    # Budscan does not link against `budlum-core` and duplicates two definitions: the name rule
    # and ContentId. Copies can diverge silently and their divergence is a silent
    # results (the explorer accepts a name the chain does not; or
    # the explorer says a byte verified while the chain computes a different identity).
    # `budscan-name-rule-parity` o iki sessizligi gurultuye ceviriyor.
    name: Budscan (explorer core + patch layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budscan
          workspaces: budscan
      - name: Format
        run: cargo fmt --manifest-path crates/budscan/Cargo.toml --all -- --check
      - name: Clippy (pedantic, -D warnings)
        run: cargo clippy --manifest-path crates/budscan/Cargo.toml --all-targets -- -D warnings
      - name: budscan testleri
        run: cargo test --manifest-path crates/budscan/Cargo.toml
      - name: budscan own canaries
        # The binary runs its own internal canaries: a schema never becomes a name, an empty
        # proof does not say `verified`, a dangling patch does not pass the check.
        run: cargo run --manifest-path crates/budscan/Cargo.toml --bin budscan -- self-test
      - name: Gate canary (proof it is not vacuous)
        run: |
          set -euo pipefail
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- budscan-name-rule-parity --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- budscan-patchset --self-test
      - name: Name rule and ContentId parity
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- budscan-name-rule-parity
      - name: Patch layer (list=disk, no foreign brand)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- budscan-patchset

