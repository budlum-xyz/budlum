# Temporary build-error relay: the log download endpoint is unreachable from
# the authoring environment, so this workflow turns compiler errors into check
# annotations, which the Checks API does expose. It exists only until the
# release build is green again; the deletion is part of the same work.
name: Build error relay

on:
  pull_request:
    branches: [main, consensus-of-consensuses, 'arena/**', ccr-c224ffbb-cbjvam]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-error-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay the release build errors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Build the workspace and relay errors
        run: |
          set +e
          cargo build --release > /tmp/build.log 2>&1
          status=$?
          grep -E "^(error|warning: unused)" /tmp/build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "^\s+-->" /tmp/build.log | head -60 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          exit ${status}

      - name: Build the codec crate alone and relay errors
        if: always()
        run: |
          set +e
          cargo build --release --manifest-path crates/bud-codec/Cargo.toml > /tmp/codec.log 2>&1
          status=$?
          grep -E "^(error|warning: unused)" /tmp/codec.log | head -40 | while IFS= read -r line; do
            echo "::error::codec: ${line}"
          done
          exit ${status}
