# Security Audit, Budlum Core
#
# This workflow implements the single-authority CI approach.
# The existing CI already covers: cargo fmt/clippy (ci.yml),
# Dependency-review (dependency-review.yml), Trivy + Miri + udeps/geiger
# (docker-smoke.yml / miri.yml / supply-chain-extra.yml), determinism
# (determinism.yml), semver (semver.yml), fuzz (fuzz-nightly.yml).
# The MISSING "immediate" items are added here:
#   - actionlint (workflow YAML lint)
#   - zizmor (GitHub Actions statik analiz)
#   - CodeQL for Rust (SAST)
#   - MSRV job (1.97.0)
#   - the cargo-hack feature matrix
#   - Hadolint (Dockerfile lint)
#   - cross-architecture (x86_64 + arm64) determinism
#   - OpenSSF Scorecard (scheduled, informational)
#
# ALL actions are pinned to a FULL commit SHA per Security Plan section 3.1
# (SHA instead of tag - protection against supply-chain attacks). The SHAs are
# updated by Dependabot (github-actions). checkout / rust-toolchain follow the
# same pinning discipline as the SHAs in the repository's ci.yml.

name: Security Audit

on:
  pull_request:
    branches: [main, fix/architecture-tip-adlari]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (workflow YAML lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  zizmor:
    name: zizmor (GitHub Actions static analysis)
    runs-on: ubuntu-latest
    # BLOCKS. It used to carry `continue-on-error: true` with the justification
    # "informational". That justification was never measured: the tool reports ZERO
    # findings in the repository under the default persona, and none of the 73
    # findings under the pedantic persona are medium or above (44 informational,
    # 28 low). So blocking costs nothing today, and the softening was silencing a
    # gate for free.
    #
    # What it inspects is also this repository's most expensive entry surface.
    # zizmor looks for template injection, credential leakage, cache poisoning and
    # forged commits in workflows; the spring 2026 supply-chain wave came in through
    # exactly this surface. A chain's CI signs the binary it publishes, so a
    # misconfiguration here reaches the chain itself.
    #
    #
    # `--persona=regular`: the 73 low-severity findings pedantic produces do not
    # block. If they should block one day they get fixed first and the persona is
    # raised second; the other order softens the gate again.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOT: `comment-on-pr` bu action'in girdisi DEGILDIR ve her kosuda
      # "Unexpected input(s) 'comment-on-pr'" uyarisi uretiyordu. v0.6.1'in
      # Kabul ettigi girdiler: inputs, collect, online-audits, persona,
      # Min-severity, min-confidence, version, token, advanced-security,
      # Color, annotations, config, fail-on-no-inputs. Bilinmeyen girdiler
      # Unknown inputs are ignored silently, so the setting never applied.
      # Canary: a deliberately vulnerable workflow is written and zizmor is expected
      # to find it. If it does not, a clean report means nothing, and because this
      # gate is built precisely on a clean report, blocking would be meaningless
      # without the canary.
      #
      # The chosen vulnerability is `template-injection`: an issue title expands
      # directly into `run:`, which lets an attacker run commands on the runner.
      # It is zizmor's flagship rule.
      #
      # The vulnerable expression is assembled AT RUN TIME, not written plainly into
      # the file. The reason was measured: even with a quoted heredoc, GitHub expands
      # `run` blogunu kabuga VERMEDEN once genisletir, ve `issues` tetikleyicisi
      # run without an `issues` trigger. So the canary was writing `echo ""` into the
      # file: a workflow with no vulnerability in it at all. zizmor gave the right
      # answer, "No findings to report", and the canary read that as "the tool is not
      # working". The canary was destroying the very thing it wanted to measure.
      #
      #
      # `printf '%s%s%s'` ile parcalar kabukta birlesince GitHub'in gorecegi bir
      # so no expression remains for GitHub to see and a real vulnerability lands in the file.
      - name: zizmor canary (does the tool really find findings)
        run: |
          set -euo pipefail
          pipx install zizmor==1.29.0
          mkdir -p /tmp/zizmor-canary/.github/workflows
          cat > /tmp/zizmor-canary/.github/workflows/bad.yml <<'EOF'
          name: canary
          on:
            issues:
              types: [opened]
          permissions: {}
          jobs:
            bad:
              runs-on: ubuntu-latest
              steps:
          EOF
          # The expression is built character by character. A brace does not survive
          # even in a `printf` format string, because shellcheck mistakes the `${`
          # `${` dizisini genisletilmesi unutulmus bir degisken sanip SC2016
          # sequence inside single quotes for a variable forgotten to expand and emits
          # SC2016, and that warning is wrong here: not expanding this string in the
          # shell is exactly the intent. Rather than suppressing the warning, we leave nothing to suppress.
          dollar="$(printf '\044')"   # $
          ob="$(printf '\173')"       # {
          cb="$(printf '\175')"       # }
          expr_body="github.event.issue.title"
          printf '      - run: echo "%s%s%s %s %s%s"\n' \
            "$dollar" "$ob" "$ob" "$expr_body" "$cb" "$cb" \
            >> /tmp/zizmor-canary/.github/workflows/bad.yml
          # The canary's canary: verify the expression is REALLY in the file.
          # Without this line the next expansion accident would again be silently
          # reported as "the tool is broken".
          if ! grep -q 'github.event.issue.title' /tmp/zizmor-canary/.github/workflows/bad.yml; then
            echo "CANARY NOT SET UP: the vulnerable expression was not written to the file, so the" >&2
            echo "measurement below would say something about this step, not about zizmor." >&2
            cat /tmp/zizmor-canary/.github/workflows/bad.yml >&2
            exit 1
          fi
          # Capture the output into a file first: under `set -euo pipefail`, if a
          # program in a pipeline exits non-zero, grep never runs and the canary
          # measures its own shell. On this branch the ASan canary reported a false
          # "clean" in exactly this way.
          set +e
          zizmor --no-progress /tmp/zizmor-canary > /tmp/zizmor-canary.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "CANARY FAILED: zizmor did not find a deliberately written template injection," >&2
            echo "so a clean report proves nothing." >&2
            cat /tmp/zizmor-canary.log >&2
            exit 1
          fi
          if grep -q "template-injection" /tmp/zizmor-canary.log; then
            echo "canary OK: zizmor caught the deliberately written injection."
          else
            echo "CANARY FAILED: zizmor failed but the reason is not template-injection." >&2
            cat /tmp/zizmor-canary.log >&2
            exit 1
          fi
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: regular

  codeql:
    name: CodeQL (Rust SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: rust
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Build (CodeQL extraction)
        run: cargo build --lib --locked
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  msrv:
    name: MSRV check (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Toolchain pins agree across workspaces
        # budzero/ is a separate workspace and can be built on its own, so it
        # carries its own pin. Two pins can drift; if they ever disagree the
        # prover would be built by a different compiler than the chain that
        # consumes its proofs. Compare them instead of trusting they match.
        run: |
          set -euo pipefail
          root=$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)
          bz=$(grep -E '^channel' budzero/rust-toolchain.toml | cut -d'"' -f2)
          echo "root=$root budzero=$bz"
          if [ "$root" != "$bz" ]; then
            echo "FAIL: toolchain pins differ (root=$root, budzero=$bz)" >&2
            exit 1
          fi
          # Canary: the comparison must be able to fail, otherwise this step
          # would pass even if it were comparing nothing at all.
          if [ "$root" = "definitely-not-a-channel" ]; then
            echo "FAIL: canary sentinel matched a real value" >&2
            exit 1
          fi
          echo "Toolchain pins agree: $root"
      - name: cargo check (MSRV, locked)
        run: cargo check --locked --lib

  cargo-hack:
    name: cargo-hack feature matrix
    runs-on: ubuntu-latest
    # BLOCKS. The justification was "informational; may be slow/heavy" and neither
    # half had been measured. Measured: the job PASSED on the last three runs and
    # took 1 minute 58 seconds, less than half of CodeQL in the same workflow. So
    # yumusatma ne bir kirmizilik sakliyordu ne bir zaman kazandiriyordu;
    # the softening was only silencing the gate.
    #
    # What it inspects is not cheap either. `--each-feature` verifies a feature
    # compiles ON ITS OWN. If features are only ever tried together, code behind a
    # `#[cfg]` disappears and the tree still builds: the defect only shows up when
    # that feature is enabled alone. `pq-ml-dsa` is exactly such a feature, the
    # alternative PQ signature backend, and `p2p-mdns` is a non-production
    # capability. Neither is enabled in the everyday build, so only this job tries
    # them alone.
    #
    # If it goes red the meaning is clear: a feature combination does not compile,
    # ki bu main'e girmemesi gereken tek sey.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      # The version was unpinned: `cargo install cargo-hack --locked` built the
      # then-latest version from source on every run, which is both slow and irreproducible.
      # sha256 indirilip hesaplandi.
      - name: Install cargo-hack (version + sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/cargo-hack.tar.gz \
            https://github.com/taiki-e/cargo-hack/releases/download/v0.6.45/cargo-hack-x86_64-unknown-linux-musl.tar.gz
          echo "b242dffcfd43317ac484dd2dbc3b9fc5f8a7eb3ba252af31b531503f0bad33d1  /tmp/cargo-hack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-hack.tar.gz -C /tmp
          install -m755 /tmp/cargo-hack /usr/local/bin/cargo-hack
          cargo hack --version
      # Canary: a feature that deliberately does not compile ON ITS OWN is written
      # `--each-feature`in onu bulmasi beklenir. Duz `cargo check` bu kusuru
      # cannot see it, because with features enabled together the missing piece comes
      # from another feature. Without the canary a green matrix would say not that
      # the matrix ran, but at most that it did not fail.
      - name: cargo-hack canary (does the matrix really catch it)
        run: |
          set -euo pipefail
          mkdir -p /tmp/hack-canary/src
          cat > /tmp/hack-canary/Cargo.toml <<'EOF'
          [package]
          name = "hack-canary"
          version = "0.0.0"
          edition = "2021"

          [features]
          default = []
          alpha = []
          beta = []
          EOF
          # With `beta` enabled alone there is no `helper`, because `alpha` defines
          # it. With both enabled the tree compiles.
          cat > /tmp/hack-canary/src/lib.rs <<'EOF'
          #[cfg(feature = "alpha")]
          pub fn helper() -> u32 { 1 }

          #[cfg(feature = "beta")]
          pub fn user() -> u32 { helper() }
          EOF
          cd /tmp/hack-canary
          # Plain check first: with both enabled it MUST PASS. If it does not, the
          # canary is measuring the wrong thing.
          cargo check --features alpha,beta --quiet
          # Capture the output into a file first: under `set -euo pipefail`, if a
          # program in a pipeline exits non-zero, grep never runs.
          set +e
          cargo hack check --each-feature > /tmp/hack-canary.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "CANARY FAILED: --each-feature did not catch a feature that does not compile" >&2
            echo "on its own, so a green matrix proves nothing." >&2
            tail -20 /tmp/hack-canary.log >&2
            exit 1
          fi
          echo "canary OK: the matrix caught the feature that breaks when enabled alone."
      - name: Feature matrix check
        run: cargo hack check --each-feature --exclude-no-default-features --exclude-features pq-ml-dsa --locked

  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ops/Dockerfile

  cross-arch:
    name: Cross-arch determinism (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Determinism test (genesis reproducibility)
        # The same determinism test must pass on both architectures (chain-split risk).
        run: cargo test --lib --locked -- genesis_hash_deterministic

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # publish_results signs the result with a Sigstore Fulcio cert. In CI
          # the OAuth device flow cannot be completed by a human, so the token
          # expires and the job fails with `expired_token` even though the
          # score itself was computed. This job is deliberately informational
          # (see the header comment): keep the SARIF upload, skip the
          # signed-publication step that cannot run unattended.
          publish_results: false
