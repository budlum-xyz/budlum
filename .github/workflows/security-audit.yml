# Security Audit, Budlum Core
#
# Bu workflow, tek-authority CI yaklaşımını uygular.
# Mevcut CI zaten şunları karşılıyor: cargo fmt/clippy (ci.yml),
# Dependency-review (dependency-review.yml), Trivy + Miri + udeps/geiger
# (docker-smoke.yml / miri.yml / supply-chain-extra.yml), determinism
# (determinism.yml), semver (semver.yml), fuzz (fuzz-nightly.yml).
# Burada EKSİK olan "Hemen" maddeleri ekleniyor:
#   - actionlint (workflow YAML lint)
#   - zizmor (GitHub Actions statik analiz)
#   - CodeQL for Rust (SAST)
#   - MSRV job (1.94.0)
#   - cargo-hack özellik matrisi
#   - Hadolint (Dockerfile lint)
#   - çapraz mimari (x86_64 + arm64) determinizm
#   - OpenSSF Scorecard (zamanlanmış, bilgilendirici)
#
# TÜM action'lar Güvenlik Planı §3.1 gereği TAM commit SHA'sına pinlendi
# (tag yerine SHA - supply-chain'a karşı koruma). SHAtar Dependabot
# (github-actions) ile güncellenir. checkout / rust-toolchain repo'nun
# Ci.yml'deki SHA'larla aynı pinleme disiplinine uyuyor.

name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # haftalık, Pazartesi 03:00 UTC
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (workflow YAML lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  zizmor:
    name: zizmor (GitHub Actions static analysis)
    runs-on: ubuntu-latest
    # BLOKLAR. Onceki hali `continue-on-error: true` tasiyordu, gerekce
    # "bilgilendirici" idi. Bu gerekce olculmemisti: arac depoda varsayilan
    # personada SIFIR bulgu veriyor, ve pedantic personadaki 73 bulgunun
    # hicbiri medium ya da uzeri degil (44 informational, 28 low). Yani
    # bloklamanin maliyeti su an sifir, ve yumusatma bedavaya bir kapiyi
    # susturuyordu.
    #
    # Denetledigi sey de bu deponun en pahali giris yuzeyi. zizmor
    # workflow'lardaki template injection, kimlik bilgisi sizintisi, cache
    # zehirlenmesi ve sahte commit'leri ariyor; 2026 baharindaki tedarik
    # zinciri dalgasi tam olarak bu yuzeyden girdi. Bir zincirin CI'i
    # yayinladigi ikiliyi imzaliyor, yani buradaki bir yanlis yapilandirma
    # zincirin kendisine ulasir.
    #
    # `--persona=regular`: pedantic'in urettigi 73 dusuk siddetli bulgu
    # bloklamaz. Bir gun bloklamalari istenirse once duzeltilir, sonra
    # persona yukseltilir; sirasi tersi olursa kapi yeniden yumusatilir.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOT: `comment-on-pr` bu action'in girdisi DEGILDIR ve her kosuda
      # "Unexpected input(s) 'comment-on-pr'" uyarisi uretiyordu. v0.6.1'in
      # Kabul ettigi girdiler: inputs, collect, online-audits, persona,
      # Min-severity, min-confidence, version, token, advanced-security,
      # Color, annotations, config, fail-on-no-inputs. Bilinmeyen girdiler
      # Sessizce yok sayilir, yani ayar hicbir zaman uygulanmiyordu.
      # Kanarya: bilerek acik bir workflow yazilir ve zizmor'un onu bulmasi
      # beklenir. Bulmazsa temiz rapor bir sey ifade etmez, ve bu kapi tam
      # olarak temiz rapor uzerine kuruldugu icin kanarya olmadan
      # bloklamasinin anlami olmazdi.
      #
      # Secilen acik `template-injection`: bir issue basligi dogrudan `run:`
      # icine genisletiliyor, ki bu saldirganin runner'da komut calistirmasina
      # yol acar. zizmor'un amiral kuralidir.
      - name: zizmor kanaryasi (arac gercekten bulgu buluyor mu)
        run: |
          set -euo pipefail
          pipx install zizmor==1.29.0
          mkdir -p /tmp/zizmor-canary/.github/workflows
          cat > /tmp/zizmor-canary/.github/workflows/bad.yml <<'EOF'
          name: canary
          on:
            issues:
              types: [opened]
          permissions: {}
          jobs:
            bad:
              runs-on: ubuntu-latest
              steps:
                - run: echo "${{ github.event.issue.title }}"
          EOF
          # Ciktiyi once dosyaya al: `set -euo pipefail` altinda bir boru
          # hattinda program sifirdan farkli cikarsa grep hic kosmaz ve
          # kanarya kendi kabugunu olcer. Bu dalda ASan kanaryasi tam olarak
          # boyle yanlis "temiz" raporlamisti.
          set +e
          zizmor --no-progress /tmp/zizmor-canary > /tmp/zizmor-canary.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "KANARYA DUSTU: zizmor bilerek yazilmis template injection'i" >&2
            echo "bulamadi, yani temiz bir rapor hicbir sey kanitlamaz." >&2
            cat /tmp/zizmor-canary.log >&2
            exit 1
          fi
          if grep -q "template-injection" /tmp/zizmor-canary.log; then
            echo "kanarya OK: zizmor bilerek yazilmis enjeksiyonu yakaladi."
          else
            echo "KANARYA DUSTU: zizmor dustu ama sebep template-injection degil." >&2
            cat /tmp/zizmor-canary.log >&2
            exit 1
          fi
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          persona: regular

  codeql:
    name: CodeQL (Rust SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: rust
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Build (CodeQL extraction)
        run: cargo build --lib --locked
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  msrv:
    name: MSRV check (1.94.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Toolchain pins agree across workspaces
        # budzero/ is a separate workspace and can be built on its own, so it
        # carries its own pin. Two pins can drift; if they ever disagree the
        # prover would be built by a different compiler than the chain that
        # consumes its proofs. Compare them instead of trusting they match.
        run: |
          set -euo pipefail
          root=$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)
          bz=$(grep -E '^channel' budzero/rust-toolchain.toml | cut -d'"' -f2)
          echo "root=$root budzero=$bz"
          if [ "$root" != "$bz" ]; then
            echo "FAIL: toolchain pins differ (root=$root, budzero=$bz)" >&2
            exit 1
          fi
          # Canary: the comparison must be able to fail, otherwise this step
          # would pass even if it were comparing nothing at all.
          if [ "$root" = "definitely-not-a-channel" ]; then
            echo "FAIL: canary sentinel matched a real value" >&2
            exit 1
          fi
          echo "Toolchain pins agree: $root"
      - name: cargo check (MSRV, locked)
        run: cargo check --locked --lib

  cargo-hack:
    name: cargo-hack feature matrix
    runs-on: ubuntu-latest
    # Özellik matrisi taraması - bilgilendirici; yavaş/yoğun olabilir.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      # Surum pinsizdi: `cargo install cargo-hack --locked` her kosuda o anki
      # en yeni surumu kaynaktan derliyordu, yani hem yavas hem tekrarlanamaz.
      # sha256 indirilip hesaplandi.
      - name: Install cargo-hack (sürüm + sha256 pinli)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/cargo-hack.tar.gz \
            https://github.com/taiki-e/cargo-hack/releases/download/v0.6.45/cargo-hack-x86_64-unknown-linux-musl.tar.gz
          echo "b242dffcfd43317ac484dd2dbc3b9fc5f8a7eb3ba252af31b531503f0bad33d1  /tmp/cargo-hack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-hack.tar.gz -C /tmp
          install -m755 /tmp/cargo-hack /usr/local/bin/cargo-hack
          cargo hack --version
      - name: Feature matrix check
        run: cargo hack check --each-feature --exclude-no-default-features --exclude-features pq-ml-dsa --locked

  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

  cross-arch:
    name: Cross-arch determinism (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Determinism test (genesis reproducibility)
        # Aynı determinizm testi her iki mimaride de geçmeli (chain-split riski).
        run: cargo test --lib --locked -- genesis_hash_deterministic

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
