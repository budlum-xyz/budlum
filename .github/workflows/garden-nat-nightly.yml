name: Garden NAT

# Garden behind address translation that is real: network namespaces, two
# private networks, two translating routers, the host on the public side.
# The directive runs NAT simulation at night; on-demand dispatch is there so
# a change to Garden can show its result before it merges, without the
# pull-request path paying this battery on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

concurrency:
  group: garden-nat-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.run_attempt == '1' && github.base_ref != 'testnet' && github.base_ref != 'ortak-teslim' && github.base_ref != 'consensus-of-consensuses' }}

permissions:
  contents: read

jobs:
  garden-nat:
    name: Garden NAT (network namespaces, real address translation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-core
      - name: Install protoc and the network tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler iproute2 iptables curl procps
      - name: Gate canary (proof it is not vacuous)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- garden-nat --self-test
      - name: Garden behind real NAT
        run: |
          set -euo pipefail
          cargo test --test garden_nat -- --test-threads=1 2>&1 | tee /tmp/garden-nat.txt
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- garden-nat /tmp/garden-nat.txt
