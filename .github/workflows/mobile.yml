# WP-36/WP-37 CI: Android validator app, unit tests and the device-log analyzer.
# Emulator instrumentation tests (android_onboarding_reaches_registered_state,
# android_workmanager_answers_audit_when_service_stopped) run on manual
# dispatch until the UniFFI mobile-core binding lands in a later WP-36 PR.
# All third-party actions are pinned to a commit SHA (directive 16.2 item 4).
name: mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'crates/budlum-types/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'crates/budlum-types/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon

      - name: Unit tests
        working-directory: mobile/android
        run: gradle testDebugUnitTest --no-daemon

  device-log-analyzer:
    # WP-37: devicetests/golden_reports are reproduced by this std-only tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - name: Log analyzer unit tests
        run: cargo test --manifest-path mobile/tools/log-analyzer/Cargo.toml

  instrumentation-tests:
    # Device/emulator acceptance tests. Manual dispatch only for now; wired
    # into PR gating once the emulator suite exists.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: default
          working-directory: mobile/android
          script: gradle connectedDebugAndroidTest --no-daemon
