name: Mobile Android & Field Harness

on:
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "mobile/tools/**"
      - "src/registry/mobile_runtime.rs"
      - "xtask/gates/src/gates/mobile_validator_apps.rs"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [testnet]
    paths:
      - "mobile/android/**"
      - "mobile/ios/**"
      - "mobile/tools/**"
      - "src/registry/mobile_runtime.rs"
      - "xtask/gates/src/gates/mobile_validator_apps.rs"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: ${{ github.base_ref != 'testnet' && github.base_ref != 'ortak-teslim' }}

jobs:
  android-validator-and-log-analyzer:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: Mobile Log Analyzer & Android Validator Suite
    runs-on: ubuntu-24.04
    # Measured 20.2 min of real work against a 20 min budget: the job was
    # cancelled on its final "Complete job success" step. Headroom, not a
    # looser gate - the step set and assertions are unchanged.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Format, clippy, and golden tests for budlum-mobile-log-analyzer
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mobile/tools/log-analyzer/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path mobile/tools/log-analyzer/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path mobile/tools/log-analyzer/Cargo.toml

      - name: Install protoc
        run: python3 .github/scripts/install_protoc.py

      - name: Test shared mobile runtime
        run: cargo test --lib registry::mobile_runtime::tests --locked -- --nocapture

      - name: Verify mobile application invariants
        run: |
          set -euo pipefail
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- mobile-validator-apps --self-test
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- mobile-validator-apps

      - name: Verify Android manifest & Play policy invariants
        run: |
          set -euo pipefail
          manifest="mobile/android/app/src/main/AndroidManifest.xml"
          gradle_file="mobile/android/app/build.gradle.kts"
          grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$manifest"
          if grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$manifest"; then
            echo "ERROR: REQUEST_IGNORE_BATTERY_OPTIMIZATIONS is forbidden" >&2
            exit 1
          fi
          grep -q 'compileSdk = 36' "$gradle_file"
          grep -q 'targetSdk = 36' "$gradle_file"
          grep -q 'minSdk = 29' "$gradle_file"
          test -s mobile/android/PLAY_DECLARATION.md

      - name: Compile and run  Android Kotlin core & unit test suite
        run: |
          set -euo pipefail
          kotlinc \
            mobile/android/app/src/main/java/network/budlum/validator/core/MobileCoreBridge.kt \
            mobile/android/app/src/main/java/network/budlum/validator/core/KeystoreKeyVault.kt \
            mobile/android/app/src/main/java/network/budlum/validator/core/OemBatteryGuide.kt \
            mobile/android/devicetests/DeviceFieldHarness.kt \
            mobile/android/app/src/test/java/network/budlum/validator/core/JvmMemoryWrappingKeyProvider.kt \
            mobile/android/app/src/test/java/network/budlum/validator/MobileValidatorUnitTest.kt \
            -jvm-target 17 \
            -include-runtime -d /tmp/budlum-mobile-android-tests.jar
          java -ea -cp /tmp/budlum-mobile-android-tests.jar network.budlum.validator.MobileValidatorUnitTest

  android-gradle:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: Android Gradle build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, 2026-08-04
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4, 2025-09-09
        with:
          gradle-version: "8.11.1"
          # The action treats every ref except the default branch as a
          # read-only cache, and this workflow's only traffic today is a pull
          # request, so no run was ever allowed to save state: the Gradle user
          # home and the Gradle distribution were downloaded from scratch on
          # every run. A cold resolve is what let an upstream rate limit turn
          # into a red gate. Write on push and dispatch runs, and keep pull
          # request runs read-only so an unmerged tree cannot seed a cache
          # that a trusted build later restores. The condition is an equality
          # test on the event name: measured on run 44982412549, the negated
          # form made dispatch runs read-only too, which is the opposite of
          # the intent and left every run cold.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK platform 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      # Maven Central parent-POM fetches flake on fresh runners; three
      # bounded attempts separate a network blip from a real build failure.
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          for attempt in 1 2 3; do
            if gradle assembleDebug --no-daemon; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "gradle assembleDebug attempt ${attempt} failed; backing off" >&2
              sleep $((attempt * 45))
            else
              echo "gradle assembleDebug failed after ${attempt} attempts" >&2
            fi
          done
          exit 1
      - name: Run Android unit tests
        working-directory: mobile/android
        run: |
          for attempt in 1 2 3; do
            if gradle testDebugUnitTest --no-daemon; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "gradle testDebugUnitTest attempt ${attempt} failed; backing off" >&2
              sleep $((attempt * 45))
            else
              echo "gradle testDebugUnitTest failed after ${attempt} attempts" >&2
            fi
          done
          exit 1

  android-instrumentation:
    name: Android Keystore and boot instrumentation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, 2026-08-04
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4, 2025-09-09
        with:
          gradle-version: "8.11.1"
          # The action treats every ref except the default branch as a
          # read-only cache, and this workflow's only traffic today is a pull
          # request, so no run was ever allowed to save state: the Gradle user
          # home and the Gradle distribution were downloaded from scratch on
          # every run. A cold resolve is what let an upstream rate limit turn
          # into a red gate. Write on push and dispatch runs, and keep pull
          # request runs read-only so an unmerged tree cannot seed a cache
          # that a trusted build later restores. The condition is an equality
          # test on the event name: measured on run 44982412549, the negated
          # form made dispatch runs read-only too, which is the opposite of
          # the intent and left every run cold.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Measured on the first dispatch runs of this job: the runner reports
      # "hardware acceleration is not available", and the x86 system image the
      # action asked for is not published for this API level
      # ("Failed to find package 'system-images;android-30;default;x86'"), so
      # the emulator never booted and the step died in 36 seconds on
      # `adb emu kill` against a closed port. Give the runner KVM permissions
      # and ask for an architecture that exists.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Keystore and boot instrumentation on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        with:
          api-level: 30
          target: default
          arch: x86_64
          working-directory: mobile/android
          # The action's published input is `script`, not `run`.
          script: gradle connectedDebugAndroidTest --no-daemon

  # The full Android suite above needs the JDK/Android SDK and 20+ minutes; it
  # stays out of the pull-request path on purpose. What a pull request into the
  # product branch can afford is the part that has actually broken review
  # before: a manifest that quietly gains an entitlement, a target SDK that
  # quietly drops, or a validator app that disappears from the registry gate.
  # This job checks exactly those, with no toolchain download, in well under a
  # minute - so the `mobile-validator-apps` gate is never "green because it
  # never ran".
  manifest-and-policy-canary:
    name: Mobile manifest and policy canary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Manifest declares only the reviewed permission set
        run: |
          set -euo pipefail
          manifest=mobile/android/app/src/main/AndroidManifest.xml
          test -f "$manifest" || { echo "::error::missing $manifest"; exit 1; }
          # Every android.permission.* the manifest declares must be one the
          # custody review signed off on (Section 7.9.11). A new permission is
          # a policy change, not a build detail, and must reach review.
          allowed='^(INTERNET|ACCESS_NETWORK_STATE|FOREGROUND_SERVICE|FOREGROUND_SERVICE_SPECIAL_USE|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|USE_BIOMETRIC)$'
          declared=$(grep -oE 'android\.permission\.[A-Z_]+' "$manifest" | sed 's/^android\.permission\.//' | sort -u)
          echo "declared:"; echo "$declared"
          # `grep -v` exits 1 when nothing is left, which is the good case; capture
          # that status explicitly instead of swallowing it with `|| true`.
          bad=""
          if ! bad=$(echo "$declared" | grep -vE "$allowed"); then
            bad=""
          fi
          if [ -n "$bad" ]; then
            echo "::error::unreviewed Android permission(s): $bad"
            exit 1
          fi

      - name: Target SDK and min SDK still match the reviewed floor
        run: |
          set -euo pipefail
          gradle=mobile/android/app/build.gradle.kts
          test -f "$gradle" || { echo "::error::missing $gradle"; exit 1; }
          target=$(grep -oE 'targetSdk *= *[0-9]+' "$gradle" | grep -oE '[0-9]+' | head -1)
          minsdk=$(grep -oE 'minSdk *= *[0-9]+' "$gradle" | grep -oE '[0-9]+' | head -1)
          echo "targetSdk=$target minSdk=$minsdk"
          test -n "$target" || { echo "::error::targetSdk not found"; exit 1; }
          test "$target" -ge 35 || { echo "::error::targetSdk $target is below the reviewed floor 35"; exit 1; }
          test -n "$minsdk" || { echo "::error::minSdk not found"; exit 1; }

      - name: iOS custody contract is intact
        run: |
          set -euo pipefail
          plist=mobile/ios/Info.plist
          test -f "$plist" || { echo "::error::missing $plist"; exit 1; }
          python3 - "$plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as fh:
              plist = plistlib.load(fh)
          # The field harness runs as a background custody observer, never as
          # a foreground camera/biometric app: the reviewed plist carries the
          # bundle identity, the minimum OS and the background task modes. A
          # silent privacy-scope addition (a camera or Face ID usage string)
          # would be a policy change and must reach review, so it fails here.
          required = [
              "CFBundleIdentifier",
              "CFBundleShortVersionString",
              "MinimumOSVersion",
              "UIBackgroundModes",
              "BGTaskSchedulerPermittedIdentifiers",
          ]
          missing = [k for k in required if k not in plist]
          if missing:
              raise SystemExit(f"::error::iOS custody contract keys missing: {missing}")
          forbidden = [k for k in plist if k.endswith("UsageDescription")]
          if forbidden:
              raise SystemExit(
                  f"::error::iOS privacy-scope strings added without review: {forbidden}"
              )
          print("iOS custody contract intact:", sorted(required))
          PY

      - name: Registry gate still covers the mobile validator apps
        run: |
          set -euo pipefail
          gate=xtask/gates/src/gates/mobile_validator_apps.rs
          test -f "$gate" || { echo "::error::missing $gate"; exit 1; }
          grep -qE 'mobile' "$gate" || { echo "::error::$gate no longer references the mobile tree"; exit 1; }
          runtime=src/registry/mobile_runtime.rs
          test -f "$runtime" || { echo "::error::missing $runtime"; exit 1; }
          echo "mobile gate wiring intact"
