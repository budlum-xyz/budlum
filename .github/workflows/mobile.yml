name: Mobile Android & Field Harness

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "mobile/tools/**"
      - "src/registry/mobile_runtime.rs"
      - "xtask/gates/src/gates/mobile_validator_apps.rs"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "mobile/tools/**"
      - "src/registry/mobile_runtime.rs"
      - "xtask/gates/src/gates/mobile_validator_apps.rs"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-validator-and-log-analyzer:
    name: Mobile Log Analyzer & Android Validator Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Format, clippy, and golden tests for budlum-mobile-log-analyzer
        run: |
          set -euo pipefail
          cargo fmt --manifest-path mobile/tools/log-analyzer/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path mobile/tools/log-analyzer/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path mobile/tools/log-analyzer/Cargo.toml

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Test shared mobile runtime
        run: cargo test --lib registry::mobile_runtime::tests --locked -- --nocapture

      - name: Verify mobile application invariants
        run: |
          set -euo pipefail
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- --self-test mobile-validator-apps
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- mobile-validator-apps

      - name: Verify Android manifest & Play policy invariants
        run: |
          set -euo pipefail
          manifest="mobile/android/app/src/main/AndroidManifest.xml"
          gradle_file="mobile/android/app/build.gradle.kts"
          grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
          grep -q 'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$manifest"
          if grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' "$manifest"; then
            echo "ERROR: REQUEST_IGNORE_BATTERY_OPTIMIZATIONS is forbidden" >&2
            exit 1
          fi
          grep -q 'compileSdk = 36' "$gradle_file"
          grep -q 'targetSdk = 36' "$gradle_file"
          grep -q 'minSdk = 29' "$gradle_file"
          test -s mobile/android/PLAY_DECLARATION.md

      - name: Compile and run  Android Kotlin core & unit test suite
        run: |
          set -euo pipefail
          kotlinc \
            mobile/android/app/src/main/java/network/budlum/validator/core/MobileCoreBridge.kt \
            mobile/android/app/src/main/java/network/budlum/validator/core/KeystoreKeyVault.kt \
            mobile/android/app/src/main/java/network/budlum/validator/core/OemBatteryGuide.kt \
            mobile/android/devicetests/DeviceFieldHarness.kt \
            mobile/android/app/src/test/java/network/budlum/validator/MobileValidatorUnitTest.kt \
            -jvm-target 17 \
            -include-runtime -d /tmp/budlum-mobile-android-tests.jar
          java -ea -cp /tmp/budlum-mobile-android-tests.jar network.budlum.validator.MobileValidatorUnitTest

  android-instrumentation:
    name: Android Keystore and boot instrumentation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, 2026-08-04
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4, 2025-09-09
        with:
          gradle-version: "8.9"
      - name: Run Keystore and boot instrumentation on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2, 2026-07-05
        with:
          api-level: 30
          target: default
          working-directory: mobile/android
          # The action's published input is `script`, not `run`.
          script: gradle connectedDebugAndroidTest --no-daemon
