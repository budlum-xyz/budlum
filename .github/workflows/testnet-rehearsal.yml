name: Testnet Rehearsal

# The full local testnet rehearsal on chain 45261:
# - `testnet-native-e2e` (`budlum-tools testnet-rehearsal --local`) boots the
#   PoS validator ring, RPC listener, faucet, explorer indexer, and CLI module
#   scenarios natively on Ubuntu.
# - `rehearsal` (`budlum-tools testnet-rehearsal --compose`) boots the full
#   Docker Compose + Prometheus + Grafana stack from ops/testnet-local.yml.

on:
  push:
    branches: [ main ]
  # Heavy battery. It runs on pull requests to `main` (the PR that merges the
  # stack) and to `testnet` (the branch the product is proven on), on the
  # schedule and on demand.
  #
  # This file used to carry a job-level `base.ref` condition as well, on the
  # reading that GitHub evaluates the `branches` filter of a stacked pull
  # request against the root of the stack. Measured on 2026-11-23 that reading
  # is wrong for the shape this repository has: `pull_request.branches` is
  # matched against the pull request's base branch, so `testnet` in the list is
  # what makes the rehearsal run there, and the condition only made the promise
  # in the file name false - the rehearsal named after the testnet never ran on
  # a testnet pull request. It is removed rather than narrowed: a rehearsal that
  # runs after the merge is not a rehearsal. The runner cost is unchanged
  # (ci-pull-request-fanout-is-budgeted: 24 workflows, 88 jobs, pinned 88)
  # because the list swap replaces one base branch with another instead of
  # adding a trigger.
  pull_request:
    branches: [main, testnet]
  schedule:
    - cron: "17 8 * * *" # daily 08:17 UTC, outside the long heavy windows
  workflow_dispatch:

concurrency:
  group: testnet-rehearsal-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.base_ref != 'testnet' && github.base_ref != 'ortak-teslim' }}

permissions:
  contents: read

jobs:
  testnet-native-e2e:
    name: Testnet Native E2E (chain 45261)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        run: python3 .github/scripts/install_protoc.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-testnet-native-${{ hashFiles('**/Cargo.lock') }}
      - name: Build testnet binaries and tools
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
        run: |
          set -euo pipefail
          cargo build --locked --bin budlum-core --bin bud --bin budlum-faucet --bin budlum-indexer
          cargo build --release --locked --manifest-path xtask/tools/Cargo.toml
      - name: Rehearsal tool canary
        run: ./xtask/tools/target/release/budlum-tools --self-test
      - name: Native Ubuntu chain 45261 E2E rehearsal
        run: |
          set -euo pipefail
          ./xtask/tools/target/release/budlum-tools testnet-rehearsal \
            --local --bin-dir target/debug --report target/testnet-native-rehearsal.md
      - name: Keep native rehearsal report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testnet-native-rehearsal-report
          path: target/testnet-native-rehearsal.md
          if-no-files-found: warn

  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - name: Rehearsal (build, start, scenarios, report)
        run: |
          if ! cargo run --release --manifest-path xtask/tools/Cargo.toml -- testnet-rehearsal --compose --keep --report target/testnet-rehearsal.md; then
            echo "::error::testnet rehearsal failed; container state and logs follow."
            if ! docker compose -f ops/testnet-local.yml ps; then
              echo "::error::\`docker compose ps\` also failed."
            fi
            if ! docker compose -f ops/testnet-local.yml logs --tail=200; then
              echo "::error::\`docker compose logs\` also failed."
            fi
            # The tail above starts long after a stall began. The whole log of
            # every container is kept as an artifact, and the lines that tell
            # what the finality rounds and the fork choice did are printed
            # here, so a failed scenario can be read from its first second.
            mkdir -p target
            if docker compose -f ops/testnet-local.yml logs --no-color --timestamps > target/testnet-rehearsal-containers.log 2>&1; then
              if grep -E 'Started prevote task|prevote quorum|precommit quorum|Finalized|finalized checkpoint|displaced an active round|Reorg|reorg|Refusing to start finality' target/testnet-rehearsal-containers.log > target/testnet-rehearsal-finality.log; then
                echo "finality and fork choice, all containers, in time order:"
                sort -k3,3 target/testnet-rehearsal-finality.log | tail -n 600
              else
                echo "no finality or fork choice line in the container logs"
              fi
            else
              echo "::error::the full container log could not be written."
            fi
            exit 1
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testnet-rehearsal-report
          path: |
            target/testnet-rehearsal.md
            target/testnet-rehearsal-containers.log
          if-no-files-found: warn
      - name: Teardown (always)
        if: always()
        run: |
          set -uo pipefail
          if ! docker compose -f ops/testnet-local.yml down -v --remove-orphans; then
            echo "::warning::teardown failed; the job verdict belongs to the rehearsal step."
          fi
