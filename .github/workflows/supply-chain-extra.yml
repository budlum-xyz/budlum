name: Supply Chain Extra (udeps + geiger)

on:
  push:
    branches: [ main ]
  # Both jobs here are required checks on main. A required check that never
  # runs on a pull request leaves every PR permanently "expected" and
  # unmergeable, so this has to fire on PRs too. The path filter is gone for
  # the same reason: a filtered-out run reports nothing rather than success,
  # which branch protection reads as still-waiting.
  # Heavy battery. It runs on pull requests to `main` (the PR that merges the
  # stack), on the schedule and on demand. A stacked pull request (base
  # `testnet-quantum` or `testnet`) runs the PR gates in ci.yml,
  # security-audit.yml, semgrep.yml and the other light workflows, and skips the
  # jobs of this file through the job-level condition: GitHub evaluates the
  # `branches` filter of a stacked pull request against the root of the stack,
  # so the filter alone does not keep it out. This keeps one push from queueing
  # more work than the shared runner pool can finish before the next push cancels it.
  pull_request:
    branches: [main, consensus-of-consensuses]
  schedule:
    # Weekly hygiene scan (effects of cargo update + new deps)
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Read-only.
concurrency:
  group: supply-chain-extra-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  udeps:
    # Heavy battery: a pull request whose base is `testnet-quantum` or `testnet` does
    # not start this job. See the note at the top of the file.
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON('["main","consensus-of-consensuses"]'), github.event.pull_request.base.ref) }}
    name: "Udeps: the unused dependency gate"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # udeps requires nightly (rustc private API); install + run on the same nightly.
      # DELIBERATE-TOOLCHAIN-DIVERGENCE
      # cargo-udeps needs a nightly compiler, so this job cannot use the stable pin.
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - name: Install cargo-udeps (locked; the crates.io version is evidenced in the log)
        run: cargo +nightly install cargo-udeps --locked
      - name: Canary (vacuous-gate protection)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- udeps --self-test
      # `|| true` used to swallow the tool's exit status entirely, so a
      # cargo-udeps that died at startup produced an empty report and the gate
      # read it as clean. The status is captured instead of discarded: a
      # non-zero exit is tolerated only when the tool still emitted a
      # parseable report (udeps exits non-zero *because* it found unused
      # dependencies, which is a finding, not a failure).
      - name: "Measurement + gate (ratchet: a finding outside the baseline = FAIL)"
        run: |
          set -euo pipefail

          set +e
          cargo +nightly udeps --all-targets > /tmp/udeps1.txt 2>&1
          status1=$?
          set -e
          cat /tmp/udeps1.txt
          if [ "$status1" -ne 0 ] && ! grep -q '^unused dependencies:' /tmp/udeps1.txt; then
            echo "cargo-udeps died with $status1 without producing a parsable report." >&2
            exit "$status1"
          fi
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- udeps /tmp/udeps1.txt

          cd budzero

          set +e
          cargo +nightly udeps --all-targets > /tmp/udeps2.txt 2>&1
          status2=$?
          set -e
          cat /tmp/udeps2.txt
          if [ "$status2" -ne 0 ] && ! grep -q '^unused dependencies:' /tmp/udeps2.txt; then
            echo "cargo-udeps (budzero) died with $status2 without producing a parsable report." >&2
            exit "$status2"
          fi
          cargo run --release --manifest-path ../xtask/gates/Cargo.toml -- udeps /tmp/udeps2.txt

  geiger:
    # Heavy battery: a pull request whose base is `testnet-quantum` or `testnet` does
    # not start this job. See the note at the top of the file.
    if: ${{ github.event_name != 'pull_request' || contains(fromJSON('["main","consensus-of-consensuses"]'), github.event.pull_request.base.ref) }}
    name: "Geiger: unsafe visibility (the first-party 0 evidence layer)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # 35 -> 55: the clean below adds one cold build per workspace until the
    # shared cache saves this job's fresh artifacts again; 35 was sized for a
    # cache-fresh run. The first green run re-establishes the cache and the
    # number can come back down.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - name: Install cargo-geiger (locked; the crates.io version is evidenced in the log)
        run: cargo install cargo-geiger --locked
      - name: Canary (vacuous-gate protection)
        run: cargo run --release --manifest-path xtask/gates/Cargo.toml -- geiger --self-test
      # `|| true` used to swallow EVERY error: even if the scan died halfway the
      # gate counted a truncated report as clean. Removing it was right, but the
      # first fix was too strict - even when the scan completes successfully,
      # cargo-geiger prints "error: Found N warnings" and returns non-zero when it
      # finds `unsafe` in dependencies. Third-party `unsafe` is not this gate's
      # subject (first-party crates already carry `#![forbid(unsafe_code)]`), so that
      # exit code is not a scan failure.
      #
      # The distinction comes from the report: if the report contains a first-party
      # line the scan completed and `budlum-gates geiger` makes the decision; if it
      # does not, the scan really died and the gate already returns an error (the
      # fp_seen == 0 branch). This catches the state `|| true` was hiding without
      # wrongly treating dependency `unsafe` as fatal.
      - name: Measurement + the first-party gate (budlum + budzero)
        run: |
          set -euo pipefail

          # The shared rust-cache restores stale dep-info from earlier builds:
          # after the Plonky3 0.6.3 -> 0.7.0 swap a cached unit's .d file still
          # lists p3-monty-31-0.6.3/src/lib.rs, the source is not on disk, and
          # cargo-geiger dies with Io(NotFound) instead of scanning. Without a
          # clean, every dependency swap breaks this job instead of the scan.
          cargo clean

          set +e
          cargo geiger --all-targets > /tmp/geiger1.txt 2>&1
          status1=$?
          set -e
          cat /tmp/geiger1.txt
          if [ "$status1" -ne 0 ] && ! grep -qE '(budlum-core|bud-[a-z]+) [0-9]' /tmp/geiger1.txt; then
            echo "cargo-geiger died with $status1 without completing the scan:" >&2
            echo "there is not a single first-party line in the report." >&2
            exit "$status1"
          fi
          cargo run --release --manifest-path xtask/gates/Cargo.toml -- geiger /tmp/geiger1.txt

          # budzero is a separate workspace and its root is a VIRTUAL manifest (only
          # [workspace], no package). cargo-geiger refuses to run at such a root:
          # reddediyor: "is a virtual manifest, but this command requires
          # "running against an actual package". So until now this step had not
          # scanned a single crate of budzero - during the `|| true` era this passed
          # silently, and it surfaced once the gate became fail-closed.
          #
          #
          # The fix is scanning crate by crate. Each of the eight members is a real
          # package; their reports are merged and passed through a single gate, so a
          # crate being skipped without being scanned is noticed too.
          cd budzero
          : > /tmp/geiger2.txt
          # Same staleness, second workspace: budzero/target carries the same
          # cached dep-info trap as the root build above.
          cargo clean
          for crate in bud-compiler bud-vm bud-isa bud-state bud-proof bud-node bud-cli verifier-registry; do
            set +e
            # cargo-geiger wants an ABSOLUTE path: given a relative one
            # it says "is not an absolute path. Please provide an absolute path."
            # and exits with 101.
            cargo geiger --all-targets --manifest-path "$PWD/$crate/Cargo.toml" > "/tmp/geiger-$crate.txt" 2>&1
            status2=$?
            set -e
            cat "/tmp/geiger-$crate.txt"
            if [ "$status2" -ne 0 ] && ! grep -qE '(budlum-core|bud-[a-z]+|verifier-registry) [0-9]' "/tmp/geiger-$crate.txt"; then
              echo "cargo-geiger ($crate) died with $status2 without completing the scan:" >&2
              echo "there is not a single first-party line in the report." >&2
              exit "$status2"
            fi
            cat "/tmp/geiger-$crate.txt" >> /tmp/geiger2.txt
          done
          cargo run --release --manifest-path ../xtask/gates/Cargo.toml -- geiger /tmp/geiger2.txt
          cat /tmp/geiger1.txt /tmp/geiger2.txt > /tmp/geiger-all.txt
          cd ..
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- sarif --self-test
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- \
            sarif cargo-geiger /tmp/geiger-all.txt cargo-geiger.sarif
      - name: Upload cargo-geiger SARIF (Security tab)
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: cargo-geiger.sarif
          category: cargo-geiger
