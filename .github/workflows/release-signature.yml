name: Release signature

# The release signature is SLH-DSA-SHAKE-256s over a SHA3-256 manifest of the
# release files (release/README.md). This workflow proves the tool can sign and
# fail (self-test) on every change to it, and verifies a published release
# against the key pinned in the repository when run by hand with a tag.

on:
  pull_request:
    paths:
      - "xtask/release/**"
      - "release/**"
      - ".github/workflows/release-signature.yml"
  push:
    branches: [main]
    paths:
      - "xtask/release/**"
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (leave empty for the self-test only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-signature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-signature:
    name: Release signature (self-test, then verify a tag)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - name: Self-test (sign, verify, and every refusal)
        run: cargo run -q --release --manifest-path xtask/release/Cargo.toml -- --self-test
      - name: Verify a published release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-assets
          cargo run -q --release --manifest-path xtask/release/Cargo.toml -- \
            verify-release release/RELEASE_PUBKEY.hex \
            /tmp/release-assets/RELEASE.manifest /tmp/release-assets/RELEASE.manifest.sig
