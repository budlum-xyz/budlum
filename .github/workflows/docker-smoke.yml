name: Docker Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/Dockerfile'
      - 'config/mainnet.toml'
      - 'ops/docker-compose.yml'
      - 'ops/docker-compose.ci.yml'
      - 'ops/scripts/smoke_rpc.sh'
      - 'ops/scripts/docker-smoke-mainnet.sh'
      - 'ops/scripts/devnet-multinode-smoke.sh'
      - 'src/**'
      - '.github/workflows/docker-smoke.yml'  # Bu workflow degisince smoke+trivy tetiklensin
  pull_request:
    branches: [ main, fix/architecture-tip-adlari ]
  workflow_dispatch:

# Minimal permissions - this workflow only reads (build+scan+smoke).
concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    # security-events: write is required for Trivy IMAGE findings to be uploaded
    # to the Security tab as SARIF. The workflow default is `contents: read`.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build mainnet image
        # docker buildx build -f ops/Dockerfile runner'da 'open Dockerfile' ile
        # (buildx -f resolution). docker compose build calls the same
# context/dockerfile and works the way verified in the devnet smoke test; the
# image is produced as budlum-core:devnet (which is what trivy points at).
        #
        # Build ALL nodes with a SINGLE command: when smoke_rpc.sh later ran
# compose up it built node2-4 without PROTOC and gave 'Could not find protoc'.
# They are all produced here (build.rs finds protoc via protoc_executable);
# smoke_rpc.sh uses the images from cache.
        run: docker compose -f ops/docker-compose.yml build
      - name: Identity evidence - the scanned image is the one just built HERE
        run: |
          docker image inspect budlum-core:devnet --format 'scanned_image_id={{.Id}} size={{.Size}}bytes'
      # Three steps: first produce SARIF (exit code 0 -> the step does not fail),
# then upload to the Security tab, and run the gate last. If a single step gave
# both SARIF and exit code 1, the step would die on a finding and the upload
# would never run; the findings most critical to see would not land in the
# Security tab. The same pattern as the Trivy fs scan in ci.yml.
      - name: Trivy IMAGE scan - produce SARIF (reporting, not a gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: budlum-core:devnet
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
      - name: Trivy IMAGE SARIF yukle (Security sekmesi)
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy IMAGE kapisi (smoke imaji; CRITICAL/HIGH = fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: budlum-core:devnet
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Run RPC smoke (devnet)
        run: |
          chmod +x ops/scripts/smoke_rpc.sh
          SMOKE_NETWORK=devnet SMOKE_RPC_PORT=18546 ./ops/scripts/smoke_rpc.sh || (cat /tmp/budlum-smoke-db/node.log 2>/dev/null; exit 1)
      - name: Run Docker mainnet smoke
        run: |
          chmod +x ops/scripts/docker-smoke-mainnet.sh
          ./ops/scripts/docker-smoke-mainnet.sh || (docker logs budlum-mainnet-smoke-$$ 2>/dev/null; exit 1)

  devnet-multinode-smoke:
    name: Devnet Multi-Node Smoke (4x PoS mesh + metrics + operator-RPC izolasyon)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 4-node compose smoke (mesh/liveness/metrics/RPC-izolasyon)
        run: |
          chmod +x ops/scripts/devnet-multinode-smoke.sh
          ./ops/scripts/devnet-multinode-smoke.sh || { docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml -p budlum-multinode-smoke ps || true; docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml -p budlum-multinode-smoke logs --tail=150 || true; exit 1; }
      - name: Teardown (her durumda)
        if: always()
        run: docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml -p budlum-multinode-smoke down -v --remove-orphans || true
