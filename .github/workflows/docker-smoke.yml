name: Docker Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/Dockerfile'
      - 'config/mainnet.toml'
      - 'ops/docker-compose.yml'
      - 'ops/docker-compose.ci.yml'
      - 'ops/scripts/smoke_rpc.sh'
      - 'ops/scripts/docker-smoke-mainnet.sh'
      - 'ops/scripts/devnet-multinode-smoke.sh'
      - 'src/**'
      - '.github/workflows/docker-smoke.yml'  # Bu workflow degisince smoke+trivy tetiklensin
  pull_request:
    branches: [ main, fix/architecture-tip-adlari ]
  workflow_dispatch:

# Minimal permissions - bu workflow yalniz okur (build+scan+smoke).
concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    # Security-events: write, Trivy IMAGE bulgularinin Security sekmesine
    # SARIF olarak yuklenmesi icin gerekli. Workflow geneli `contents: read`.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build mainnet image
        # docker buildx build -f ops/Dockerfile runner'da 'open Dockerfile' ile
        # dusuyordu (buildx -f cozumlemesi). docker compose build ayni
        # context/dockerfile'i cagirir ve devnet smoke'da dogrulanmis sekilde
        # calisir; imaj budlum-core:devnet olarak uretilir (trivy buna isaret
        # eder).
        # Tum node'lari TEK komutla build et: smoke_rpc.sh sonradan compose up
        # yaptiginda node2-4'u PROTOC'suz build edip 'Could not find protoc'
        # veriyordu. Hepsi burada (build.rs protoc_executable ile protoc'u
        # bulur) uretilir; smoke_rpc.sh imajlari cache'ten kullanir.
        run: docker compose -f ops/docker-compose.yml build
      - name: İmza kanıtı - taranan imaj az önce BURADA build edilen
        run: |
          docker image inspect budlum-core:devnet --format 'taranan_imaj_id={{.Id}} boyut={{.Size}}byte'
      # Uc adimli: once SARIF uret (exit-code 0 -> adim dusmez), sonra Security
      # Sekmesine yukle, en son kapiyi calistir. Tek adimda hem SARIF hem
      # Exit-code 1 verilirse bulgu bulundugunda adim orada olur ve upload hic
      # Calismaz; yani gorulmesi en kritik olan bulgular Security sekmesine
      # Dusmez. ci.yml'deki Trivy fs taramasiyla ayni desen.
      - name: Trivy IMAGE taramasi - SARIF uret (raporlama, kapi degil)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: budlum-core:devnet
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
      - name: Trivy IMAGE SARIF yukle (Security sekmesi)
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy IMAGE kapisi (smoke imaji; CRITICAL/HIGH = fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: budlum-core:devnet
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Run RPC smoke (devnet)
        run: |
          chmod +x ops/scripts/smoke_rpc.sh
          SMOKE_NETWORK=devnet SMOKE_RPC_PORT=18546 ./ops/scripts/smoke_rpc.sh || (cat /tmp/budlum-smoke-db/node.log 2>/dev/null; exit 1)
      - name: Run Docker mainnet smoke
        run: |
          chmod +x ops/scripts/docker-smoke-mainnet.sh
          ./ops/scripts/docker-smoke-mainnet.sh || (docker logs budlum-mainnet-smoke-$$ 2>/dev/null; exit 1)

  devnet-multinode-smoke:
    name: Devnet Multi-Node Smoke (4x PoS mesh + metrics + operator-RPC izolasyon)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 4-node compose smoke (mesh/liveness/metrics/RPC-izolasyon)
        run: |
          chmod +x ops/scripts/devnet-multinode-smoke.sh
          ./ops/scripts/devnet-multinode-smoke.sh || { docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml -p budlum-multinode-smoke ps || true; docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml -p budlum-multinode-smoke logs --tail=150 || true; exit 1; }
      - name: Teardown (her durumda)
        if: always()
        run: docker compose -f ops/docker-compose.yml -f ops/docker-compose.ci.yml -p budlum-multinode-smoke down -v --remove-orphans || true
