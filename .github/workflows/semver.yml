name: Semver Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/architecture-tip-adlari]

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  semver-check:
    # CI Expansion item 5: cargo-semver-checks, public API breakage detection.
    #
    # Hardening (2026-07-21): the old version carried `continue-on-error: true` on
    # both steps, so the gate could NEVER go red (observation mode = decoration).
    # It also had no base mechanism: `check-release` cannot work for `budlum-core`,
    # which is not published to crates.io. The new model:
    #   * Base = `pull_request.base.sha` on a PR, `push.before` on a main push.
    #   * Two separate checkouts (current/baseline) + `--baseline-root`.
    #   * A nightly toolchain (for cargo-semver-checks rustdoc-json generation).
    #   * Gate: `semver` (Rust, xtask/gates) - FAIL if there is a breakage and
    #     `.github/semver-exceptions.txt` is empty. Exception lines follow the
    #     approved, justified "evidenced skip-list" pattern
    #     (the same discipline as .quality/deny.toml [advisories]).
    name: "Semver Check (item 5: public API breakage gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (current)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: current
          persist-credentials: false
      - name: Checkout (baseline = merge base)
        # Skipped when there is no baseline to compare against: on the very
        # first push to a branch `github.event.before` is the all-zero SHA, and
        # asking the remote for that ref fails with "not our ref". The gate
        # step below already treats a missing base as "nothing to compare" and
        # passes with an explicit log line, so the run stays honest rather than
        # red for a reason that has nothing to do with the public API.
        if: >-
          github.event.pull_request.base.sha != '' ||
          (github.event.before != '' &&
           github.event.before != '0000000000000000000000000000000000000000')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          persist-credentials: false
      - name: Install Rust (stable pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - name: Install pinned nightly (rustdoc-json backend for semver-checks)
        # On nightly 'rustdoc' is NOT a separate component, it is part of the rustc
        # component (rustup: exit 1 with "did you mean 'rust-docs'?", 2026-07-21 CI evidence).
        run: rustup toolchain install nightly-2026-07-19 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
          # In the two-checkout layout there is no Cargo.toml at the workspace root;
          # rust-cache's `cargo metadata` call blows up at the root (Error log).
          workspaces: ./current
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Install cargo-semver-checks (locked)
        run: cargo +1.97.1 install cargo-semver-checks --locked
      - name: Gate canary (vacuous-gate protection)
        run: BUDLUM_ROOT="$PWD/current" cargo run --release --manifest-path ./current/xtask/gates/Cargo.toml -- semver --self-test
      - name: Diagnosis (permanent evidence step) - rustdoc-json directly
        # For future silent-crash classes it makes the error body swallowed by the
        # wrapper visible raw (continue-on-error: it does not block the run).
        # NOTE: `-o <dir>` is FORBIDDEN, cargo rustdoc adds --out-dir itself; a
        # second one dies with "Option 'out-dir' given more than once" (2026-07-21
        # local evidence). The JSON lands in target/doc/budlum_core.json.
        continue-on-error: true
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-07-19
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C debuginfo=0"
          RUST_BACKTRACE: "1"
        run: |
          set +e
          cd current
          cargo rustdoc -p budlum-core --lib -- -Z unstable-options --output-format json 2>&1 | tail -60
          echo "RUSTDOC_DIRECT_EXIT: ${PIPESTATUS[0]}"
      - name: Semver gate - budlum-core vs baseline
        env:
          SEMVER_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Root cause (closed, 2026-07-21): the rustdoc-json death came not from
# nightly but from the --all-features heuristic - the pq-dilithium + pq-ml-dsa
# compile_error! lock. Fix: the semver gate runs with --default-features.
# The nightly pin remains mandatory for rustdoc-json's -Z requirement.
          RUSTUP_TOOLCHAIN: nightly-2026-07-19
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C debuginfo=0"
        run: |
          set +e
          if [ -z "${SEMVER_BEFORE}" ] || [ "${SEMVER_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "NO BASE (first push/suspicious state) - the gate is not skipped, PASS with an info log."
            echo "NOTE: budlum-core is not published on crates.io; a base is mandatory."
            exit 0
          fi
          BUDLUM_ROOT="$PWD/current" cargo run --release --manifest-path ./current/xtask/gates/Cargo.toml -- semver ./current ./baseline
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::gate exit=$rc - runner memory snapshot (for OOM evidence):"
            free -m || true
          fi
          exit "$rc"
