name: Kani Slow Proofs (scheduled)
#
# The three slow harnesses moved here from extra-tooling.yml. Under that
# workflow they carried `if: github.event_name == 'schedule'`, so every
# pull request showed the job as a skipped check: a permanent "Skipped"
# entry in the PR check list that read as a broken gate and made the
# green merge state harder to read. A workflow of its own triggers only
# on schedule and workflow_dispatch, so PRs never list it at all.
#
#
on:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The measured fact: these three harnesses call `penalty_for` twice and relate
  # the results, and a solver cannot close two independent 128-bit symbolic
  # multiplications within the CI budget. Deleting them would be the wrong answer:
  # they are the only statements saying that slashing in the tree is monotone.
  # They were moved out of the PR onto the schedule, with a cap of 6 hours based
  # on the real measurement.
  #
  # This job is NOT A GATE, it is a measurement. When it goes red it says not
  # "the property broke" but "still outside the budget", so it does not block the
  # PR yet does not vanish silently either.
  kani-slow-proofs:
    name: Kani Proofs (slow set, scheduled)
    # The header above promises the slow set runs on the schedule only; without
    # this guard it ran on every push and pull request with a six-hour cap and
    # was cancelled by the next push before finishing.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core

      - name: Install Kani (version pinned)
        run: |
          set -euo pipefail
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup

      # Each harness runs and is timed separately. Running them all inside one
      # `cargo kani` meant the first slow one hid the results of the others; that is
      # exactly why this finding was misdiagnosed three times.
      # sebebiydi.
      - name: Slow harnesses, each measured separately
        working-directory: kani
        run: |
          set -uo pipefail
          mapfile -t slow < <(cargo run --release --manifest-path ../xtask/gates/Cargo.toml -- kani --slow-names)
          [ "${#slow[@]}" -gt 0 ] || { echo "no slow harnesses; nothing to measure" >&2; exit 1; }
          {
            echo "| harness | result | seconds |"
            echo "| :-- | :-- | --: |"
          } >> "$GITHUB_STEP_SUMMARY"
          rc_all=0
          for h in "${slow[@]}"; do
            start=$(date +%s)
            # `timeout` returns 124 when the harness hits the cap. That is a
            # measured fact, not a failure, and the step below reports it as
            # TIMEOUT without turning the job red - which is the point of this
            # measurement job. The `if/else` exists because GitHub's default
            # bash shell runs with `-e`: a bare `timeout ...; rc=$?` would let
            # the 124 exit kill the whole job before the classification lines
            # ran, making every TIMEOUT a red run and the alarm meaningless.
            if timeout 6000 cargo kani --harness "$h" --output-format terse \
              > "/tmp/$h.log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            elapsed=$(( $(date +%s) - start ))
            if [ "$rc" -eq 124 ]; then
              result="TIMEOUT"
            elif [ "$rc" -ne 0 ]; then
              result="FAILED($rc)"
              rc_all=1
            elif grep -q '^VERIFICATION:- SUCCESSFUL' "/tmp/$h.log"; then
              result="SUCCESSFUL"
            else
              result="UNKNOWN"
              rc_all=1
            fi
            echo "$h: $result in ${elapsed}s"
            echo "| $h | $result | $elapsed |" >> "$GITHUB_STEP_SUMMARY"
          done
          # If a harness is really BROKEN (FAILED/UNKNOWN) this job goes red.
          # TIMEOUT is the expected state and is reported as measured:
          # counting it as red would turn a known fact into a weekly alarm,
          # and the alarm would lose its meaning.
          exit "$rc_all"
