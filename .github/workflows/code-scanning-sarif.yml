# Security and Quality SARIF uploads for scanners that previously reported only
# via exit codes or plain logs (Hadolint, actionlint, Trivy Config, Clippy,
# cargo-audit, cargo-deny, Aderyn).
#
# Every job follows the repository's two-phase rule:
#   1. Run the tool's canary (`budlum-tools sarif --self-test` where applicable).
#   2. Emit SARIF 2.1.0 and upload via `github/codeql-action/upload-sarif`
#      (`if: always()`) so findings reach the Security tab even on a red run.
#   3. Run the unsoftened gate last so findings block merge (`exit 1`, never
#      `continue-on-error: true` or `|| true`).

name: Security SARIF

on:
  pull_request:
    branches: [main, consensus-of-consensuses, testnet-quantum, testnet]
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-sarif-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static-lint-sarif:
    name: Static Config SARIF (Hadolint + actionlint + Trivy Config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-xtask-tools
          workspaces: xtask/tools
      - name: SARIF converter canary
        run: cargo run --release --manifest-path xtask/tools/Cargo.toml -- sarif --self-test
      - name: Install hadolint v2.14.0 (sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version
      - name: Install actionlint v1.7.12 (sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint --version
      - name: Generate Hadolint SARIF
        run: hadolint --no-fail --format sarif ops/Dockerfile > hadolint.sarif
      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: hadolint.sarif
          category: hadolint
      - name: Generate actionlint SARIF
        run: |
          set -uo pipefail
          set +e
          actionlint -format '{{json .}}' > /tmp/actionlint.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::actionlint failed with status $status before producing JSON"
            exit "$status"
          fi
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- \
            sarif actionlint /tmp/actionlint.json actionlint.sarif
      - name: Upload actionlint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: actionlint.sarif
          category: actionlint
      - name: Generate Trivy Config SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - name: Upload Trivy Config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Enforce Hadolint, actionlint and Trivy Config gates
        run: |
          set -euo pipefail
          hadolint --failure-threshold error ops/Dockerfile
          actionlint
      - name: Enforce Trivy Config gate (CRITICAL/HIGH = fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  rust-sarif:
    name: Rust Security SARIF (Clippy + cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - name: Install cargo-audit and cargo-deny (locked)
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
      - name: SARIF converter canary
        run: cargo run --release --manifest-path xtask/tools/Cargo.toml -- sarif --self-test
      - name: Generate Clippy SARIF
        run: |
          set -uo pipefail
          set +e
          cargo clippy --lib --bins --locked --message-format=json > /tmp/clippy.jsonl
          clippy_status=$?
          set -e
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- \
            sarif clippy /tmp/clippy.jsonl clippy.sarif
          echo "$clippy_status" > /tmp/clippy.status
      - name: Upload Clippy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: clippy.sarif
          category: clippy
      - name: Generate cargo-audit SARIF
        run: |
          set -uo pipefail
          set +e
          cargo audit --json > /tmp/cargo-audit.json
          audit_status=$?
          set -e
          if [ ! -s /tmp/cargo-audit.json ]; then
            echo "::error::cargo-audit exited $audit_status without producing JSON output"
            exit 1
          fi
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- \
            sarif cargo-audit /tmp/cargo-audit.json cargo-audit.sarif Cargo.lock
      - name: Upload cargo-audit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit
      - name: Generate cargo-deny SARIF
        run: |
          set -uo pipefail
          set +e
          cargo deny --config .quality/deny.toml --format json check > /tmp/cargo-deny.jsonl 2>&1
          deny_status=$?
          set -e
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- \
            sarif cargo-deny /tmp/cargo-deny.jsonl cargo-deny.sarif
          echo "$deny_status" > /tmp/cargo-deny.status
      - name: Upload cargo-deny SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: cargo-deny.sarif
          category: cargo-deny
      - name: Enforce Clippy, cargo-audit and cargo-deny gates
        run: |
          set -euo pipefail
          cargo clippy --lib --bins --locked -- -D warnings
          cargo run --release --manifest-path xtask/tools/Cargo.toml -- audit-deps
          cargo deny --config .quality/deny.toml check

  aderyn-sarif:
    name: Aderyn Solidity SAST (SARIF)
    runs-on: ubuntu-latest
    # A cold, locked source build replaces the removed upstream binary asset.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry v1.3.5 and solc 0.8.26 (sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/foundry.tgz \
            https://github.com/foundry-rs/foundry/releases/download/v1.3.5/foundry_v1.3.5_linux_amd64.tar.gz
          echo "9746c51f76c57ee2b099aa67d8b6fb8a93c82175671b654b1b8fd8ddba8e3b42  /tmp/foundry.tgz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar xzf /tmp/foundry.tgz -C "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          echo "d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef  /tmp/solc" | sha256sum -c -
          mkdir -p "$HOME/.svm/0.8.26"
          install -m 0755 /tmp/solc "$HOME/.svm/0.8.26/solc-0.8.26"
      - name: Install Rust for the Aderyn source build
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          # Aderyn uses result_option_map_or_default; match the nightly already
          # used by this repository's Miri jobs rather than enabling bootstrap.
          toolchain: nightly-2026-07-19
      # Upstream no longer publishes the Linux binary archive for this release.
      # Build the same release from its verified source, retaining its lockfile.
      - name: Install Aderyn v0.6.8 (sha256-verified source)
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/aderyn-source.tar.gz \
            https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/source.tar.gz
          echo "2d4afdb52bae30f8488e5d9470a281d284c0b286455b61b474e6c2e7dafe343a  /tmp/aderyn-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/aderyn-source
          tar -xzf /tmp/aderyn-source.tar.gz -C /tmp/aderyn-source --strip-components=1
          cargo +nightly-2026-07-19 install --locked --path /tmp/aderyn-source/aderyn
          aderyn --version
      - name: Run Aderyn Solidity analysis (SARIF)
        run: aderyn contracts --output aderyn.sarif
      - name: Upload Aderyn SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: aderyn.sarif
          category: aderyn
