name: Solidity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, consensus-of-consensuses, 'arena/**']

concurrency:
  group: solidity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compile:
    name: Compile external-domain contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned solc with a pinned checksum: the contracts carry the finality
      # bridge's verification logic, so what CI compiles must be reproducible
      # and must not drift with a floating compiler download.
      - name: Install solc 0.8.26
        run: |
          curl -sSL -o /tmp/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          echo "d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef  /tmp/solc" \
            | sha256sum -c -
          chmod +x /tmp/solc
          sudo mv /tmp/solc /usr/local/bin/solc
          solc --version

      - name: Compile every contract
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/**/*.sol)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .sol files found" >&2
            exit 1
          fi
          solc --bin --abi --optimize --overwrite -o /tmp/solc-out "${files[@]}"
          echo "compiled ${#files[@]} file(s)"

  forge-test:
    name: Foundry tests (F01-F06, Graft, Mikoriza)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: 1.97.1

      # Pinned Foundry release with a pinned checksum, for the same reason as
      # the pinned solc above.
      - name: Install Foundry v1.3.5
        run: |
          curl -sSL -o /tmp/foundry.tgz \
            https://github.com/foundry-rs/foundry/releases/download/v1.3.5/foundry_v1.3.5_linux_amd64.tar.gz
          echo "9746c51f76c57ee2b099aa67d8b6fb8a93c82175671b654b1b8fd8ddba8e3b42  /tmp/foundry.tgz" \
            | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar xzf /tmp/foundry.tgz -C "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install solc 0.8.26 for forge
        run: |
          curl -sSL -o /tmp/solc \
            https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          echo "d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef  /tmp/solc" \
            | sha256sum -c -
          mkdir -p "$HOME/.svm/0.8.26"
          install -m 0755 /tmp/solc "$HOME/.svm/0.8.26/solc-0.8.26"

      # Deployment rule: no Sepolia deployment while any of
      # these is red.
      # Cancun carries neither EIP-2537 nor ML-DSA: refusal and pin tests run
      # here, where a chain with no verification path must refuse.
      - name: "forge test (cancun: refusals, pins, constructor)"
        run: >-
          cargo run --locked --manifest-path xtask/tools/Cargo.toml --
          contracts test --offline
          --no-match-test "a_chain_without_ml_dsa|test_F05_|test_F06_"

      # The BLS-only challenge window needs the real pairing precompile:
      # under prague the classical half verifies for the Rust-generated
      # fixture and ML-DSA stays absent, which is the regime F02/F05/F06
      # pin (pending -> challenge -> settle).
      - name: "forge test (prague: BLS-only challenge window)"
        run: >-
          FOUNDRY_PROFILE=prague
          cargo run --locked --manifest-path xtask/tools/Cargo.toml --
          contracts test --offline
          --match-test "a_chain_without_ml_dsa|test_F05_|test_F06_"

      # Dev EVM: deploy the parameterless contracts to a local anvil
      # chain from an unlocked dev account. No key is used or stored.
      - name: Deploy to a local anvil chain
        run: |
          set -euo pipefail
          anvil --port 8546 --silent &
          for _ in $(seq 1 30); do
            cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break
            sleep 1
          done
          from=$(cast rpc --rpc-url http://127.0.0.1:8546 eth_accounts | tr -d '[]"' | cut -d, -f1)
          forge create --root contracts --offline graft/GraftExecutor.sol:GraftExecutor \
            --rpc-url http://127.0.0.1:8546 --unlocked --from "$from" --broadcast

  # The two Rust contract crates are in the tree and, until this job pair
  # existed, in no workflow: `contracts/object-layer/cosmwasm` and
  # `contracts/object-layer/svm` are standalone Cargo workspaces, so the root
  # `cargo build`, `cargo test --workspace` and `cargo clippy --all-targets`
  # never saw either of them, and the Solidity job above compiles the `.sol`
  # files next to them. Code that ships as a contract and compiles nowhere is
  # code no commit is tested against.
  #
  # Two jobs rather than one matrix, and the path written out in each: the
  # `workflows_cover_every_workspace` gate looks for the workspace path in a
  # build command or a `working-directory`, and a matrix key interpolated as
  # `${{ matrix.dir }}` is not a statement that CI builds that directory. A
  # gate that cannot see the build is the state this job pair exists to end.
  #
  # A host target is enough for the checks: the chain targets need the chain
  # vendors' own toolchains, and the logic under test (the fail-closed verifier,
  # the endpoint state machine) is target-independent.
  contract-cosmwasm:
    name: Object-layer contract crate (cosmwasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: object-layer-cosmwasm
          workspaces: contracts/object-layer/cosmwasm
      - name: Format, lint, build and test
        working-directory: contracts/object-layer/cosmwasm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo build --locked
          cargo test --locked
  contract-svm:
    name: Object-layer contract crate (SVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: object-layer-svm
          workspaces: contracts/object-layer/svm
      - name: Format, lint, build and test
        working-directory: contracts/object-layer/svm
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo build --locked
          cargo test --locked
