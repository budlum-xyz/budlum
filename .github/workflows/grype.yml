# Grype - vulnerability scanning + EPSS prioritization, findings to the Security tab
#
# WHY ON TOP OF THE EXISTING SCANNERS: the repo already has cargo-audit (RustSec),
# cargo-deny (RustSec) and OSV-Scanner (the OSV.dev aggregator). Grype adds two
# Ekliyor:
#
#   1) The EPSS score. A measurable answer to "is this vulnerability exploited in
#      the wild"; present neither in RustSec nor OSV.dev. It changes priority:
#      on the first run yamux CVE-2026-32314 was reported as CVSS 8.7 but EPSS
#      0.5% (36th percentile): high severity, low exploitation likelihood. Without
#      that distinction every "high" finding looks equally urgent.
#
#   2) SARIF output. Today only CodeQL, Semgrep and zizmor write to the Security
#      tab; the Trivy fs scan in the repo produces no SARIF (it only breaks the
#      job via exit code), so dependency findings cannot be tracked from one
#      place. Grype closes that gap.
#
# Gate policy: high and above = FAIL (NO `continue-on-error`). Exceptions live in
# .quality/grype.yaml and are identical to the justifications in .quality/osv-scanner.toml -
# two scanners contradicting each other on the same finding erodes gate trust.
#
# The tool is version + sha256 pinned (the gitleaks/hadolint/actionlint/typos pattern).

name: Grype

on:
  pull_request:
    branches: [main, fix/architecture-tip-adlari]
  push:
    branches: [main]
  schedule:
    # Weekly: a new advisory can be published without the code changing.
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grype:
    name: Grype (NVD + GHSA + EPSS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install grype v0.116.0 (version + sha256 pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/grype.tar.gz \
            https://github.com/anchore/grype/releases/download/v0.116.0/grype_0.116.0_linux_amd64.tar.gz
          echo "40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5  /tmp/grype.tar.gz" | sha256sum -c -
          mkdir -p /tmp/grype-bin
          tar -xzf /tmp/grype.tar.gz -C /tmp/grype-bin grype
          sudo install -m 0755 /tmp/grype-bin/grype /usr/local/bin/grype
          grype version

      # Vacuous-gate protection: "No vulnerabilities found" can mean a clean tree
      # or a scan that could not download the database / never ran at all. The
      # canary produces a synthetic lockfile containing a known vulnerable version
      # and proves the scanner CATCHES it. The repo config is deliberately disabled
      # (an empty file via --config), otherwise the yamux exception in
      # .quality/grype.yaml would silence the canary too and the gate would fool
      # itself.
      - name: Canary - evidence that the Grype alarm works
        run: |
          set -euo pipefail
          mkdir -p /tmp/grype-canary
          printf 'ignore: []\n' > /tmp/grype-canary/empty.yaml
          cat > /tmp/grype-canary/Cargo.lock <<'CANARY'
          version = 3

          [[package]]
          name = "canary-app"
          version = "0.1.0"
          dependencies = ["yamux"]

          [[package]]
          name = "yamux"
          version = "0.12.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          CANARY
          if grype dir:/tmp/grype-canary --fail-on high --config /tmp/grype-canary/empty.yaml -o table; then
            echo "ERROR: Grype failed to catch the canary (yamux 0.12.1 / GHSA-vxx9-2994-q338) -> the scan is untrustworthy (vacuous gate)!"
            exit 1
          fi
          echo "Canary caught -> the Grype alarm works."

      - name: Scan - produce SARIF
        run: grype dir:. --config .quality/grype.yaml -o sarif --file grype.sarif

      - name: Upload SARIF (Security tab)
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: grype.sarif
          category: grype

      # The gate comes AFTER the SARIF upload: the findings land in the Security tab
      # without the upload step being skipped, and then the job turns red.
      - name: Gate - a high or above finding = fail
        run: grype dir:. --config .quality/grype.yaml --fail-on high -o table
