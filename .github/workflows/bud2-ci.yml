name: bud2-ci

on:
  schedule:
    - cron: '41 */6 * * *'   # her 6 saatte (yedek otomasyon)
  workflow_dispatch:
  pull_request:
    paths:
      - "bud/**"
  push:
    branches: [fix/bud2-tamam-2026-08-16]
    paths:
      - "bud/**"

permissions:
  contents: read

jobs:
  skills-inventory:
    name: "1/2 Skill envanteri (varsa) + iskelet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skill doğrulama (bud2/ varsa)
        run: |
          if [ -d bud2 ]; then
            echo "::group::skill envanteri"
            find bud2 -name "*.py" | sort
            if [ -f bud2/core/xor_code.py ]; then python3 bud2/core/xor_code.py 2>&1 | tail -10; fi
            if [ -f bud2/tests/test_iskelet.py ]; then python3 bud2/tests/test_iskelet.py -v 2>&1 | tail -15; fi
            echo "::endgroup::"
          else
            echo "bud2/ yok - skill testleri atlandı (bud asıl hedef)"
          fi
      - name: Varlık kontrolü
        id: check
        run: |
          if [ -d bud ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  build-test:
    name: "2/2 Build + Test (bud)"
    runs-on: ubuntu-latest
    needs: skills-inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-07-16
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build + Test (bud2 default)
        working-directory: bud
        shell: bash
        run: |
          # pipefail ZORUNLU: grep zinciri cargo'nun cikis kodunu yutuyordu
          # (kanit: 3 test FAILED iken adim yesildi; pipefail ile 101)
          set -o pipefail
          cargo build
          cargo test 2>&1 | tee /tmp/t1.log | grep -E "test result|FAILED" | head -10
      - name: Build + Test (bud3 feature)
        working-directory: bud
        shell: bash
        run: |
          set -o pipefail
          cargo build --features bud3
          cargo test --features bud3 2>&1 | tee /tmp/t2.log | grep -E "test result|FAILED" | head -10
