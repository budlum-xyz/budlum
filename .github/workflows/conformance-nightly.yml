name: Conformance Nightly

# Execute compatibility suites and compile the standalone settlement endpoint
# workspaces so cross-environment interfaces are checked by CI. The full two-arch
# battery is weekly; relevant main PRs still run it through the path filter below.

on:
  schedule:
    - cron: "41 0 * * 5" # Friday 00:41 UTC
  workflow_dispatch:

concurrency:
  group: conformance-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.run_attempt == '1' && github.base_ref != 'testnet' && github.base_ref != 'ortak-teslim' && github.base_ref != 'consensus-of-consensuses' }}

permissions:
  contents: read

jobs:
  uel-conformance:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: UEL Conformance & Calibration (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: execution/conformance
          shared-key: uel-conformance-${{ matrix.arch }}
      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - name: Run conformance suites and gas calibration
        shell: bash
        env:
          CONFORMANCE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cargo test --release --manifest-path execution/conformance/Cargo.toml -- --nocapture 2>&1 | tee "conformance-${CONFORMANCE_ARCH}.txt"
          grep -oE "UEL_EXECUTION_ROOT=[0-9a-f]{64}" "conformance-${CONFORMANCE_ARCH}.txt" | tail -1 | cut -d= -f2 > "uel-root-${CONFORMANCE_ARCH}.hex"
          test -s "uel-root-${CONFORMANCE_ARCH}.hex"
          ROOT=$(cat "uel-root-${CONFORMANCE_ARCH}.hex")
          echo "UEL_EXECUTION_ROOT (${CONFORMANCE_ARCH}): ${ROOT}"
          test "${#ROOT}" -eq 64
      - name: Build mock worker binary
        run: cargo build --manifest-path execution/mock/Cargo.toml
      - name: Measure parallel block execution timing
        env:
          CONFORMANCE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib execution::coordinator::scheduler::tests:: -- --nocapture | tee "scheduler-${CONFORMANCE_ARCH}.log"
          # The timing line is printed by one test while the others run, so
          # libtest can glue it onto the end of an unrelated `... ok` line.
          # An anchored `^` match made that race decide the job: x86_64 caught
          # the line at column 0 and aarch64 did not, and the shard failed on
          # its own logging (2026-11-16, Conformance Nightly run 43788838427).
          # The extraction now finds the marker anywhere on a line.
          grep -oE 'PARALLEL_BLOCK_TIMING_JSON=\{[^}]*\}' "scheduler-${CONFORMANCE_ARCH}.log" | head -n1 \
            | sed -e 's/^PARALLEL_BLOCK_TIMING_JSON=//' > "parallel-block-timing-${CONFORMANCE_ARCH}.json"
          test -s "parallel-block-timing-${CONFORMANCE_ARCH}.json"
          cat "parallel-block-timing-${CONFORMANCE_ARCH}.json"
      - name: Upload execution_root digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uel-root-${{ matrix.arch }}
          path: |
            uel-root-${{ matrix.arch }}.hex
            parallel-block-timing-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

  uel-cross-arch-root-compare:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: UEL Cross-Arch Root Compare (x86_64 = aarch64)
    needs: uel-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Collect execution_root artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: uel-root-*
          merge-multiple: true
          path: uel-roots
      - name: Byte-equality gate (uel_cross_arch_roots_equal)
        shell: bash
        run: |
          set -euo pipefail
          ls -l uel-roots/
          for arch in x86_64 aarch64; do
            if [ ! -s "uel-roots/uel-root-${arch}.hex" ]; then
              echo "FAIL: missing execution_root artifact for ${arch}"
              exit 1
            fi
          done
          RX=$(cat uel-roots/uel-root-x86_64.hex)
          RA=$(cat uel-roots/uel-root-aarch64.hex)
          echo "x86_64:  ${RX}"
          echo "aarch64: ${RA}"
          if [ "${RX}" != "${RA}" ]; then
            echo "FAIL: UEL execution_root diverges between x86_64 and aarch64!"
            exit 1
          fi
          echo "OK: UEL execution_root is byte-for-byte identical on x86_64 and aarch64."

  cosmwasm-endpoint:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: CosmWasm settlement endpoint compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/object-layer/cosmwasm
          shared-key: conformance-cosmwasm
      - name: Check the CosmWasm endpoint
        run: |
          set -euo pipefail
          cargo check --manifest-path contracts/object-layer/cosmwasm/Cargo.toml --all-targets
      - name: The endpoint's interface has not drifted
        run: |
          set -euo pipefail
          # The contract must still export the entry points the object layer
          # calls. A check that only compiles cannot see an entry point that
          # was renamed, and a renamed entry point is a runtime failure on the
          # other side of a cross-environment call.
          for entry in instantiate execute; do
            if ! grep -rq "fn ${entry}" contracts/object-layer/cosmwasm/src; then
              echo "::error::the CosmWasm settlement endpoint no longer exports \`${entry}\`"
              exit 1
            fi
          done

  svm-endpoint:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: SVM settlement endpoint compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/object-layer/svm
          shared-key: conformance-svm
      - name: Check the SVM endpoint
        run: |
          set -euo pipefail
          cargo check --manifest-path contracts/object-layer/svm/Cargo.toml --all-targets
      - name: The endpoint's entry point is still the declared program entry
        run: |
          set -euo pipefail
          if ! grep -rq "entrypoint" contracts/object-layer/svm/src; then
            echo "::error::the SVM settlement endpoint declares no program entry point"
            exit 1
          fi

  bud3-fountain-acceptance:
    # The B.U.D. 3.0 fountain directive names 10 000 trials over k in
    # {100, 1000, 4096} at 99.99 % recovery. `bud3_fountain_acceptance` reads
    # `BUDLUM_BUD3_ACCEPTANCE_TRIALS` and defaults to 8 (48 decoded trials),
    # and nothing in `.github/` set that variable, so the directive's figure
    # had never run: at 48 trials the `failures * 10_000 <= decoded` bar admits
    # no drop at all, which is stricter than the claim and weaker as evidence.
    # Heavy battery, so it lives here rather than on the pull-request path
    # (same reason the note at the top of this file gives). The in-tree test
    # `sweep_claims_its_directive` fails when the variable is unset, so this
    # job cannot silently fall back to the default.
    name: B.U.D. 3.0 fountain sweep at the directive's 10 000 trials
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - id: protoc
        name: Install protoc
        if: always() && steps.rust.outcome == 'success'
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bud3-fountain-acceptance
      - name: Fountain sweep, 10 000 trials per loss case
        if: always() && steps.rust.outcome == 'success' && steps.protoc.outcome == 'success'
        env:
          BUDLUM_BUD3_ACCEPTANCE_TRIALS: "10000"
        run: |
          set -euo pipefail
          # Release, not the test profile: `profile.test` inherits
          # `debug-assertions = true` and raptorq's GF(256) setup spends 179 s
          # on a single k=4096 encoder under it. The sweep runs 3 k values x
          # 2 loss models x 10 000 trials.
          cargo test --release --lib storage::bud3::fountain::tests::sweep_claims_its_directive -- --ignored --nocapture 2>&1 | tee /tmp/bud3-acceptance.log
          # A filter that matches nothing exits 0 and looks like a pass.
          if ! grep -qE 'sweep_claims_its_directive \.\.\. ok' /tmp/bud3-acceptance.log; then
            echo "::error::the sweep did not report the test it was asked to run"
            exit 1
          fi
