name: Conformance nightly

# The two endpoint contracts in `contracts/object-layer/` are their own cargo
# workspaces, built by their ecosystems' toolchains: a CosmWasm contract with
# the optimizer, an SVM program with `cargo build-sbf`. Neither is a member of
# the root workspace, so no `cargo` command at the repository root reaches
# them, and until this file existed no job compiled them either. Two
# workspaces whose only reader was a human.
#
# What runs here is the part that needs no ecosystem toolchain: `cargo check`
# against the host target, which is enough to catch the failure these crates
# actually suffer, a dependency or ABI change that stops the contract
# compiling. The packaged build (optimizer for CosmWasm, build-sbf for SVM)
# belongs to the rehearsal and lands with the execution environment packages;
# this file is where it will be added, not a second workflow somewhere else.
#
# Nightly rather than per-pull-request: the contracts change rarely, and the
# full conformance suite of Section 8.13 grows here as the execution
# environments arrive.

on:
  schedule:
    # 02:41 UTC, before the fuzz run at 03:17 so a broken contract does not
    # queue behind four hours of fuzzing on the same runner pool.
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cosmwasm-endpoint:
    name: CosmWasm settlement endpoint compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts/object-layer/cosmwasm
          shared-key: conformance-cosmwasm
      - name: Check the CosmWasm endpoint
        run: |
          set -euo pipefail
          cargo check --manifest-path contracts/object-layer/cosmwasm/Cargo.toml --all-targets
      - name: The endpoint's interface has not drifted
        run: |
          set -euo pipefail
          # The contract must still export the entry points the object layer
          # calls. A check that only compiles cannot see an entry point that
          # was renamed, and a renamed entry point is a runtime failure on the
          # other side of a cross-environment call.
          for entry in instantiate execute; do
            if ! grep -rq "fn ${entry}" contracts/object-layer/cosmwasm/src; then
              echo "::error::the CosmWasm settlement endpoint no longer exports \`${entry}\`"
              exit 1
            fi
          done

  svm-endpoint:
    name: SVM settlement endpoint compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts/object-layer/svm
          shared-key: conformance-svm
      - name: Check the SVM endpoint
        run: |
          set -euo pipefail
          cargo check --manifest-path contracts/object-layer/svm/Cargo.toml --all-targets
      - name: The endpoint's entry point is still the declared program entry
        run: |
          set -euo pipefail
          if ! grep -rq "entrypoint" contracts/object-layer/svm/src; then
            echo "::error::the SVM settlement endpoint declares no program entry point"
            exit 1
          fi
