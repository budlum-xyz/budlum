name: Budlum intent policy

on:
  pull_request:
    branches: [main, testnet-quantum, testnet]
  push:
    branches: [main, budlum-universal]

permissions:
  contents: read

concurrency:
  group: intent-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Intent policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Check format
        run: cargo fmt --manifest-path crates/intent-policy/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path crates/intent-policy/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path crates/intent-policy/Cargo.toml --all-features
      - name: Exercise offline CLI
        run: cargo run --locked --manifest-path crates/intent-policy/Cargo.toml -- crates/intent-policy/examples/payment.route
