name: Determinism

on:
  pull_request:
    # Pull requests into the product branch still pay the full battery; the
    # daily integration pull request into `main` does not - that path is
    # budgeted by `ci-pull-request-fanout-is-budgeted` and the evidence-window
    # owner dispatches this workflow on the wave head instead.
    branches: [consensus-of-consensuses]
  workflow_dispatch:
  push:
    branches: [main]
  # Heavy battery. It runs on the schedule, on demand (the evidence-window
  # owner dispatches it on the wave head) and on pushes to `main`. It is out
  # of the pull-request path on purpose: one push was queueing more work than
  # the shared runner pool could finish, and the budget gate
  # `ci-pull-request-fanout-is-budgeted` pins that path's size.
  # Section 16.2 put this workflow on pull requests; the fan-out budget moved
  # that evidence to dispatched runs per evidence window and the periodic run.
  # The periodic half catches runner-image or toolchain drift with no commit in
  # front of it. It is staggered weekly because this file launches five jobs,
  # including clean rebuilds; daily fan-out was starving live PR gates.
  schedule:
    - cron: "23 0 * * 4" # Thursday 00:23 UTC

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  genesis-reproducibility:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    # CI Expansion item 1: genesis reproducibility check.
    # Build twice, it must produce the same genesis hash.
    name: Genesis Reproducibility (item 1)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-core
      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - name: Build (run 1)
        run: |
          set -euo pipefail
          # The whole rustc output reaches the job log: a red build whose reason
          # lives only in a truncated tail is a red build nobody can diagnose.
          cargo build --release 2>&1 | tee /tmp/build-run1.log; exit "${PIPESTATUS[0]}"
      - name: Genesis hash (run 1)
        run: |
          set -euo pipefail
          cargo test --release --lib -- genesis_hash_deterministic --nocapture 2>&1 | tee /tmp/genesis_run1.txt
          HASH1=$(grep "GENESIS_HASH=" /tmp/genesis_run1.txt | tail -1 | cut -d= -f2)
          echo "Run 1 hash: ${HASH1}"
          test -n "${HASH1}"
          echo "HASH1=${HASH1}" >> "$GITHUB_ENV"
      - name: Clean build cache
        run: cargo clean 2>&1 | tail -3
      - name: Build (run 2)
        run: |
          set -euo pipefail
          cargo build --release 2>&1 | tee /tmp/build-run2.log; exit "${PIPESTATUS[0]}"
      - name: Genesis hash (run 2)
        run: |
          set -euo pipefail
          cargo test --release --lib -- genesis_hash_deterministic --nocapture 2>&1 | tee /tmp/genesis_run2.txt
          HASH2=$(grep "GENESIS_HASH=" /tmp/genesis_run2.txt | tail -1 | cut -d= -f2)
          echo "Run 2 hash: ${HASH2}"
          test -n "${HASH2}"
          echo "HASH2=${HASH2}" >> "$GITHUB_ENV"
      - name: Compare hashes
        run: |
          set -euo pipefail
          echo "Hash 1: ${HASH1}"
          echo "Hash 2: ${HASH2}"
          if [ "${HASH1}" != "${HASH2}" ]; then
            echo "FAIL: Genesis hashes differ!"
            exit 1
          fi
          echo "OK: Genesis hashes match."

  cross-platform-determinism:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    # CI Expansion item 2: cross-platform determinism matrix.
    #
    # Hardening (2026-07-21):
    #   * Windows was added to the matrix (before: Ubuntu + macOS only - the
    #     requirement asks for all three of "Linux/macOS/Windows").
    #   * Real "cross" was closed: each OS used to run and pass its own test but
    #     the OUTPUTS were not compared, so the same request producing a different
    #     consensus result on a different platform (e.g. pointer width, float,
    #     HashMap iteration leakage) could escape this gate. Now every OS uploads
    #     the CONSENSUS_DIGEST value produced by the
    #     `consensus_scenario_digest_cross_platform` test as an artifact, and the
    #     `consensus-digest-compare` job subjects the three platforms' digests to
    #     BYTE EQUALITY. On divergence it is a FAIL (the requirement:
    #     "is the consensus output byte for byte identical").
    name: Cross-Platform Digest (${{ matrix.os }}) (item 2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: budlum-core
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            case "$(uname -m)" in
              aarch64|arm64)
                PROTOC_ZIP=protoc-29.3-linux-aarch_64.zip
                PROTOC_SHA256=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
                ;;
              *)
                PROTOC_ZIP=protoc-29.3-linux-x86_64.zip
                PROTOC_SHA256=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
                ;;
            esac
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ZIP}"
            echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            rm -f /tmp/protoc.zip
          fi
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # When Chocolatey's community feed returns 503 (it did on 2026-08-12) this
# step fails and the determinism gate goes red for a reason unrelated to the
# code. A version + SHA256 pinned install from the official protobuf release
# removes the dependency on a single third-party feed and makes the supply
# chain verifiable too.
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '35.1'
          $sha = '5D3FF218D7D91EEA95F7569BCB5A98F3030F8996D44151279D9772EDCFF76082'
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/protoc-$ver-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip -MaximumRetryCount 5 -RetryIntervalSec 10
          $got = (Get-FileHash protoc.zip -Algorithm SHA256).Hash
          if ($got -ne $sha) { throw "protoc SHA256 mismatch: $got != $sha" }
          Expand-Archive protoc.zip -DestinationPath "$env:RUNNER_TEMP\protoc"
          echo "$env:RUNNER_TEMP\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
      - name: Determinism tests (current suite)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --lib -- determinism --nocapture 2>&1 | tee det-${{ matrix.os }}.txt
          # `grep -c` exits 1 when it matches nothing and >1 when it could not
          # read the file at all. `|| true` collapsed those two into the same
          # thing, and the second one is a missing measurement, not a zero.
          set +e
          N=$(grep -c "^test.*ok$" det-${{ matrix.os }}.txt)
          grep_status=$?
          set -e
          if [ "$grep_status" -gt 1 ]; then
            echo "FAIL: could not read det-${{ matrix.os }}.txt (grep exit $grep_status) - the determinism count is missing, not zero."
            exit 1
          fi
          echo "Determinism test count (${{ matrix.os }}): $N"
          # The count was printed and then dropped, so a filter that selects
          # NOTHING (a renamed test, a moved module, a `--release` build that
          # compiled but ran no determinism case) produced a green step on this
          # platform and the digest comparison below then compared three
          # equally empty runs. The PoA isolation job in ci.yml already pins its
          # count for the same reason; this is the same threshold, measured on
          # the suite as it stands (>= 1 per platform, and identical across the
          # three - the compare job owns that half).
          if [ "${N:-0}" -lt 1 ]; then
            echo "FAIL: no determinism test ran on ${{ matrix.os }} ($N) - a determinism gate that executes nothing is not determinism."
            exit 1
          fi
      - name: Produce the consensus digest
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -- consensus_scenario_digest --nocapture 2>&1 | tee digest-${{ matrix.os }}.txt
          grep -E "^CONSENSUS_DIGEST=[0-9a-f]{64}$" digest-${{ matrix.os }}.txt \
            | tail -1 | cut -d= -f2 > digest-${{ matrix.os }}.hex
          test -s digest-${{ matrix.os }}.hex
          D=$(cat digest-${{ matrix.os }}.hex)
          echo "CONSENSUS_DIGEST (${{ matrix.os }}): $D"
          # False-green lock: the digest must be 64 hex characters.
          test "${#D}" -eq 64
      - name: Upload the digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consensus-digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.hex
          if-no-files-found: error
          retention-days: 30

  consensus-digest-compare:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    # The complement of item 2: the three platform digests must be byte-equal.
    name: Consensus Digest Compare (Linux = macOS = Windows)
    needs: cross-platform-determinism
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Collect the digest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: consensus-digest-*
          merge-multiple: true
          path: digests
      - name: Byte-equality gate
        shell: bash
        run: |
          set -euo pipefail
          ls -l digests/
          U="digests/digest-ubuntu-latest.hex"
          M="digests/digest-macos-latest.hex"
          W="digests/digest-windows-latest.hex"
          for f in "$U" "$M" "$W"; do
            if [ ! -s "$f" ]; then
              echo "FAIL: missing digest artifact: $f"
              exit 1
            fi
          done
          DU=$(cat "$U"); DM=$(cat "$M"); DW=$(cat "$W")
          echo "ubuntu:  $DU"
          echo "macos:   $DM"
          echo "windows: $DW"
          if [ "$DU" != "$DM" ] || [ "$DU" != "$DW" ]; then
            echo "FAIL: the consensus digest differs across platforms!"
            echo "This means consensus output divergence between Linux/macOS/Windows"
            echo "(consensus-critical nondeterminism)."
            exit 1
          fi
          echo "OK: the consensus output is BYTE-EQUAL on all three platforms."

  pq-vector-determinism:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    # the ML-DSA and SLH-DSA vectors (NIST ACVP, Wycheproof, the explicit bug
    # vectors) give every vector the same verdict on every platform. The wallet crate
    # mounts the node's own PQ source files (`crates/wallet-core/src/crypto.rs`), so
    # the very same code and vectors run on wasm32 too. Each platform prints one digest
    # over all verdicts and the compare job demands byte equality.
    name: PQ vectors (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-portable
            os: ubuntu-latest
            rustflags: ""
          - platform: x86_64-native
            os: ubuntu-latest
            rustflags: "-C target-cpu=native"
          - platform: aarch64
            os: ubuntu-24.04-arm
            rustflags: ""
          - platform: wasm32
            os: ubuntu-latest
            rustflags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/testnet' || github.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-09-12
        with:
          toolchain: "1.97.1"
      - name: Install wasmtime (wasm32 only, sha256 pinned)
        if: matrix.platform == 'wasm32'
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          curl -fsSL -o /tmp/wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz
          echo "77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff  /tmp/wasmtime.tar.xz" | sha256sum -c -
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          echo "/tmp/wasmtime-v50.0.0-x86_64-linux" >> "$GITHUB_PATH"
      - name: Run the PQ vectors
        shell: bash
        env:
          PQ_PLATFORM: ${{ matrix.platform }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          if [ "$PQ_PLATFORM" = "wasm32" ]; then
            export CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime
            cargo test --release --manifest-path crates/wallet-core/Cargo.toml --lib --target wasm32-wasip1 pq_vectors_ -- --nocapture 2>&1 | tee "pq-$PQ_PLATFORM.txt"
          else
            cargo test --release --manifest-path crates/wallet-core/Cargo.toml --lib pq_vectors_ -- --nocapture 2>&1 | tee "pq-$PQ_PLATFORM.txt"
          fi
          grep -oE "PQ_VECTOR_DIGEST=[0-9a-f]{64}" "pq-$PQ_PLATFORM.txt" | tail -1 | cut -d= -f2 > "pq-digest-$PQ_PLATFORM.hex"
          test -s "pq-digest-$PQ_PLATFORM.hex"
          D=$(cat "pq-digest-$PQ_PLATFORM.hex")
          echo "PQ_VECTOR_DIGEST ($PQ_PLATFORM): $D"
          test "${#D}" -eq 64
      - name: Upload the digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pq-digest-${{ matrix.platform }}
          path: pq-digest-${{ matrix.platform }}.hex
          if-no-files-found: error
          retention-days: 30

  pq-digest-compare:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    # The complement of pq-vector-determinism: the four platform digests are byte-equal.
    name: PQ Digest Compare (x86_64 = native = aarch64 = wasm32)
    needs: pq-vector-determinism
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Collect the digest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pq-digest-*
          merge-multiple: true
          path: pq-digests
      - name: Byte-equality gate
        shell: bash
        run: |
          set -euo pipefail
          ls -l pq-digests/
          first=""
          for p in x86_64-portable x86_64-native aarch64 wasm32; do
            f="pq-digests/pq-digest-$p.hex"
            if [ ! -s "$f" ]; then
              echo "FAIL: missing digest artifact: $f"
              exit 1
            fi
            d=$(cat "$f")
            echo "$p: $d"
            if [ -z "$first" ]; then
              first="$d"
            elif [ "$d" != "$first" ]; then
              echo "FAIL: the PQ vector verdicts differ across platforms ($p)."
              exit 1
            fi
          done
          echo "OK: every vector has the same verdict on all four platforms."
