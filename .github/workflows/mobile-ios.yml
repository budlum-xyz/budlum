# WP-38 CI: the iOS opportunistic validator (directive 7.10).
#
# Two jobs. The first runs on every change and needs no Apple toolchain beyond
# the one the runner carries: it checks the Swift class parameters against the
# Rust definition and runs the unit tests. The second builds the app target and
# is manual-dispatch only until the Xcode project that wraps
# `Sources/BudlumValidatorUI` lands with WP-38 2/N; the package builds and
# tests without it, which is why the split exists.
name: Mobile iOS

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - 'crates/budlum-types/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'crates/budlum-types/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-tests:
    name: iOS kit tests and Rust parity
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust crate is the definition (WP-11). The script reports green with
      # a written reason while that crate is not in the tree, so this workflow
      # is not blocked on another package landing.
      - name: Class parameters agree with crates/budlum-types
        run: python3 mobile/ios/Scripts/check_class_parity.py --repo .

      - name: Swift version
        run: swift --version

      - name: Unit tests
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          swift test --enable-xctest --disable-swift-testing --verbose --xunit-output /tmp/ios-xunit.xml 2>&1 | tee /tmp/ios-tests.log

      # A `swift test` that runs zero tests exits 0 and looks identical to a
      # pass, and the three names below are the acceptance tests of the WP-38
      # card. Verify via JUnit XML (and verbose XCTest output) so Swift 6 and
      # Swift 5 formatters both report deterministic per-test execution.
      - name: The three named tests of the WP-38 card ran and passed
        run: |
          set -euo pipefail
          python3 - <<'PYCHECK'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse("/tmp/ios-xunit.xml")
          seen = {}
          for tc in tree.iter("testcase"):
              name = tc.attrib.get("name", "")
              failed = (tc.find("failure") is not None) or (tc.find("error") is not None)
              seen[name] = not failed
          for req in ("test_ios_bg_task_answers_audit", "test_ios_quota_cap_is_8_gib", "test_ios_class_is_opportunistic"):
              if not any(req in k and ok for k, ok in seen.items()):
                  print(f"ERROR: {req} did not run and pass (seen={sorted(seen)})", file=sys.stderr)
                  sys.exit(1)
          print(f"Verified {len(seen)} XCTest cases in JUnit report; all 3 WP-38 acceptance tests passed.")
          PYCHECK

  app-build:
    # The Xcode project that turns Sources/BudlumValidatorUI into a shippable
    # app lands with WP-38 2/N, together with the exported TestFlight build.
    if: github.event_name == 'workflow_dispatch'
    name: iOS app build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package for iOS
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme BudlumValidator \
            -destination 'generic/platform=iOS' 2>&1 | tail -20
