name: Mobile iOS Opportunistic Validator

on:
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.base_ref != 'testnet' &&
    github.base_ref != 'ortak-teslim' &&
    github.ref != 'refs/heads/main' &&
    github.ref != 'refs/heads/testnet' &&
    github.ref != 'refs/heads/testnet-50' &&
    github.ref != 'refs/heads/slice' &&
    github.ref != 'refs/heads/consensus-of-consensuses' &&
    github.base_ref != 'testnet-50' &&
    github.base_ref != 'consensus-of-consensuses' }}

jobs:
  ios-opportunistic-validator:
    # Heavy battery: out of the pull-request path on purpose. See the note at
    # the top of the file.
    name: iOS Opportunistic Validator Swift Package Tests
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check iOS/Rust class parity
        working-directory: mobile/ios
        run: python3 Scripts/check_class_parity.py --repo ../..

      - name: Mutation-test the class parity check
        working-directory: mobile/ios
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'

      - name: Build and run iOS Swift test suite
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          swift test
