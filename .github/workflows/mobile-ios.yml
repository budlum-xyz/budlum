# WP-38 CI: the iOS opportunistic validator (directive 7.10).
#
# Two jobs. The first runs on every change and needs no Apple toolchain beyond
# the one the runner carries: it checks the Swift class parameters against the
# Rust definition and runs the unit tests. The second builds the app target and
# is manual-dispatch only until the Xcode project that wraps
# `Sources/BudlumValidatorUI` lands with WP-38 2/N; the package builds and
# tests without it, which is why the split exists.
name: Mobile iOS

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - 'crates/budlum-types/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'crates/budlum-types/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit-tests:
    name: iOS kit tests and Rust parity
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust crate is the definition (WP-11). The script reports green with
      # a written reason while that crate is not in the tree, so this workflow
      # is not blocked on another package landing.
      - name: Class parameters agree with crates/budlum-types
        run: python3 mobile/ios/Scripts/check_class_parity.py --repo .

      - name: Swift version
        run: swift --version

      - name: Unit tests
        working-directory: mobile/ios
        run: swift test --xunit-output /tmp/ios-xunit.xml 2>&1 | tee /tmp/ios-tests.log

      # A `swift test` that runs zero tests exits 0 and looks identical to a
      # pass, and the three names below are the acceptance tests of the WP-38
      # card. Verify them across any SwiftPM JUnit XML files (`/tmp/ios-xunit*.xml`)
      # as well as `/tmp/ios-tests.log` so Swift 5.9 and Swift 6 runner formats
      # on macOS both resolve deterministically.
      - name: The three named tests of the WP-38 card ran and passed
        run: |
          python3 - <<'PYXML'
          import glob
          from pathlib import Path
          import xml.etree.ElementTree as ET

          passed = set()
          for xfile in sorted(glob.glob('/tmp/ios-xunit*.xml')):
              root = ET.parse(xfile).getroot()
              for c in root.iter('testcase'):
                  if c.find('failure') is None and c.find('error') is None and c.find('skipped') is None:
                      passed.add(c.attrib.get('name', ''))

          log_text = Path('/tmp/ios-tests.log').read_text(encoding='utf-8', errors='replace')
          for ln in log_text.splitlines():
              if ' passed' in ln and ('Test Case ' in ln or 'Test ' in ln):
                  passed.add(ln.strip())

          required = [
              'test_ios_bg_task_answers_audit',
              'test_ios_quota_cap_is_8_gib',
              'test_ios_class_is_opportunistic',
          ]
          for req in required:
              if not any(req in entry for entry in passed):
                  raise SystemExit(f'ERROR: {req} did not run and pass (entries={len(passed)})')
          if len(passed) < 20:
              raise SystemExit(f'ERROR: expected >= 20 passing iOS tests, saw {len(passed)}')
          print(f'Verified {len(passed)} passing iOS XCTest entries including all 3 WP-38 acceptance tests.')
          PYXML

  app-build:
    # The Xcode project that turns Sources/BudlumValidatorUI into a shippable
    # app lands with WP-38 2/N, together with the exported TestFlight build.
    if: github.event_name == 'workflow_dispatch'
    name: iOS app build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the package for iOS
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme BudlumValidator \
            -destination 'generic/platform=iOS' 2>&1 | tail -20
