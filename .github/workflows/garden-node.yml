name: Garden node

# The node binary itself, built so a Garden can be stood up and watched.
#
# The sandbox the agent works in cannot compile this crate: it has under two
# gigabytes of memory and no swap, and a full build is killed by the OOM
# reaper. A runner has enough, so the binary is cut here and carried back
# as an artifact.
on:
  push:
    branches: [garden-node-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Build budlum-core
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          VERSION=29.3
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${VERSION}/protoc-${VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d "$HOME/protoc"
          chmod +x "$HOME/protoc/bin/protoc"
          echo "PROTOC=$HOME/protoc/bin/protoc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: garden-node-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: garden-node-${{ runner.os }}-

      # The release profile in Cargo.toml asks for fat LTO and one codegen
      # unit, which is right for a shipped build and far too slow for this
      # one. Only those two knobs are relaxed: panic=abort and
      # overflow-checks, which are the hardening the profile exists for,
      # stay exactly as the repository sets them.
      - name: Build the node
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
        run: |
          cargo build --locked --release --bin budlum-core
          ls -la target/release/budlum-core
          ./target/release/budlum-core --help | head -40

      - name: Check it answers for itself
        run: |
          BIN=target/release/budlum-core
          echo "size: $(du -h $BIN | cut -f1)"
          sha256sum "$BIN"
          file "$BIN" || true

      - name: Upload the node
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: budlum-core-linux-x86_64
          path: target/release/budlum-core
          if-no-files-found: error
          retention-days: 30
