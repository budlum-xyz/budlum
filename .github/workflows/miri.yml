name: Miri UB Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Haftalık gece koşusu, sürekli UB denetimi
  schedule:
    - cron: '0 3 * * 1'  # Her Pazartesi 03:00 UTC

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  miri-crypto:
    # CI Genişletme Madde 4: Miri undefined behavior denetimi.
    # Crypto ve budzero modüllerinde UB arar.
    #
    # Sertleştirme (2026-07-21): nightly artık TARİH-PİNLİ
    # (nightly-2026-07-19). Öncesi "nightly" kayan etiket → Miri revizyon
    # Değişince aynı commit'in CI sonucu değişebiliyordu (dışsal kırmızı
    # Riski + reprodüksiyon zafiyeti). Pin kaldırımı/güncellenmesi yalnızca
    # Commit mesajında gerekçeyle yapılır (MSRV pin disipliniyle aynı ruh).
    # Not: src/ ve budzero'da `#![forbid(unsafe_code)]` + 0 unsafe temiz
    # Tabanı var; bu kapı bağımlılık zinciri üzerinden yüzeyleşen UB ve
    # MIR-düzeyi hatalar için erken uyarıdır.
    name: Miri UB Denetimi (crypto + budzero, nightly-2026-07-19) (Madde 4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust with Miri
        run: |
          rustup toolchain install nightly-2026-07-19 --component miri
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: budlum-core
          cache-on-failure: true
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Miri - crypto crate
        run: |
          echo "Running Miri on crypto module..."
          cargo +nightly-2026-07-19 miri test -p budlum-core --lib -- crypto 2>&1 | tee /tmp/miri-crypto.txt
          echo "Miri crypto: $(grep -c 'test result: ok' /tmp/miri-crypto.txt || echo '0') suites passed"
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Miri - budzero bud-vm
        run: |
          echo "Running Miri on bud-vm module..."
          cargo +nightly-2026-07-19 miri test -p bud-vm --lib 2>&1 | tee /tmp/miri-budvm.txt
          echo "Miri bud-vm: $(grep -c 'test result: ok' /tmp/miri-budvm.txt || echo '0') suites passed"
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Miri - storage module
        run: |
          echo "Running Miri on storage module..."
          cargo +nightly-2026-07-19 miri test -p budlum-core --lib -- storage 2>&1 | tee /tmp/miri-storage.txt
          echo "Miri storage: $(grep -c 'test result: ok' /tmp/miri-storage.txt || echo '0') suites passed"
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        continue-on-error: true  # storage sled bağımlılığı Miri ile uyumsuz olabilir

  careful:
    # cargo-careful: Miri'nin yetismedigi yerde UB arar.
    #
    # Ikisi ayni seyi yapmiyor ve ikisi de gerekli. Miri MIR'i yorumluyor:
    # cok kapsamli ama yavas, ve FFI ile sistem cagrisi iceren kodu
    # calistiramiyor. cargo-careful gercek makinede kosuyor, standart
    # kutuphaneyi debug_assertions ile derliyor ve rustc'ye ek calisma-ani
    # kontrolleri koyduruyor. Yani Miri'nin giremedigi yollari kapsiyor,
    # karsiliginda daha az UB sinifi goruyor.
    #
    # Bu agacta src/ ve budzero `#![forbid(unsafe_code)]` tasiyor, yani
    # aranan sey birinci-taraf unsafe degil: bagimlilik zincirinden yuzeye
    # cikan UB ve std'nin performans sebebiyle kapattigi iddialar.
    #
    # BLOKLAR. Kanaryasi var: bilerek hizalanmamis bir okuma yazilir ve
    # careful'in onu yakalamasi beklenir. Yakalamazsa arac calismiyor
    # demektir ve temiz kosu bir sey ifade etmez.
    name: cargo-careful (UB, gercek makinede)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (nightly, tarih-pinli)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: nightly-2026-07-19
          components: rust-src
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: careful
      - name: protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: cargo install cargo-careful
        run: cargo install cargo-careful --locked --version 0.4.7

      - name: Kanarya (arac gercekten yakaliyor mu)
        run: |
          set -euo pipefail
          mkdir -p /tmp/careful-canary/src
          cat > /tmp/careful-canary/Cargo.toml <<'EOF'
          [package]
          name = "careful-canary"
          version = "0.0.0"
          edition = "2021"
          EOF
          cat > /tmp/careful-canary/src/main.rs <<'EOF'
          // Hizalanmamis okuma: std bunu yalnizca debug_assertions ile
          // yakalar, ki cargo-careful'in std'yi oyle derlemesinin sebebi bu.
          fn main() {
              let buf = [0u8; 16];
              let p = buf.as_ptr().wrapping_add(1).cast::<u32>();
              let v = unsafe { p.read_unaligned() };
              // read_unaligned guvenli; asil ihlali asagida yapiyoruz.
              let bad = unsafe { std::ptr::read(p) };
              println!("{v} {bad}");
          }
          EOF
          cd /tmp/careful-canary
          if cargo +nightly-2026-07-19 careful run 2>&1 | tee /tmp/careful.log \
             | grep -qiE "misaligned|unaligned|undefined behavior"; then
            echo "kanarya OK: cargo-careful hizalanmamis okumayi yakaladi."
          else
            echo "KANARYA DUSTU: cargo-careful bir UB'yi yakalayamadi, yani bu is" >&2
            echo "temiz kossa da bir sey kanitlamaz." >&2
            tail -20 /tmp/careful.log >&2
            exit 1
          fi

      - name: cargo careful test (lib)
        run: cargo +nightly-2026-07-19 careful test --lib
