name: Miri UB Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/architecture-tip-adlari]
  # A weekly nightly run, continuous UB inspection
  schedule:
    - cron: '0 3 * * 1'  # Her Pazartesi 03:00 UTC

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  miri-crypto:
    # CI Expansion item 4: Miri undefined behavior inspection.
    # It looks for UB in the crypto and budzero modules.
    #
    # Hardening (2026-07-21): nightly is now DATE-PINNED (nightly-2026-07-19).
    # Previously "nightly" was a floating tag, so when the Miri revision changed the
    # CI result of the same commit could change (external-red risk + reproduction
    # weakness). Removing or updating the pin is only done with a justification in
    # the commit message (the same spirit as the MSRV pin discipline).
    # Note: src/ and budzero carry `#![forbid(unsafe_code)]` and a clean 0-unsafe
    # base; this gate is an early warning for UB surfacing through the
    # dependency chain and for MIR-level errors.
    name: Miri UB Inspection (crypto + budzero, nightly-2026-07-19) (item 4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly Rust with Miri
        run: |
          rustup toolchain install nightly-2026-07-19 --component miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: budlum-core
          cache-on-failure: true
      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: Miri - crypto crate
        run: |
          set -euo pipefail
          echo "Running Miri on crypto module..."
          cargo +nightly-2026-07-19 miri test -p budlum-core --lib -- crypto 2>&1 | tee /tmp/miri-crypto.txt
          # A Miri run that passes ZERO suites is indistinguishable from a Miri
          # run that never executed a test: both print a green step. The count
          # was printed and then thrown away (`|| echo '0'` made the empty case
          # the quietest one of all), so the number is turned into a threshold.
          # `grep -c` exits 1 when it matches nothing and >1 when it could not
          # read the file at all. `|| true` collapsed those two into the same
          # thing, and the second one is a missing measurement, not a zero.
          set +e
          n=$(grep -c 'test result: ok' /tmp/miri-crypto.txt)
          grep_status=$?
          set -e
          if [ "$grep_status" -gt 1 ]; then
            echo "::error::could not read /tmp/miri-crypto.txt (grep exit $grep_status) - the Miri crypto count is missing, not zero."
            exit 1
          fi
          echo "Miri crypto: $n suites passed"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::Miri crypto reported $n passing suites - a UB gate that inspects nothing is not a pass."
            exit 1
          fi
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Miri - budzero bud-vm
        # `bud-vm` is a member of the `budzero/` workspace, not of the root
        # manifest (the root only path-depends on it), so the step runs from
        # there; from the root `-p bud-vm` resolves through the dependency
        # graph, which is not the same selection.
        working-directory: budzero
        run: |
          set -euo pipefail
          echo "Running Miri on bud-vm module..."
          cargo +nightly-2026-07-19 miri test -p bud-vm --lib 2>&1 | tee /tmp/miri-budvm.txt
          # A Miri run that passes ZERO suites is indistinguishable from a Miri
          # run that never executed a test: both print a green step. The count
          # was printed and then thrown away (`|| echo '0'` made the empty case
          # the quietest one of all), so the number is turned into a threshold.
          # `grep -c` exits 1 when it matches nothing and >1 when it could not
          # read the file at all. `|| true` collapsed those two into the same
          # thing, and the second one is a missing measurement, not a zero.
          set +e
          n=$(grep -c 'test result: ok' /tmp/miri-budvm.txt)
          grep_status=$?
          set -e
          if [ "$grep_status" -gt 1 ]; then
            echo "::error::could not read /tmp/miri-budvm.txt (grep exit $grep_status) - the Miri bud-vm count is missing, not zero."
            exit 1
          fi
          echo "Miri bud-vm: $n suites passed"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::Miri bud-vm reported $n passing suites - a UB gate that inspects nothing is not a pass."
            exit 1
          fi
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Miri - storage module
        run: |
          set -euo pipefail
          echo "Running Miri on storage module..."
          # NAMED, DATED EXCLUSION (2026-09-23). Every test below opens a real
          # sled database, and sled's `Config::open` calls `libc::getrlimit`
          # (sys_limits.rs:37) to size its cache. Miri cannot call foreign
          # functions at all, so these abort with "unsupported operation" - not
          # undefined behaviour, and not something this repository can fix
          # without vendoring sled.
          #
          # This is the exact case the note below anticipated, and it revises
          # that note's own evidence. Miri aborts the whole binary on the FIRST
          # such error, so `set -euo pipefail` ended the step right there: while
          # `continue-on-error` was in place this step was not succeeding nine
          # times out of nine, it was FAILING nine times and being recoloured
          # green. Verified in the log of run 35836929417, one of the nine
          # counted as a success: same `getrlimit` abort, same line. The step
          # never reached its own count, so the storage module has not been
          # inspected for UB at any point in that window.
          #
          # Skipping the 20 FFI-bound tests lets the rest of the storage module
          # - the pure serialization, hashing and state-machine logic, which is
          # where UB would actually hide - be inspected for the first time. The
          # skipped behaviour is still covered by the normal (non-Miri) test
          # run in CI; only the UB inspection of them is impossible.
          cargo +nightly-2026-07-19 miri test -p budlum-core --lib -- storage \
            --skip chain::blockchain::tests::startup_loads_consensus_state_from_storage \
            --skip chain::storage_economics_tests::test_storage_maintenance_fail_closed_regression \
            --skip chain::storage_economics_tests::storage_economics_state_persists_across_restart \
            --skip storage::db::tests::test_durable_commit_batch_and_recovery \
            --skip storage::db::tests::a_commit_without_bridge_state_carries_the_live_snapshot_forward \
            --skip storage::db::tests::corrupt_height_markers_are_reported_not_read_as_zero \
            --skip storage::db::tests::backup_restore_roundtrip_is_integrity_checked_and_non_destructive \
            --skip storage::db::tests::load_mempool_txs_drops_corrupt_entries_without_aborting_startup \
            --skip storage::db::tests::content_store_roundtrip_and_rejects_wrong_cid \
            --skip storage::db::tests::sled_open_with_retry_waits_for_lock_release \
            --skip storage::db::tests::sled_open_with_retry_reports_persistent_contention \
            --skip storage::db::tests::json_is_no_longer_accepted_where_only_bincode_is_written \
            --skip storage::db::tests::removing_the_fallback_does_not_make_bincode_strict \
            --skip storage::db::tests::a_corrupt_schema_version_refuses_to_boot \
            --skip tests::chaos::test_chaos_settlement_state_survives_storage_reload \
            --skip tests::settlement_prod::multi_consensus_settlement_state_round_trips_through_storage \
            --skip tests::settlement_prod::storage_reload_skips_malformed_consensus_domains \
            --skip tests::settlement_prod::storage_reload_skips_commitments_for_unknown_or_mismatched_domains \
            --skip tests::settlement_prod::storage_reload_skips_global_headers_with_broken_hash_chain \
            --skip tests::settlement_prod::bridge_state_roots_round_trip_through_storage_after_lock \
            2>&1 | tee /tmp/miri-storage.txt
          # A Miri run that passes ZERO suites is indistinguishable from a Miri
          # run that never executed a test: both print a green step. The count
          # was printed and then thrown away (`|| echo '0'` made the empty case
          # the quietest one of all), so the number is turned into a threshold.
          # `grep -c` exits 1 when it matches nothing and >1 when it could not
          # read the file at all. `|| true` collapsed those two into the same
          # thing, and the second one is a missing measurement, not a zero.
          set +e
          n=$(grep -c 'test result: ok' /tmp/miri-storage.txt)
          grep_status=$?
          set -e
          if [ "$grep_status" -gt 1 ]; then
            echo "::error::could not read /tmp/miri-storage.txt (grep exit $grep_status) - the Miri storage count is missing, not zero."
            exit 1
          fi
          echo "Miri storage: $n suites passed"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::Miri storage reported $n passing suites - a UB gate that inspects nothing is not a pass."
            exit 1
          fi
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        # `continue-on-error: true` was here with the note "the storage sled
        # dependency may be incompatible with Miri" - a hedge against a failure
        # mode that has not occurred. Measured 2026-09-23 over the last nine
        # completed runs of this workflow (35723653191, 35734888884,
        # 35741876626, 35751380632, 35758105670, 35763407003, 35769354578,
        # 35835976509, 35836929417): this step succeeded in all nine.
        #
        # So the softening was not protecting the job from a flaky dependency,
        # it was standing between undefined behaviour in the storage layer and
        # a red check - on the one module whose job is to persist consensus
        # state. If sled ever does become Miri-incompatible the honest response
        # is a named, dated exclusion of the offending test, not a blanket
        # "whatever happens here does not count".

      # Miri's own output is the only thing that makes a red Miri check
      # fixable, and it lives on the log host. The commands above already tee to
      # /tmp, so re-reading those files costs nothing: same bytes, nine lines,
      # verdict unchanged.
      - name: Miri failure surface (annotations)
        if: failure()
        run: |
          set +o pipefail
          for f in /tmp/miri-crypto.txt /tmp/miri-budvm.txt /tmp/miri-storage.txt; do
            [ -s "$f" ] || continue
            sed -e 's/\x1b\[[0-9;]*m//g' "$f" \
              | grep -E "error|Undefined Behavior|panicked|test result|FAILED|failures:" \
              | head -n 9 | sed -e "s@^@::error::$f @"
          done

  asan:
    # An alternative to cargo-careful. With the pinned nightly the 0.4.7 tool
# cannot build a sysroot (std moved `panic_unwind` behind `dep:` while the tool
    # as a feature). Moving nightly to suit the tool would mean giving up the
# still asks for it implicitly as a feature).
    #
    # So the tool was not taken, the work the tool does was. cargo-careful does two
# things: it builds std with debug_assertions and adds extra run-time checks.
# Both can be obtained directly with flags:
    #
    #   -Zbuild-std                build std from source
    #   -Zsanitizer=address        catch memory errors at run time
    #   -Cdebug-assertions=on      re-enable the assertions std turns off for
    #                              performance
    #
    # Let the coverage difference be honest: cargo-careful additionally enables some
    # rustc checks, while ASan sees memory errors it does not. The two are not
    # identical, but the gap covers most of what would otherwise stay uncovered in
    # the tool's absence: what Miri
# cannot execute: paths containing FFI and system calls.
    #
    # BLOCKS. It has a canary.
    name: AddressSanitizer + debug std (in place of careful)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (nightly, tarih-pinli)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-07-16
        with:
          toolchain: nightly-2026-07-19
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: asan
      - name: protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      # Canary: a program that deliberately accesses freed memory is written and
      # ASan is expected to catch it. If it does not, the tool is not working.
      # means the tool is not working and a clean run means nothing. The same thing
      # was missing for years in the TSan job: "no error" could not be told apart
      # from "the binary never ran".
      - name: ASan canary (does the tool really catch it)
        run: |
          set -euo pipefail
          mkdir -p /tmp/asan-canary/src
          cat > /tmp/asan-canary/Cargo.toml <<'EOF'
          [package]
          name = "asan-canary"
          version = "0.0.0"
          edition = "2021"
          EOF
          cat > /tmp/asan-canary/src/main.rs <<'EOF'
          // Access to freed memory. If ASan does not see this the scan is
          // not trustworthy.
          fn main() {
              let p = {
                  let v = vec![1u8, 2, 3, 4];
                  v.as_ptr()
              };
              let x = unsafe { *p };
              println!("{x}");
          }
          EOF
          cd /tmp/asan-canary
          export RUSTFLAGS="-Zsanitizer=address"
          # Capture the output into a file FIRST, search SECOND.
          #
          # The first version was `cargo run ... | tee log | grep -q ...` and it
          # did not work under `set -euo pipefail`: when the program
          # exited non-zero pipefail killed the pipeline there, grep never ran, and
          # the canary said "it could not catch it". ASan actually
          # had caught it; the shadow byte dump was right there in the log. So the canary
          # was measuring its own shell logic rather than the tool.
          #
          # This command is EXPECTED TO FAIL: it runs an intentional memory
          # error. The verdict belongs to the grep below, and that one blocks.
          #
          # But `|| true` did more than tolerate the expected failure - it also
          # erased the exit code, so a canary that never compiled and a canary
          # that ASan correctly aborted looked identical here. The status is
          # captured and printed as evidence instead; a canary that exits ZERO
          # is its own finding, because a deliberate use-after-free that runs
          # cleanly means the sanitizer is not instrumenting anything.
          set +e
          cargo +nightly-2026-07-19 run -Zbuild-std \
            --target x86_64-unknown-linux-gnu > /tmp/asan-canary.log 2>&1
          canary_status=$?
          set -e
          echo "ASAN_CANARY_EXIT: $canary_status (non-zero is expected here)"
          if [ "$canary_status" -eq 0 ]; then
            echo "CANARY FAILED: the deliberate memory error ran to a CLEAN EXIT," >&2
            echo "so ASan is not instrumenting this binary at all." >&2
            tail -25 /tmp/asan-canary.log >&2
            exit 1
          fi
          if grep -qiE "AddressSanitizer|use-after-free|stack-use-after-scope" \
               /tmp/asan-canary.log; then
            echo "canary OK: ASan caught the deliberately written memory error."
          else
            echo "CANARY FAILED: ASan could not catch a memory error, so even a clean run" >&2
            echo "of this job proves nothing." >&2
            tail -25 /tmp/asan-canary.log >&2
            exit 1
          fi

      - name: ASan + debug std (lib testleri)
        run: |
          set -euo pipefail
          export RUSTFLAGS="-Zsanitizer=address -Cdebug-assertions=on"
          export ASAN_OPTIONS="detect_leaks=0"
          # `| tee` is safe here and only here: the job runs under
          # `set -euo pipefail`, so a non-zero cargo exit still fails the step.
          # Where that setting is absent the same rewrite silently turns a red
          # ASan run green (this file's canary step records exactly that bug).
          cargo +nightly-2026-07-19 test --lib -Zbuild-std \
            --target x86_64-unknown-linux-gnu -- --test-threads=1 \
            2>&1 | tee /tmp/asan-lib.log
      - name: ASan failure surface (annotations)
        if: failure()
        run: |
          set +o pipefail
          if [ -s /tmp/asan-lib.log ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/asan-lib.log \
              | grep -E "ERROR|runtime error|SUMMARY|panicked|test result|error\[" \
              | head -n 9 | sed -e "s@^@::error::@"
            printf '::error::%s log lines; first 9 matching shown\n' "$(grep -c '' /tmp/asan-lib.log)"
          else
            echo "::error::/tmp/asan-lib.log is empty - the ASan step died before it produced output, which means the build of the sanitizer harness failed and its log is on the log host."
          fi