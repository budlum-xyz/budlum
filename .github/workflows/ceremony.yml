# WP-46 ceremony rehearsal regressions and the pre-merge syntax canaries.
# The Python harness is std-only; it needs no toolchain beyond the runner's
# python3. The Rust gate itself runs in ci.yml through `--all --self-test`.
name: ceremony

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'ops/rehearsal/**'
      - 'config/rehearsal-genesis.json'
      - 'tests/review/**'
      - 'ops/scripts/rust_syntax_gate_replica.py'
      - '.github/workflows/ceremony.yml'
  pull_request:
    paths:
      - 'ops/rehearsal/**'
      - 'config/rehearsal-genesis.json'
      - 'tests/review/**'
      - 'ops/scripts/rust_syntax_gate_replica.py'
      - '.github/workflows/ceremony.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ceremony-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rehearsal ceremony black-box regressions
        run: python3 tests/review/rehearsal_ceremony_regressions.py .
      - name: Rust syntax gate replica self-test
        run: python3 ops/scripts/rust_syntax_gate_replica.py --self-test
      - name: Rust syntax gate replica over the tree
        run: python3 ops/scripts/rust_syntax_gate_replica.py
