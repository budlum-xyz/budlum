# (supply-chain): weekly dependency oversight.
# github-actions: opens updates for SHA-pinned actions as PRs.
# cargo: the root + budzero + fuzz manifests. docker: Dockerfile digest pins.
#
# Grouping (2026-07-22): minor+patch cargo updates are collected into a single
# PR, which reduces the PR backlog (it prevents the old "7 open dependabot PRs"
# situation). Major updates stay as separate PRs (they need careful review - for
# example a breaking change such as bincode 1 -> 3).
# Cooldown (zizmor: dependabot-cooldown): 7 days minimum, a supply-chain mitigation.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Collect minor+patch Rust deps into one PR; major stays separate.
      rust-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # bincode is pinned to 1.x on purpose, not by neglect. Its output feeds
      # `Block::calculate_hash` (slashing evidence) and the account state root
      # (tokenomics, timed_burn, burn_reserve), so the encoding IS consensus.
      # A major bump that changes a single byte would make old and new nodes
      # derive different hashes from identical state and fork the chain.
      # Revisit only together with a coordinated wire-format migration.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/budzero"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # bincode is pinned to 1.x on purpose, not by neglect. Its output feeds
      # `Block::calculate_hash` (slashing evidence) and the account state root
      # (tokenomics, timed_burn, burn_reserve), so the encoding IS consensus.
      # A major bump that changes a single byte would make old and new nodes
      # derive different hashes from identical state and fork the chain.
      # Revisit only together with a coordinated wire-format migration.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Same consensus reasoning as the root manifest: the fuzz targets encode
      # the very types whose bincode bytes are hashed, so they must stay on the
      # same major as the crate they exercise.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
      # Hickory-proto 0.25 remains only in the explicit devnet `p2p-mdns`
      # Feature graph. Production/default builds do not compile or construct the
      # MDNS behaviour. Keep the advisory visible until upstream libp2p-mdns is
      # Compatible with hickory >=0.26; unlike the former list, already-patched
      # Lru/gossipsub/yamux dependencies are NOT hidden from Dependabot.
      - dependency-name: "hickory-proto"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: "docker"
    # The Dockerfile lives under ops/; with directory: "/" Dependabot ERRORED
    # with "No Dockerfiles nor Kubernetes YAML found in /".
    directory: "/ops"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
