# Names of the generated bindings. The Android app (namespace
# `network.budlum.validator` in #92 and #97) imports the Kotlin package; the iOS app
# imports the Swift module, whose C module is then
# `BudlumMobileCoreFFI`, the name #100's binding adapter expects.

[bindings.kotlin]
package_name = "network.budlum.validator.core"
cdylib_name = "budlum_mobile_ffi"

[bindings.swift]
module_name = "BudlumMobileCore"
