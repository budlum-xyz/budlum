# Names of the generated bindings. The Android app (WP-36, namespace
# `dev.budlum.validator` in #92 and #97) imports the Kotlin package; the iOS app
# (WP-38, #100) imports the Swift module, whose C module is then
# `BudlumMobileCoreFFI`, the name #100's binding adapter expects.

[bindings.kotlin]
package_name = "dev.budlum.validator.core"
cdylib_name = "budlum_mobile_ffi"

[bindings.swift]
module_name = "BudlumMobileCore"
